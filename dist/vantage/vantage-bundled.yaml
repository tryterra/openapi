    dna_result.schema:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: https://api.tryterra.co/vantage/schemas/dna-result.schema.json
      title: Terra DNA result
      description: 'One supplier-neutral DNA result per order item. Every supplier adapter produces this shape (DECISIONS.md R1-R13). Every declared key is always present: an unknown value is null and an empty list is [], so a client can tell ''not reported'' from a missing key. Enum lists are non-exhaustive: new values are additive.'
      type: object
      additionalProperties: false
      required:
        - supplier
        - result_version
        - report
        - supplier_capabilities
        - screening
        - findings
        - raw_data
      properties:
        supplier:
          description: The lab supplier that produced the result, e.g. nucleus or selfdecode.
          type: string
          pattern: ^[a-z][a-z0-9_]*$
        result_version:
          description: Starts at 1 and goes up each time the supplier re-analyses the sample (DECISIONS.md L3).
          type: integer
          minimum: 1
        report:
          $ref: '#/components/schemas/report'
        supplier_capabilities:
          $ref: '#/components/schemas/supplier_capabilities'
        screening:
          description: 'One summary per category and method, so a negative result is explicit: a category with tested > 0 and positive = 0 was screened clear, while a category missing here was not screened (DECISIONS.md R8).'
          type: array
          items:
            $ref: '#/components/schemas/screening'
        findings:
          description: Every reported finding. Carrier findings sort first (DECISIONS.md R9).
          type: array
          items:
            $ref: '#/components/schemas/finding'
        raw_data:
          description: Raw genome files the supplier holds. They never travel through the API (DECISIONS.md R13).
          type: array
          items:
            $ref: '#/components/schemas/raw_data'
        extensions:
          $ref: '#/components/schemas/extensions'
      $defs:
        category:
          description: What kind of finding (DECISIONS.md R4).
          type: string
          enum:
            - carrier
            - monogenic
            - disease_risk
            - pgx
            - trait
            - longevity
            - ancestry
        system:
          description: A body system the finding touches (DECISIONS.md R5).
          type: string
          enum:
            - performance
            - metabolic
            - cognitive
            - immune
            - detox
            - hormone
        method:
          description: 'How a finding was screened: snv_indel (sequence variants), cnv (copy number), repeat_expansion, polygenic_score, star_allele (pharmacogenomic haplotypes).'
          type: string
          enum:
            - snv_indel
            - cnv
            - repeat_expansion
            - polygenic_score
            - star_allele
        date_or_date_time:
          description: An RFC 3339 date-time, or a full date when the supplier reports only the day.
          anyOf:
            - type: string
              format: date-time
            - type: string
              format: date
        nullable_string:
          type:
            - string
            - 'null'
        extensions:
          description: Supplier-only extras, keyed by supplier name (DECISIONS.md R6). Their shape is the supplier's and is not covered by API versioning.
          type: object
          propertyNames:
            pattern: ^[a-z][a-z0-9_]*$
          additionalProperties:
            type: object
        report:
          type: object
          additionalProperties: false
          required:
            - version
            - ordering_physician
            - specimen_received_at
            - released_at
            - url
          properties:
            version:
              description: The supplier's pipeline or report version.
              $ref: '#/components/schemas/nullable_string'
            ordering_physician:
              $ref: '#/components/schemas/nullable_string'
            specimen_received_at:
              anyOf:
                - $ref: '#/components/schemas/date_or_date_time'
                - type: 'null'
            released_at:
              anyOf:
                - $ref: '#/components/schemas/date_or_date_time'
                - type: 'null'
            url:
              description: Where the full supplier report can be read. Clinical findings that stay with the supplier are read here.
              anyOf:
                - type: string
                  format: uri
                - type: 'null'
        supplier_capabilities:
          description: What this supplier can report at all, so a category missing from screening and findings reads as 'not offered' rather than 'clear'.
          type: object
          additionalProperties: false
          required:
            - categories
            - methods
          properties:
            categories:
              type: array
              uniqueItems: true
              items:
                $ref: '#/components/schemas/category'
            methods:
              type: array
              uniqueItems: true
