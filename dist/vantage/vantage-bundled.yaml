openapi: 3.1.0
info:
  contact: {}
  description: |-
    Authenticate with your Terra API credentials — HTTP Basic with your Terra **dev-id** as the username and your **API key** as the password (the `dev-id` + `x-api-key` header pair is also accepted). Selected product enforcement requires a current Vantage grant for orders, results and lab work. Missing grants or disabled environments return 403 with code entitlement_required or environment_disabled; unavailable current authorization returns 503 with code authorization_unavailable. Configuration, catalogue and recovery remain authenticated.

    **Versioning.** The API is versioned by date. Send `X-Terra-Version: <date>` on a request to choose the version it is served in; without the header you get your account's pinned version. An account is pinned to the latest version on its first request, and you can change the pin to any supported version in the Terra dashboard or through the admin API (`PUT /api/v3/admin/environments/{dev_id}/vantage/api-version`). Every response, and every webhook delivery, carries `X-Terra-Version` stating the version it was rendered in. An unsupported value returns 400 with code `invalid_api_version`. Supported versions: `2026-10-15` (latest; string IDs and enums, the `data`/`has_more`/`next_cursor` list envelope, 200 on an idempotent replay, error types on the docs site), `2026-10-01` (typed catalogue variants) and `2026-09-27` (catalogue attribute bags and integer availability). This document describes the latest version.
  title: Terra Vantage API
  version: 2026.10.08.6
servers:
  - url: https://vantage.tryterra.co
paths:
  /api/v1/orders/activate:
    get:
      operationId: getActivationPage
      summary: Serve kit activation page
      tags:
        - activation
      security: []
      description: Returns an HTML page for end users to activate their test kit and provide test-taker information
      parameters:
        - $ref: '#/components/parameters/ApiVersion'
        - name: kit_id
          in: query
          description: Supplier Kit ID from test kit packaging
          required: true
          schema:
            type: string
      responses:
        '200':
          headers:
            X-Terra-Version:
              $ref: '#/components/headers/ApiVersion'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          description: HTML activation form
          content:
            text/html:
              schema:
                type: string
        '400':
          headers:
            X-Terra-Version:
              $ref: '#/components/headers/ApiVersion'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          description: Invalid kit ID. An unsupported `X-Terra-Version` also returns 400 with code `invalid_api_version`.
          content:
            text/html:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '500':
          headers:
            X-Terra-Version:
              $ref: '#/components/headers/ApiVersion'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          description: Internal server error
          content:
            text/html:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
    post:
      operationId: activateKit
      summary: Activate a test kit
      tags:
        - activation
      security: []
      description: Registers test-taker details with the supplier and updates order item status. This endpoint is called after the test-taker receives their kit and provides their information.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivationContextDTO'
        description: Activation details including test-taker info
        required: true
      parameters:
        - $ref: '#/components/parameters/ApiVersion'
      responses:
        '200':
          headers:
            X-Terra-Version:
              $ref: '#/components/headers/ApiVersion'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          description: Kit activated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivateKitResponse'
        '400':
          headers:
            X-Terra-Version:
              $ref: '#/components/headers/ApiVersion'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          description: Invalid request body or kit already activated. An unsupported `X-Terra-Version` also returns 400 with code `invalid_api_version`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          headers:
            X-Terra-Version:
              $ref: '#/components/headers/ApiVersion'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          description: Kit not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '409':
          headers:
            X-Terra-Version:
              $ref: '#/components/headers/ApiVersion'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          description: Kit already activated, or another activation of the same kit is still in progress; retry shortly.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '500':
          headers:
            X-Terra-Version:
              $ref: '#/components/headers/ApiVersion'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '503':
          headers:
            X-Terra-Version:
              $ref: '#/components/headers/ApiVersion'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          description: Supplier service unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /api/v1/clients/webhook-url:
    get:
      operationId: getWebhookUrl
      summary: Get the registered webhook URL
      tags:
        - clients
      description: The currently registered webhook destination for this environment ("" when none).
      x-required-token-scope: vantage:read
      security:
        - BasicAuth: []
        - DataBearer: []
          DevIDHeader: []
      parameters:
        - $ref: '#/components/parameters/ApiVersion'
      responses:
        '200':
          headers:
            X-Terra-Version:
              $ref: '#/components/headers/ApiVersion'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          description: Current destination
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientResponse'
        '400':
          $ref: '#/components/responses/InvalidApiVersion'
        '500':
          headers:
            X-Terra-Version:
              $ref: '#/components/headers/ApiVersion'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '503':
          headers:
            X-Terra-Version:
              $ref: '#/components/headers/ApiVersion'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          description: Current authorization is unavailable; retry after the dependency recovers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
    patch:
      operationId: updateWebhookUrl
      summary: Update webhook URL
      tags:
        - clients
      description: |
        Update or clear the webhook URL for the authenticated client. The
        webhook URL must use HTTPS if provided, or can be empty to clear it.
        Note this means webhooks will no longer be sent to your previous
        endpoint.

        Deliveries to your endpoint carry an `X-Terra-Signature` header of the
        form `t=<timestamp>,v1=<hex-hmac>` where `t` is the send time in Unix
        seconds and `v1` is `HMAC-SHA256(secret, t + "." + payload)` — the
        same scheme as all Terra webhooks. Verify by recomputing the HMAC
        from the received `t` and the raw body.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateWebhookUrlRequest'
        description: Webhook URL update request
        required: true
      x-required-token-scope: vantage:write
      security:
        - BasicAuth: []
        - DataBearer: []
          DevIDHeader: []
      parameters:
        - $ref: '#/components/parameters/ApiVersion'
      responses:
        '200':
          headers:
            X-Terra-Version:
              $ref: '#/components/headers/ApiVersion'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          description: Webhook URL updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientResponse'
        '400':
          headers:
            X-Terra-Version:
              $ref: '#/components/headers/ApiVersion'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          description: Bad request - invalid URL format or validation error. An unsupported `X-Terra-Version` also returns 400 with code `invalid_api_version`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '401':
          headers:
            X-Terra-Version:
              $ref: '#/components/headers/ApiVersion'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          description: Unauthorized - invalid client credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationError'
        '404':
          headers:
            X-Terra-Version:
              $ref: '#/components/headers/ApiVersion'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          description: Client not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '500':
          headers:
            X-Terra-Version:
              $ref: '#/components/headers/ApiVersion'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '503':
          headers:
            X-Terra-Version:
              $ref: '#/components/headers/ApiVersion'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          description: Current authorization is unavailable; retry after the dependency recovers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /api/v1/orders:
    get:
      operationId: listOrders
      summary: List orders
      tags:
        - orders
      description: Keyset-paginated index of your orders, newest first. Pass the returned next_cursor to fetch the following page; has_more is false and next_cursor null on the last page.
      x-required-token-scope: vantage:read
      security:
        - BasicAuth: []
        - DataBearer: []
          DevIDHeader: []
      parameters:
        - $ref: '#/components/parameters/ApiVersion'
        - name: limit
          in: query
          required: false
          description: Page size. Values above 100 are treated as 100.
          schema:
            type: integer
            minimum: 1
            default: 25
        - name: cursor
          in: query
          required: false
          description: order_id from the previous page's next_cursor
          schema:
            type: string
            example: '333410942627700736'
        - name: since
          in: query
          required: false
          description: Only orders created at/after this RFC3339 timestamp.
          schema:
            type: string
            format: date-time
        - name: until
          in: query
          required: false
          description: Only orders created at/before this RFC3339 timestamp.
          schema:
            type: string
            format: date-time
        - name: client_order_reference_id
          in: query
          required: false
          description: Only orders with exactly this client_order_reference_id. Use it to find an order you created when you did not keep its order_id.
          schema:
            type: string
            example: ORDER-2024-001
        - name: missing
          in: query
          required: false
          description: true = only delivered/completed orders with at least one item whose results aren't in yet (the overview's "missing results" set).
          schema:
            type: boolean
            default: false
        - name: status
          in: query
          required: false
          description: Filter by order status string (e.g. order.processing)
          schema:
            type: string
        - name: collection_type
          in: query
          required: false
          schema:
            type: string
            enum:
              - AT_HOME
              - GO_TO_LAB
      responses:
        '200':
          headers:
            X-Terra-Version:
              $ref: '#/components/headers/ApiVersion'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          description: One page of orders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListOrdersResponse'
        '400':
          headers:
            X-Terra-Version:
              $ref: '#/components/headers/ApiVersion'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          description: Invalid pagination or filter parameters. An unsupported `X-Terra-Version` also returns 400 with code `invalid_api_version`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '401':
          headers:
            X-Terra-Version:
              $ref: '#/components/headers/ApiVersion'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          description: Missing or invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '500':
          headers:
            X-Terra-Version:
              $ref: '#/components/headers/ApiVersion'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '503':
          headers:
            X-Terra-Version:
              $ref: '#/components/headers/ApiVersion'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          description: Current authorization is unavailable; retry after the dependency recovers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
    post:
      operationId: createOrder
      summary: Create a new order
      tags:
        - orders
      description: Create a new blood, DNA, or device test order. Products that are disabled in your catalog cannot be ordered and are rejected with 403; so are products not offered in the environment you call, with code `product_unavailable`. Payment is authorized then captured as part of order creation; if authorization fails, nothing is created and a 402 is returned.
      x-required-token-scope: vantage:write
      security:
        - BasicAuth: []
        - DataBearer: []
          DevIDHeader: []
      parameters:
        - $ref: '#/components/parameters/ApiVersion'
        - name: Idempotency-Key
          in: header
          required: false
          description: Optional Stripe-style idempotency key. Replaying the same key with the same request body returns the original order with 200, without creating or charging again; the same key with a different body returns 409. If the original request failed before a supplier order was created or any payment was captured (for example a 402, a 403 catalogue rejection, or a 422 `order_not_approved`), the same key and body runs the request again. A key longer than 255 characters returns 400 with code `idempotency_key_too_long`. Versions before 2026-10-15 answer a replay with 201 and accept a longer key.
          schema:
            type: string
            maxLength: 255
            example: a1b2c3d4-order-2024-001
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
        description: Order creation request
        required: true
      responses:
        '200':
          headers:
            X-Terra-Version:
              $ref: '#/components/headers/ApiVersion'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          description: 'Idempotent replay: the Idempotency-Key and body match an order already created, which is returned unchanged. Nothing is created or charged.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateOrderResponse'
        '201':
          headers:
            X-Terra-Version:
              $ref: '#/components/headers/ApiVersion'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          description: Order created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateOrderResponse'
        '400':
          headers:
            X-Terra-Version:
              $ref: '#/components/headers/ApiVersion'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          description: Bad request - invalid JSON or validation errors. An unsupported `X-Terra-Version` also returns 400 with code `invalid_api_version`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateOrderValidationError'
        '402':
          headers:
            X-Terra-Version:
              $ref: '#/components/headers/ApiVersion'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          description: Payment authorization failed. Nothing was created — no supplier order and no charge. `code` says whether to add a payment method, replace a declined card, or retry. Retry with the same Idempotency-Key if you sent one.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentRequiredProblem'
        '403':
          headers:
            X-Terra-Version:
              $ref: '#/components/headers/ApiVersion'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          description: A requested product is not enabled in your catalog, or is not offered in this environment (code `product_unavailable`, for example a DNA product in Production). Nothing is created or charged.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '409':
          headers:
            X-Terra-Version:
              $ref: '#/components/headers/ApiVersion'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          description: The Idempotency-Key was already used with a different request body, a request with this key is still in progress, or the original request failed at a point where running it again could duplicate the order (retry with a new key).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '422':
          headers:
            X-Terra-Version:
              $ref: '#/components/headers/ApiVersion'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          description: The order was not approved for testing (code `order_not_approved`), for tests that need a clinician's authorisation before they can be ordered. Nothing was created and no payment was taken.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '500':
          headers:
            X-Terra-Version:
              $ref: '#/components/headers/ApiVersion'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '503':
          headers:
            X-Terra-Version:
              $ref: '#/components/headers/ApiVersion'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          description: Current authorization is unavailable; retry after the dependency recovers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /api/v1/orders/{orderID}:
    get:
      operationId: getOrder
      summary: Get order by order ID
      tags:
        - orders
      description: Returns complete order details including items, recipient, and status
      parameters:
        - $ref: '#/components/parameters/ApiVersion'
        - name: orderID
          in: path
          description: Order ID
          required: true
          schema:
            type: integer
            minimum: 1
      x-required-token-scope: vantage:read
      security:
        - BasicAuth: []
        - DataBearer: []
          DevIDHeader: []
      responses:
        '200':
          headers:
            X-Terra-Version:
              $ref: '#/components/headers/ApiVersion'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          description: Successfully retrieved order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetOrderResponse'
        '400':
          headers:
            X-Terra-Version:
              $ref: '#/components/headers/ApiVersion'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          description: Invalid order ID format. An unsupported `X-Terra-Version` also returns 400 with code `invalid_api_version`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '401':
          headers:
            X-Terra-Version:
              $ref: '#/components/headers/ApiVersion'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          description: Unauthorized - invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationError'
        '404':
          headers:
            X-Terra-Version:
              $ref: '#/components/headers/ApiVersion'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          description: Order not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '500':
          headers:
            X-Terra-Version:
              $ref: '#/components/headers/ApiVersion'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '503':
          headers:
            X-Terra-Version:
              $ref: '#/components/headers/ApiVersion'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          description: Current authorization is unavailable; retry after the dependency recovers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /api/v1/orders/{orderID}/simulate:
    post:
      operationId: simulateOrder
      summary: Simulate an order lifecycle event (Testing environment only)
      tags:
        - orders
      description: Drives one lifecycle event on your order exactly as a supplier update would — status history is recorded and the corresponding signed webhook is delivered to your registered destination. Only valid forward transitions are accepted. results_ready also stores a sample result so the download and acknowledge flows work end to end. The production environment refuses with 403.
      x-required-token-scope: vantage:write
      security:
        - BasicAuth: []
        - DataBearer: []
          DevIDHeader: []
      parameters:
        - $ref: '#/components/parameters/ApiVersion'
        - name: orderID
          in: path
          required: true
          schema:
            type: string
            example: '333410942627700736'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SimulateOrderRequest'
      responses:
        '200':
          headers:
            X-Terra-Version:
              $ref: '#/components/headers/ApiVersion'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          description: Event applied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimulateOrderResponse'
        '400':
          headers:
            X-Terra-Version:
              $ref: '#/components/headers/ApiVersion'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          description: Invalid order id, request body, order_item_id, or event. An unsupported `X-Terra-Version` also returns 400 with code `invalid_api_version`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '403':
          headers:
            X-Terra-Version:
              $ref: '#/components/headers/ApiVersion'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          description: Not available in the production environment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          headers:
            X-Terra-Version:
              $ref: '#/components/headers/ApiVersion'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          description: Order (or order item) not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '422':
          headers:
            X-Terra-Version:
              $ref: '#/components/headers/ApiVersion'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          description: Event is not a valid transition from the current status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimulateTransitionProblem'
        '500':
          headers:
            X-Terra-Version:
              $ref: '#/components/headers/ApiVersion'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '503':
          headers:
            X-Terra-Version:
              $ref: '#/components/headers/ApiVersion'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          description: Current authorization is unavailable; retry after the dependency recovers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /api/v1/products:
    get:
      operationId: listProductTypes
      summary: List all product types
      tags:
        - products
      description: Returns all available diagnostic test categories (e.g., Blood Tests, DNA Tests)
      x-required-token-scope: vantage:read
      security:
        - BasicAuth: []
        - DataBearer: []
          DevIDHeader: []
      parameters:
        - $ref: '#/components/parameters/ApiVersion'
      responses:
        '200':
          headers:
            X-Terra-Version:
              $ref: '#/components/headers/ApiVersion'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          description: Successfully retrieved product types
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductType'
        '400':
          $ref: '#/components/responses/InvalidApiVersion'
        '401':
          headers:
            X-Terra-Version:
              $ref: '#/components/headers/ApiVersion'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          description: Unauthorized - invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationError'
        '500':
