          description: Invalid pagination or filter parameters. An unsupported `X-Terra-Version` also returns 400 with code `invalid_api_version`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '401':
          headers:
            X-Terra-Version:
              $ref: '#/components/headers/ApiVersion'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          description: Missing or invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '500':
          headers:
            X-Terra-Version:
              $ref: '#/components/headers/ApiVersion'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '503':
          headers:
            X-Terra-Version:
              $ref: '#/components/headers/ApiVersion'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          description: Current authorization is unavailable; retry after the dependency recovers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /api/v1/webhook-events/resend:
    post:
      operationId: resendWebhookEvent
      summary: Resend a webhook event
      tags:
        - webhooks
      description: 'Sends a previously delivered event again, to your current webhook URL, signed with your current signing secret and rendered in your pinned version. The payload is rebuilt from the stored event, so it carries the status the event originally announced, not the order''s current status, and a fresh `timestamp`. The event keeps its `event_id`: an endpoint that dedupes on it treats the resend as the event it already processed. Delivery is asynchronous, so 202 means the event was queued, not that it arrived; find the outcome with `GET /api/v1/webhook-deliveries`, where the resend replaces the event''s earlier outcome. A delivered event can be resent for 30 days; an older one, or one delivered before Vantage began keeping delivered events, returns 404 with code `event_not_resendable`. Pass `dry_run=true` to check that an event can be resent without sending it.'
      x-required-token-scope: vantage:write
      security:
        - BasicAuth: []
        - DataBearer: []
          DevIDHeader: []
      parameters:
        - $ref: '#/components/parameters/ApiVersion'
        - $ref: '#/components/parameters/DryRun'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResendWebhookEventRequest'
      responses:
        '200':
          headers:
            X-Terra-Version:
              $ref: '#/components/headers/ApiVersion'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          description: '`dry_run=true`: the event can be resent; nothing was queued.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResendWebhookEventDryRunResponse'
        '202':
          headers:
            X-Terra-Version:
              $ref: '#/components/headers/ApiVersion'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          description: Queued for redelivery.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResendWebhookEventResponse'
        '400':
          headers:
            X-Terra-Version:
              $ref: '#/components/headers/ApiVersion'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          description: Malformed body, an event_id that is not an event id, an event_type that does not match the stored event, or a dry_run that is not a boolean. An unsupported `X-Terra-Version` also returns 400 with code `invalid_api_version`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '401':
          headers:
            X-Terra-Version:
              $ref: '#/components/headers/ApiVersion'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          description: Missing or invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          headers:
            X-Terra-Version:
              $ref: '#/components/headers/ApiVersion'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          description: No event with that event_id was sent to you (code `not_found`), or it cannot be resent (code `event_not_resendable`); `remediation` says why.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookEventProblem'
        '422':
          headers:
            X-Terra-Version:
              $ref: '#/components/headers/ApiVersion'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          description: No webhook URL is configured (code `webhook_url_missing`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookEventProblem'
        '500':
          headers:
            X-Terra-Version:
              $ref: '#/components/headers/ApiVersion'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '503':
          headers:
            X-Terra-Version:
              $ref: '#/components/headers/ApiVersion'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          description: Current authorization is unavailable; retry after the dependency recovers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /api/v1/webhook-events/generate:
    post:
      operationId: generateWebhookEvent
      summary: Send a test webhook event
      tags:
        - webhooks
      description: 'Sends a generated event of one webhook type to your current webhook URL, through the same delivery as real events: signed with `X-Terra-Signature`, rendered in your pinned version, and retried the same way. A generated event carries `"test": true` and describes no real order: every order, order item, variant and test-taker id in it is `"0"`, and the test taker is a placeholder. It changes no order or result. Selected product enforcement delivers it only while the environment has a current Vantage grant. The response carries the latest-shape payload; the delivery is stamped with its own `timestamp` when sent. Pass `dry_run=true` to get the payload without sending it.'
      x-required-token-scope: vantage:write
      security:
        - BasicAuth: []
        - DataBearer: []
          DevIDHeader: []
      parameters:
        - $ref: '#/components/parameters/ApiVersion'
        - $ref: '#/components/parameters/DryRun'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateWebhookEventRequest'
      responses:
        '200':
          headers:
            X-Terra-Version:
              $ref: '#/components/headers/ApiVersion'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          description: '`dry_run=true`: the payload that would be sent; nothing was queued.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerateWebhookEventDryRunResponse'
        '202':
          headers:
            X-Terra-Version:
              $ref: '#/components/headers/ApiVersion'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          description: Queued for delivery.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerateWebhookEventResponse'
        '400':
          headers:
            X-Terra-Version:
              $ref: '#/components/headers/ApiVersion'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          description: Malformed body, an unknown event_type, a status that event type does not carry, or a dry_run that is not a boolean. An unsupported `X-Terra-Version` also returns 400 with code `invalid_api_version`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '401':
          headers:
            X-Terra-Version:
              $ref: '#/components/headers/ApiVersion'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          description: Missing or invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '422':
          headers:
            X-Terra-Version:
              $ref: '#/components/headers/ApiVersion'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          description: No webhook URL is configured (code `webhook_url_missing`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookEventProblem'
        '500':
          headers:
            X-Terra-Version:
              $ref: '#/components/headers/ApiVersion'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '503':
          headers:
            X-Terra-Version:
              $ref: '#/components/headers/ApiVersion'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          description: Current authorization is unavailable; retry after the dependency recovers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
webhooks:
  order.status_changed:
    post:
      operationId: webhookOrderStatusChanged
      security: []
      summary: Order fulfilment status changed
      description: |-
        Sent when an order's fulfilment status changes. `data.status` uses the same `order.*` vocabulary as REST reads of the order.

        Deliveries carry `X-Terra-Signature: t=<unix_seconds>,v1=<hex>` where `v1 = HMAC-SHA256(signing_secret, "<t>.<raw_body>")` — verify against the raw body before trusting the payload — plus `X-Terra-Trace-Id` (the event_id), `X-Terra-Version` (the API version the payload is rendered in: your account's pinned version, or the latest) and `X-Terra-Ordering-Timestamp` (Unix milliseconds when Terra emitted the event, identical on every retry of it; omitted when unknown). Retries can reorder deliveries, so when two events for the same order arrive out of order, the higher `X-Terra-Ordering-Timestamp` is the newer one. The body `timestamp` is when the delivery was built and can differ between retries. Delivery is at-least-once: dedupe on `event_id`. On network errors/408/429/5xx an event gets up to 5 HTTP attempts with exponential backoff (~1s, 2s, 4s, 8s) on first delivery, then single re-attempts with growing delays (5s doubling, capped at 10 minutes) for up to 10 deliveries in total — at most ~14 calls spread over ~30 minutes — before dead-lettering. Other 4xx responses are recorded as rejected and not retried at all.

        `POST /api/v1/webhook-events/resend` sends a delivered event again with the same `event_id`, and `POST /api/v1/webhook-events/generate` sends a test event marked `"test": true`; both are delivered as described here.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderStatusChangedEvent'
      responses:
        '200':
          description: Return any 2xx quickly to acknowledge receipt.
  order_item.results_status_change:
    post:
      operationId: webhookOrderItemResultsStatusChange
      security: []
      summary: Order item results status changed
      description: |-
        Sent when an order item's results status changes. `data.results_status` uses the `results.*` vocabulary shared with REST reads.

        Signing, `X-Terra-Trace-Id`, `X-Terra-Version`, `X-Terra-Ordering-Timestamp`, at-least-once delivery, and retry semantics are identical to `order.status_changed` — see its description.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderItemResultsStatusChangedEvent'
      responses:
        '200':
          description: Return any 2xx quickly to acknowledge receipt.
components:
  parameters:
    ApiVersion:
      name: X-Terra-Version
      in: header
      required: false
      description: The API version to serve this request in. Defaults to your account's pinned version; an account is pinned to the latest version on its first request.
      schema:
        type: string
        enum:
          - '2026-09-27'
          - '2026-10-01'
          - '2026-10-15'
    DryRun:
      name: dry_run
      in: query
      required: false
      description: When true, run every check and return what the operation would do, with 200, without doing it.
      schema:
        type: boolean
        default: false
  headers:
    RequestId:
      description: A UUID generated for this request, unique per request and never taken from the caller. Quote it to support to find the request.
      schema:
        type: string
        format: uuid
        example: 3f2b8a4e-9c1d-4f5e-8a7b-6c5d4e3f2a1b
    ApiVersion:
      description: The API version this response was rendered in.
      schema:
        type: string
        enum:
          - '2026-09-27'
          - '2026-10-01'
          - '2026-10-15'
  responses:
    InvalidApiVersion:
      description: Unsupported `X-Terra-Version`; the problem carries code `invalid_api_version` and lists the supported versions in `detail`.
      headers:
        X-Terra-Version:
          $ref: '#/components/headers/ApiVersion'
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
  securitySchemes:
    DataBearer:
      type: http
      scheme: bearer
      bearerFormat: Terra data token
      description: A data-plane token with vantage:read for reads or vantage:write for writes. Requires dev-id. Write includes read; data:read alone does not grant Vantage. Available after the API credential validator is configured.
    DevIDHeader:
      type: apiKey
      in: header
      name: dev-id
      description: Environment owned by the data token's customer and within its audience.
    BasicAuth:
      type: http
      scheme: basic
      description: |
        Authenticate with your Terra API credentials: username = your Terra
        `dev-id`, password = your Terra API key — the same credentials used for
        every other Terra API. The header pair `dev-id` + `x-api-key` is also
        accepted. Suspended credentials receive 403; accounts without the
        Vantage entitlement receive 403 once entitlement enforcement is
        enabled. Once the credential validator is configured, backfilled keys
        also honor current token expiry, revocation, audience and Vantage scopes.
        Invalid tokens receive 401, insufficient scopes 403 and an unavailable
        validator 503. These checks remain active when product policy is off.
  schemas:
    ListOrdersResponse:
      type: object
      description: One page of orders, newest first. Versions before 2026-10-15 serve the items under `orders` instead of `data`, no `has_more`, and omit `next_cursor` on the last page.
      required:
        - data
        - has_more
        - next_cursor
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/OrderSummary'
        has_more:
          type: boolean
          description: Whether another page follows.
        next_cursor:
          type:
            - string
            - 'null'
          description: Pass as ?cursor= for the next page; null on the last page.
          example: '333410942627700736'
    OrderSummary:
      type: object
      required:
        - order_id
        - created_at
        - collection_type
        - order_status
        - total_cents
        - items
      properties:
        order_id:
          type: string
          example: '333410942627700736'
        client_order_reference_id:
          type: string
          example: ORDER-2024-001
        created_at:
          type: string
          format: date-time
        collection_type:
          type: string
          enum:
            - AT_HOME
            - GO_TO_LAB
        order_status:
          type: string
          example: order.payment_processing
        total_cents:
          type: integer
          example: 5540
        currency:
          $ref: '#/components/schemas/Currency'
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderSummaryItem'
    OrderSummaryItem:
      type: object
      required:
        - order_item_id
        - variant_id
        - results_status
      properties:
        order_item_id:
          type: string
          example: '333410942627700737'
        variant_id:
          type: string
          example: '100011'
        product_name:
          type: string
          example: General Health
        item_status:
          $ref: '#/components/schemas/ItemStatus'
        results_status:
          type: string
          example: results.awaiting_sample
        test_taker_id:
          type: string
          example: '333410942627700738'
    ListResultsResponse:
      type: object
      description: One page of order items with result activity, newest first. Versions before 2026-10-15 serve the items under `results` instead of `data`, no `has_more`, and omit `next_cursor` on the last page.
      required:
        - data
        - has_more
        - next_cursor
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ResultSummary'
        has_more:
          type: boolean
          description: Whether another page follows.
        next_cursor:
          type:
            - string
            - 'null'
          description: Pass as ?cursor= for the next page; null on the last page.
          example: '333410942627700737'
    ResultSummary:
      type: object
      required:
        - order_item_id
        - order_id
        - variant_id
        - results_status
        - is_acknowledged
        - updated_at
      properties:
        order_item_id:
          type: string
          example: '333410942627700737'
        order_id:
          type: string
          example: '333410942627700736'
        variant_id:
          type: string
          example: '100011'
        product_name:
          type: string
          example: General Health
        results_status:
          type: string
          example: results.results_ready
        is_acknowledged:
          type: boolean
        test_taker_id:
          type: string
          example: '333410942627700738'
        updated_at:
          type: string
          format: date-time
    ClientResponse:
      type: object
      properties:
        client_id:
          type: string
          example: client_abc123
        customer_id:
          type: string
          example: cust_xyz789
        webhook_url:
          type: string
          example: https://your-domain.com/webhooks/terra
    SimulateOrderRequest:
      type: object
      required:
        - event
      properties:
        event:
          type: string
          description: Lifecycle event to apply. `genome_processing`, `sample_reanalysis` and `reanalysed` apply to DNA order items only; `reanalysed` stores the next version of the item's result before its webhook fires.
          enum:
            - payment_complete
            - payment_failed
            - processing
            - delayed
            - cancelled
            - delivery_fulfilled
            - completed
            - kit_activated
            - sample_processing_in_lab
            - sample_rejected
            - partial_results_ready
            - results_ready
            - lab_processing_error
            - escalation_raised
            - genome_processing
            - sample_reanalysis
            - reanalysed
        order_item_id:
          type: string
          description: Narrow a results event to one order item.
          example: '333410942627700737'
    SimulateOrderResponse:
      type: object
      required:
        - order_id
        - applied_event
      properties:
        order_id:
          type: string
          example: '333410942627700736'
        applied_event:
          type: string
          example: delivery_fulfilled
    UpdateCatalogSelectionRequest:
      type: object
      required:
        - product_ids
      properties:
        product_ids:
          type: array
          description: Products to enable; everything else is disabled.
          items:
            type: string
            example: '999888777'
    UpdateCatalogSelectionResponse:
      type: object
      required:
        - enabled_count
      properties:
        enabled_count:
          type: integer
          example: 12
    UpdateWebhookUrlRequest:
      type: object
      properties:
        webhook_url:
          type: string
          example: https://your-domain.com/webhooks/terra
    AddressDTO:
      description: Physical address for shipping test kits
      type: object
      properties:
        address_line_1:
          type: string
          minLength: 1
          maxLength: 100
          example: 123 Baker Street
        address_line_2:
          type: string
          maxLength: 100
          example: Flat 4B
        administrative_area:
          type: string
          maxLength: 50
          example: Greater London
        city:
          type: string
          minLength: 1
          maxLength: 50
          example: London
        country_code:
          type: string
          description: ISO 3166-1 alpha-2 (e.g., "GB", "US")
          example: GB
        id:
          type: integer
          example: 987654321
        is_validated:
          type: boolean
          example: true
        postal_code:
          type: string
          example: NW1 6XE
      required:
        - address_line_1
        - administrative_area
        - city
        - country_code
        - postal_code
    RecipientDTO:
      description: The recipient who will receive the test kit and may or may not be the test-taker (supplier-dependent)
      type: object
      properties:
        date_of_birth:
          type: string
          example: '1990-05-15'
        email:
          type: string
          maxLength: 100
          example: sarah.johnson@example.com
        first_name:
          type: string
          maxLength: 50
          example: Sarah
        gender_at_birth:
          type: string
          enum:
            - male
            - female
          example: female
        id:
          type: string
          example: '123456789'
        last_name:
          type: string
          maxLength: 50
          example: Johnson
        phone_number:
          type: string
          description: Full E.164 phone number as stored and dialed, including the "+" and country calling code (e.g. "+447911123456"). Leading zeros significant to the national number are preserved.
          example: '+447911123456'
      required:
        - date_of_birth
        - email
        - first_name
        - gender_at_birth
        - last_name
        - phone_number
    RecipientRequestDTO:
      description: Recipient on an order-creation request. phone_number is a single E.164 string; the separate country_code field was removed and is silently ignored if still sent.
      type: object
      properties:
        date_of_birth:
          type: string
          example: '1990-05-15'
        email:
          type: string
          maxLength: 100
          example: sarah.johnson@example.com
        first_name:
          type: string
          maxLength: 50
          example: Sarah
        gender_at_birth:
          type: string
          enum:
            - male
            - female
          example: female
        id:
          type: string
          example: '123456789'
        last_name:
          type: string
          maxLength: 50
          example: Johnson
        phone_number:
          type: string
          description: 'Required, in E.164 format: a leading "+", the country calling code, then the national number (e.g. "+447911123456"). A bare national number or a separate country_code is rejected.'
          example: '+447911123456'
      required:
        - date_of_birth
        - email
        - first_name
        - gender_at_birth
        - last_name
        - phone_number
    ProblemDetail:
      description: Standard error response format following RFC 7807 specification
      type: object
      properties:
        detail:
          type: string
          example: One or more required fields are missing or invalid
        instance:
          type: string
          example: /orders/create
        status:
          type: integer
          example: 400
        title:
          type: string
          example: Validation Error
        type:
          type: string
          example: https://docs.tryterra.co/vantage-api/errors/validation-error
    SimulateTransitionProblem:
      description: '422 returned by the simulate endpoint when the requested event is not a valid forward transition from the current status. The RFC 7807 problem fields plus the two fields a client needs to recover without a GET round-trip. (Flat rather than an allOf over ProblemDetail: the conformance gate seals declared objects, and sealed allOf branches reject each other''s properties.)'
      type: object
      required:
        - current_status
        - valid_events
      properties:
        detail:
          type: string
          example: event "payment_complete" is not a valid transition from the order's current status
        instance:
          type: string
          example: /orders/333410942627700736/simulate
        status:
          type: integer
          example: 422
        title:
          type: string
          example: Unprocessable Entity
        type:
          type: string
          example: https://docs.tryterra.co/vantage-api/errors/business-logic-error
        current_status:
          type: string
          description: The status the rejected event was evaluated against.
          example: order.payment_complete
        valid_events:
          type: array
          description: Events accepted from current_status, sorted.
          items:
            type: string
          example:
            - processing
            - cancelled
    PaymentRequiredProblem:
      description: '402 returned by POST /orders when payment authorization fails. Nothing is created — no supplier order and no charge. The RFC 7807 problem fields plus a category the client can branch on. (Flat rather than an allOf over ProblemDetail: the conformance gate seals declared objects, and sealed allOf branches reject each other''s properties.)'
      type: object
      required:
        - category
        - detail
        - status
        - title
        - type
      properties:
        detail:
          type: string
          example: Payment could not be authorized for this order.
        instance:
          type: string
          example: /api/v1/orders
        status:
          type: integer
          example: 402
        title:
          type: string
          example: Payment Required
        type:
          type: string
          example: https://docs.tryterra.co/vantage-api/errors/payment-required-error
        category:
          type: string
          description: Failure class for programmatic branching.
          example: payment_failed
        code:
          type: string
          description: 'Why authorization failed. `payment_method_missing`: the account has no payment method on file; add one and retry. `card_declined`: the card issuer refused the charge; update or replace the card first. `payment_authorization_failed`: anything else, such as a temporary payment provider error; retrying may succeed. New values may be added, so treat an unknown code like `payment_authorization_failed`.'
          enum:
            - payment_method_missing
            - card_declined
            - payment_authorization_failed
          example: card_declined
    AuthenticationError:
      description: Authentication error response (401)
      type: object
      properties:
        detail:
          type: string
          example: Invalid Credentials
        instance:
          type: string
          example: ''
        status:
          type: integer
          example: 401
        title:
          type: string
          example: Authentication Required/Failed
        type:
          type: string
          example: https://docs.tryterra.co/vantage-api/errors/authentication-error
      required:
        - detail
        - status
        - title
        - type
    ActivateKitResponse:
      description: Confirmation that kit was activated successfully
      type: object
      properties:
        kit_id:
          type: string
          example: KIT123456789
        message:
          type: string
          example: Kit activated successfully
        success:
          type: boolean
          example: true
    ActivationContextAddress:
      description: Current address of the test-taker (may differ from shipping address)
      type: object
      properties:
        address_line_1:
          type: string
          minLength: 1
          maxLength: 100
          example: 456 Oxford Street
        address_line_2:
          type: string
          maxLength: 100
          example: Apt 7C
        administrative_area:
          type: string
          maxLength: 50
          example: Greater Manchester
        city:
          type: string
          minLength: 1
          maxLength: 50
          example: Manchester
        country_code:
          type: string
          description: ISO 3166-1 alpha-2 (e.g., "GB", "US")
          example: GB
        postal_code:
          type: string
          example: M1 5GD
      required:
        - address_line_1
        - administrative_area
        - city
        - country_code
        - postal_code
    ActivationContextRecipient:
      description: Test-taker personal information (may differ from original recipient). The former country_code field was removed and is silently ignored if still sent.
      type: object
      properties:
        date_of_birth:
          type: string
          example: '1985-03-20'
        email:
          type: string
          example: john.smith@example.com
        first_name:
          type: string
          example: John
        gender_at_birth:
          type: string
          enum:
            - male
            - female
          example: male
        last_name:
          type: string
          example: Smith
        phone_number:
          type: string
          description: 'Required, in E.164 format: a leading "+", the country calling code, then the national number (e.g. "+447911123456"). A bare national number or a separate country_code is rejected.'
          example: '+447911123456'
      required:
        - date_of_birth
        - email
        - gender_at_birth
        - phone_number
    ActivationContextDTO:
      description: Information provided by test-taker when activating their kit
      type: object
      properties:
        address:
          $ref: '#/components/schemas/ActivationContextAddress'
        collection_date:
          type: string
          example: '2025-11-15T09:00:00Z'
        recipient:
          $ref: '#/components/schemas/ActivationContextRecipient'
        supplier_kit_id:
          type: string
          example: KIT123456789
      required:
        - address
    OrderItemRequest:
      description: Individual product variant and quantity in an order
      type: object
      properties:
        quantity:
          type: integer
          minimum: 1
          maximum: 100
          example: 1
        variant_id:
          type:
            - string
            - integer
          minLength: 1
          description: The variant's id as a decimal string. A JSON number is also accepted.
          example: '555666777'
      required:
        - quantity
        - variant_id
    CreateOrderRequest:
      description: Request body for creating a new diagnostic test order
      type: object
      properties:
        client_order_reference_id:
          description: Your unique order identifier that you generate, used for tracking and reconciliation. Not deduplicated server-side — retrying a create with the same value produces a second order.
          type: string
          minLength: 1
          maxLength: 100
          example: ORDER-2024-001
        collection_type:
          type: string
          enum:
            - AT_HOME
            - GO_TO_LAB
          description: Determines the required address field — shipping_address for AT_HOME, requested_lab_address for GO_TO_LAB. A GO_TO_LAB variant whose collection_visit is `clinic` also needs shipping_address, where its kit is posted; any other GO_TO_LAB order must not send one.
        dna:
          $ref: '#/components/schemas/DNADetails'
        items:
          description: Only need product_variant_id and quantity completely define what was ordered
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/OrderItemRequest'
        recipient:
          description: Details of the person who ordered. Depending on the supplier recipient is not necessarily the test-taker. Although some suppliers enforce this constraint on us.
          allOf:
            - $ref: '#/components/schemas/RecipientRequestDTO'
        requested_lab_address:
          $ref: '#/components/schemas/AddressDTO'
        requested_lab:
          $ref: '#/components/schemas/RequestedLab'
        shipping_address:
          $ref: '#/components/schemas/AddressDTO'
      required:
        - client_order_reference_id
        - collection_type
        - items
        - recipient
    DNADetails:
      description: 'What the DNA test needs to know about its end user, so the end user never deals with the supplier. Which details an order must carry depends on the variant ordered: each DNA variant lists them, by the JSON paths used here, in required_dna_details. A DNA order missing one, or with an invalid field, is rejected with 400 before payment, and invalid_fields names each field by its JSON path (for example dna.health_measurements.height_cm) with tag required, type, range, pair, enum, unexpected, words, item, rfc3339, future, max, iso_date or recipient_mismatch. Details the variant does not require may still be sent and are validated the same way. A person who answers true to an eligibility question is rejected with 400 and tag ineligible. Sex at birth is taken from recipient.gender_at_birth. Errors never echo the submitted values. Ignored when no item is a DNA product (product_type_id 2). Stored per DNA order item and never returned by the API.'
      type: object
      properties:
        health_measurements:
          $ref: '#/components/schemas/DNAHealthMeasurements'
        ancestry:
          $ref: '#/components/schemas/DNAAncestry'
        lifestyle:
          $ref: '#/components/schemas/DNALifestyle'
        medical_history:
          $ref: '#/components/schemas/DNAMedicalHistory'
        eligibility:
          $ref: '#/components/schemas/DNAEligibility'
        consent:
          $ref: '#/components/schemas/DNAConsent'
    DNAHealthMeasurements:
      description: The end user's most recent measurements, in the units named by each key. Send a key when the variant's required_dna_details lists it; for a lab measurement, send null when the end user does not know the value (height and weight cannot be null). Ranges are the narrowest any DNA supplier accepts.
      type: object
      properties:
        height_cm:
          description: Height in centimetres (5 ft 6 in is 167.64).
          type: number
          minimum: 31
          maximum: 272
          example: 167.6
        weight_kg:
          description: Weight in kilograms.
          type: number
          minimum: 20
          maximum: 600
          example: 68
        total_cholesterol_mg_dl:
          description: Total cholesterol from the last blood test, mg/dL.
          type:
            - number
            - 'null'
          exclusiveMinimum: 0
          maximum: 1000
          example: 185
        systolic_blood_pressure_mmhg:
          description: Systolic blood pressure, mmHg. Null or left out exactly when diastolic is.
          type:
            - integer
            - 'null'
          minimum: 1
          maximum: 999
          example: 120
        diastolic_blood_pressure_mmhg:
          description: Diastolic blood pressure, mmHg. Null or left out exactly when systolic is.
          type:
            - integer
            - 'null'
          minimum: 1
          maximum: 999
          example: 80
        fasting_glucose_mg_dl:
          description: Fasting blood glucose, mg/dL.
          type:
            - number
            - 'null'
          minimum: 20
          maximum: 500
          example: 92
        hba1c_percent:
          description: HbA1c (A1C), percent.
          type:
            - number
            - 'null'
          exclusiveMinimum: 0
          maximum: 50
          example: 5.4
    DNAAncestry:
      type: object
      required:
        - groups
        - ethnicity
      properties:
        groups:
          description: Every ancestry that applies. Duplicates are ignored.
          type: array
          minItems: 1
          items:
            type: string
            enum:
              - african_american
              - afro_caribbean
              - sub_saharan_african
              - african
              - alaska_native
              - central_asian
              - east_asian
              - hispanic
              - jewish_ashkenazi
              - jewish_sephardic_mizrahi_other
              - latino
              - middle_eastern_west_asian_north_african
              - native_american_indigenous_canadian
              - pacific_islander_oceanian
              - south_asian
              - southeast_asian
              - white_european
              - other
          example:
            - south_asian
        other:
          description: Required when groups includes other, rejected otherwise. Letters, spaces and ' ( ) * + , - . / " only, at most 100 characters.
          type: string
          maxLength: 100
          example: Basque
        ethnicity:
          description: Regional origin or ethnic roots, for example Persian. Letters, spaces and ' ( ) * + , - . / " only, at most 100 characters.
          type: string
          minLength: 1
          maxLength: 100
          example: Gujarati
    DNALifestyle:
      type: object
      required:
        - smoking
        - alcohol
      properties:
        smoking:
          $ref: '#/components/schemas/DNASmoking'
        alcohol:
          type: string
          enum:
            - never
            - couple_per_month
            - one_to_seven_per_week
            - eight_to_fourteen_per_week
            - more_than_fourteen_per_week
          description: How often the end user drinks alcohol (a couple of drinks per month, 1-7, 8-14 or more than 14 drinks per week).
          example: one_to_seven_per_week
    DNASmoking:
      description: years_since_quit is required for former and cigarettes_per_day for trying_to_quit and current; each is rejected for any other status.
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - never
            - former
            - trying_to_quit
            - current
          example: former
        years_since_quit:
          type: integer
          minimum: 1
          maximum: 100
          example: 3
        cigarettes_per_day:
          type: integer
          minimum: 1
          maximum: 100
          example: 10
    DNAMedicalHistory:
      type: object
      required:
        - diagnosed_conditions
      properties:
        diagnosed_conditions:
          description: Diseases or conditions the end user has or has had, in their own words; [] when none.
          type: array
          maxItems: 100
          items:
            type: string
            minLength: 1
            maxLength: 200
          example:
            - Asthma
    DNAEligibility:
      description: A DNA test cannot be run for a person who answers true to either question (donor DNA can be in the sample); such an order is rejected with tag ineligible.
      type: object
      required:
        - bone_marrow_or_stem_cell_recipient
        - blood_transfusion_last_two_weeks
      properties:
        bone_marrow_or_stem_cell_recipient:
          type: boolean
          example: false
        blood_transfusion_last_two_weeks:
          type: boolean
          example: false
    DNAConsent:
      description: The end user's consent to the DNA test, collected in your app before ordering.
      type: object
      required:
        - accepted_at
        - signature_name
        - date_of_birth
        - document_version
      properties:
        accepted_at:
          description: When the end user accepted, RFC 3339. Must not be later than the server time.
          type: string
          format: date-time
          example: '2026-10-05T10:30:00Z'
        signature_name:
          description: The full name the end user typed as their signature.
          type: string
          minLength: 1
          maxLength: 200
          example: Jane Smith
        date_of_birth:
          description: The date of birth the end user confirmed when signing. Must equal recipient.date_of_birth.
          type: string
          format: date
          example: '1990-05-15'
        document_version:
          description: The version of the consent document the end user was shown.
          type: string
          minLength: 1
          maxLength: 100
          example: dna-consent-2026-10
    OrderFinancialDTO:
      description: Price breakdown including subtotal, tax, shipping, discounts
      type: object
      properties:
        currency:
          $ref: '#/components/schemas/Currency'
        discount_cents:
          type: integer
          minimum: 0
          example: 500
        total_cents:
          type: integer
          minimum: 0
          example: 10400
      required:
        - total_cents
    OrderItemResponse:
      description: Individual test kit or product in the order
      type: object
      properties:
        currency:
          $ref: '#/components/schemas/Currency'
        item_status:
          $ref: '#/components/schemas/ItemStatus'
        lab_tracking_number:
          type: string
          example: LAB987654321
        order_id:
          type: string
          example: '123456789'
        order_item_id:
          type: string
          example: '987654321'
        price_per_item_cents:
          type: integer
          example: 9990
        product_type_id:
          type: string
          example: '1'
        test_taker_ids:
          type: array
          description: Test takers registered on this item (present once a kit is activated).
          items:
            type: string
          example:
            - '333410942627700738'
        supplier_item_id:
          type: string
          description: Supplier-side item identifier (kit ID once assigned). Recoverable here even if the webhook that carried it was missed.
          example: BXTWP00362
        collection_visit:
          $ref: '#/components/schemas/OrderItemCollectionVisit'
        quantity:
          type: integer
          example: 1
        results_status:
          type: string
          example: results.awaiting_sample
        variant_id:
          type: string
          example: '555666777'
      required:
        - variant_id
        - product_type_id
        - price_per_item_cents
        - quantity
    OrderItemCollectionVisit:
      description: The clinician visit Vantage arranged for this item's sample. Present only for a variant with a `collection_visit`.
      type: object
      required:
        - type
        - status
      properties:
        type:
          $ref: '#/components/schemas/CollectionVisit'
        status:
          type: string
          description: Where arranging the visit stands. New statuses may be added; treat an unknown value as in progress.
          enum:
            - booking
            - requested
            - booking_failed
            - awaiting_clinic_invite
          x-enum-varnames:
            - CollectionVisitStatus_BOOKING
            - CollectionVisitStatus_REQUESTED
            - CollectionVisitStatus_BOOKING_FAILED
            - CollectionVisitStatus_AWAITING_CLINIC_INVITE
          x-enum-descriptions:
            - The order is placed and the visit is being requested. Read the order again for the outcome; retrying the create with the same Idempotency-Key resumes a request that was interrupted.
            - The visit is requested. The test-taker picks a slot through `scheduling_url`, which the provider can issue shortly after the order is created - read the order again if it is absent; the provider also contacts them on the recipient's phone number.
            - The kit is ordered but the visit could not be requested. Terra support arranges it; nothing is needed from you.
            - The kit is ordered and Terra support is asking the supplier to email the test-taker an invite to book a clinic draw.
          example: requested
        scheduling_url:
          type: string
          description: Where the test-taker books the visit slot. Present once the provider has issued it, which can be shortly after the order is created; reading the order fetches it if it is still missing. Pass it on to the test-taker.
          example: https://provider.example.com/schedule/abc123
    CreateOrderResponse:
      description: Response containing the created order details including tracking information
      type: object
      properties:
        confirmed_lab_address:
          allOf:
            - $ref: '#/components/schemas/AddressDTO'
          description: 'For GO_TO_LAB orders: the bound draw site''s address - the end user''s selection when requested_lab was sent and verified, otherwise the nearest site to the requested lab address. Best-effort - null when resolution is unavailable; the requisition is typically accepted at any of the supplier network''s sites.'
        confirmed_lab:
          anyOf:
            - $ref: '#/components/schemas/ConfirmedLab'
            - type: 'null'
        estimated_delivery:
          type: string
          example: '2025-11-20'
        order_id:
          type: string
          example: '123456789'
        order_items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItemResponse'
        order_status:
          type: string
          description: Current fulfilment status in the REST `order.*` vocabulary. New orders start at `order.payment_processing`.
          example: order.payment_processing
        recipient_id:
          type: string
          example: '987654321'
        tracking_number:
          type: string
          example: TRK123456789GB
      required:
        - order_id
        - recipient_id
    GetOrderResponse:
      description: Full order information including items, recipient, address, and financials
      type: object
      properties:
        status_history:
          type: array
          description: Lifecycle timeline, newest first (order fulfilment + item results events).
          items:
            type: object
            required:
              - status
              - changed_at
            properties:
              status:
                type: string
                example: order.processing
              order_item_id:
                type: string
                example: '333410942627700737'
              changed_at:
                type: string
                format: date-time
              escalation_level:
                type: string
                example: high
                description: Present only on escalation_raised entries.
              acknowledgment_due_by:
                type: string
                format: date-time
                description: Present only on escalation_raised entries.
        client_id:
          type: string
          example: terra_client_abc123
        client_order_reference_id:
          type: string
          example: ORDER-2024-001
        collection_type:
          type: string
          example: AT_HOME
        confirmed_lab_address:
          $ref: '#/components/schemas/AddressDTO'
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItemResponse'
        order_financials:
          $ref: '#/components/schemas/OrderFinancialDTO'
        order_id:
          type: string
          example: '123456789'
        order_status:
          type: string
          description: Current fulfilment status in the REST `order.*` vocabulary.
          example: order.delivery_fulfilled
        recipient:
          $ref: '#/components/schemas/RecipientDTO'
        requested_lab_address:
          $ref: '#/components/schemas/AddressDTO'
        confirmed_lab:
          anyOf:
            - $ref: '#/components/schemas/ConfirmedLab'
            - type: 'null'
        requested_lab:
          allOf:
            - $ref: '#/components/schemas/RequestedLab'
          description: Echo of the selection sent at create time - lets a retrieval-only consumer tell "selected but unbound" from "no selection made".
        shipping_address:
          $ref: '#/components/schemas/AddressDTO'
      required:
        - order_id
        - client_id
        - client_order_reference_id
        - recipient
        - shipping_address
        - items
        - order_financials
        - collection_type
    RequestedLab:
      description: 'GO_TO_LAB only: bind the order to a draw site chosen from GET /labs. code is the binding identity (row''s code field); postal_code is a lookup hint (row''s address.postal_code, ZIP+4 accepted - normalized to the 5-digit ZIP server-side; defaults to requested_lab_address.postal_code). Unknown codes are rejected with invalid_fields tag unknown_lab_code; if the lookup is temporarily unavailable the order is accepted unbound (confirmed_lab null).'
      type: object
      required:
        - code
      properties:
        code:
          type: string
          example: T2O
        postal_code:
          type: string
          example: 10001-6975
    ConfirmedLab:
      description: The draw site this order is bound to - a GET /labs row minus its request-relative distance field. Null when no binding exists (no selection and nearest-site resolution unavailable, or selection accepted unbound during a lookup outage).
      type: object
      required:
        - code
        - name
        - address
      properties:
        code:
          type: string
          example: T2O
        name:
          type: string
          example: Quest Diagnostics - NYC-26th St
        address:
          $ref: '#/components/schemas/AddressDTO'
        phone:
          type: string
          example: 212-555-0100
        hours:
          type: object
          additionalProperties:
            type: string
        latitude:
          type: number
          example: 40.7448
        longitude:
          type: number
          example: -73.9938
        scheduling:
          type: boolean
          example: true
    CreateOrderValidationError:
      description: Validation error when creating an order
      type: object
      properties:
        detail:
          type: string
          example: One or more required fields are missing or invalid
        instance:
          type: string
          example: /api/v1/orders
        status:
          type: integer
          example: 400
        title:
          type: string
          example: Validation Failed
        type:
          type: string
          example: https://docs.tryterra.co/vantage-api/errors/validation-error
        invalid_fields:
          type: array
          description: Per-field validation errors
          items:
            type: object
            properties:
              field:
                type: string
                example: PhoneNumber
              message:
                type: string
                example: 'country_code was removed; send phone_number in E.164 format: +447911123456'
              tag:
                type: string
                example: e164
              value:
                type: string
                example: '07911123456'
        supported_ship_to_countries:
          type: array
          description: Present when the order was rejected for an unsupported country (tag unsupported_ship_to_country) - the ISO-3166 alpha-2 codes this test can be ordered in.
          items:
            type: string
          example:
            - GB
      required:
        - detail
        - instance
        - status
        - title
        - type
    OrderStatusChangedEvent:
      type: object
      required:
        - event_type
        - event_id
        - timestamp
        - data
      properties:
        event_type:
          type: string
          const: order.status_changed
        event_id:
          type: string
          description: Unique per event (64-bit id serialized as a string) — deduplicate on this. Equals the X-Terra-Trace-Id header.
          example: '249956485092777984'
        timestamp:
          type: integer
          description: Unix seconds when the event was sent.
          example: 1763661470
        test:
          type: boolean
          const: true
          description: Present only on events from `POST /api/v1/webhook-events/generate`, which describe no real order.
        data:
          type: object
          required:
            - order_id
            - status
          properties:
            order_id:
              type: string
              example: '333410942627700736'
            status:
              type: string
              enum:
                - order.payment_processing
                - order.payment_complete
                - order.payment_failed
                - order.processing
                - order.delayed
                - order.cancelled
                - order.completed
                - order.delivery_fulfilled
            tracking_number:
              type: string
              description: Present once delivery details are available.
              example: KnD3d5PMZyq5ulNcWkrq
            supplier_item_id:
              type: string
              description: Sandbox payloads only — the supplier-side kit ID.
              example: '249602021676720128'
    OrderItemResultsStatusChangedEvent:
      type: object
      required:
        - event_type
        - event_id
        - timestamp
        - data
      properties:
        event_type:
          type: string
          const: order_item.results_status_change
        event_id:
          type: string
          description: Unique per event (64-bit id serialized as a string) — deduplicate on this. Equals the X-Terra-Trace-Id header.
          example: '249958796259139584'
        timestamp:
          type: integer
          description: Unix seconds when the event was sent.
          example: 1763662021
        test:
          type: boolean
          const: true
          description: Present only on events from `POST /api/v1/webhook-events/generate`, which describe no real order.
        data:
          type: object
          required:
            - order_id
            - order_item_id
            - variant_id
            - results_status
            - test_taker
          properties:
            order_id:
              type: string
              example: '333410942627700736'
            order_item_id:
              type: string
              example: '333410942627700737'
            variant_id:
              type: string
              example: '100011'
            results_status:
              type: string
              enum:
                - results.kit_activated
                - results.sample_processing_in_lab
                - results.sample_rejected
                - results.partial_results_ready
                - results.results_ready
                - results.lab_processing_error
                - results.escalation_raised
                - results.genome_processing
                - results.sample_reanalysis
                - results.reanalysed
              description: 'Non-exhaustive: new statuses may be added without a new API version, so treat an unknown value as an in-progress state. `genome_processing`, `sample_reanalysis` and `reanalysed` are DNA-only.'
            test_taker:
              type: object
              required:
                - test_taker_id
                - first_name
                - last_name
                - email
                - phone_number
              properties:
                test_taker_id:
                  type: string
                  example: '333410942627700738'
                first_name:
                  type: string
                last_name:
                  type: string
                email:
                  type: string
                phone_number:
                  type: string
                  description: E.164 phone number
                  example: '+447911123456'
            escalation_level:
              type: string
              description: Present on escalation_raised.
              enum:
                - not_escalated
                - very_low
                - low
                - medium
                - high
                - very_high
            acknowledgment_due_by:
              type: string
              description: Present on escalation_raised — ISO 8601 deadline.
              example: '2026-07-24T16:04:01Z'
            failure_cause:
              type: string
              description: Present on sample_rejected.
              example: blood contaminated
            result_version:
              type: integer
              format: int32
              minimum: 1
              description: 'Present on results_ready and reanalysed: the version of the result now served, 1 for the first result and bumped by every re-analysis. Fetch the result again when it changes.'
              example: 1
            amended:
              type: boolean
              const: true
              description: Present only on results_ready for a later corrected release of a result already delivered; fetch the result again.
    GetResultsURLResponse:
      description: Response containing a presigned URL to download test results
      type: object
      properties:
        download_url:
          type: string
          example: https://storage.googleapis.com/bucket/results/123.json?signature=abc123
        expires_at:
          type: string
          example: '2025-10-23T18:00:00Z'
        format:
          type: string
          enum:
            - json
          example: json
        result_type:
          type: string
          description: 'How to parse the downloaded file. `fhir_bundle` is a FHIR R4 Bundle (blood tests); `dna_result` is a Terra DNA result, plain JSON (DNA tests), described by the `DNAResult` schema. Non-exhaustive: new representations may be added without a new API version.'
          enum:
            - fhir_bundle
            - dna_result
          example: fhir_bundle
        result_version:
          type: integer
          format: int32
          minimum: 1
          description: 'Version of the result the URL serves: 1 for the first result, bumped by every re-analysis (DNA). Matches `result_version` on the `results.results_ready` and `results.reanalysed` webhooks.'
          example: 1
    DNAResult:
      description: 'The file a `dna_result` download URL serves: one DNA result for one order item, the same shape for every DNA supplier. Not an API response; fetch it from `GET /api/v1/results/{orderItemID}`''s `download_url`.'
      $ref: '#/components/schemas/dna_result.schema'
    AcknowledgeResultsResponse:
      description: Confirmation that results were acknowledged
      type: object
      properties:
        status:
          type: string
          example: acknowledged
    Availability:
      type: string
      description: Whether the item can be ordered right now. `unknown` is served when the supplier has not stated availability.
      enum:
        - unknown
        - in_stock
        - out_of_stock
      x-enum-varnames:
        - Availability_UNKNOWN
        - Availability_IN_STOCK
        - Availability_OUT_OF_STOCK
      x-enum-descriptions:
        - Availability has not been stated.
        - Orderable.
        - Temporarily unavailable.
      example: in_stock
    CollectionMethod:
      type: string
      description: How the sample is taken. Omitted when the supplier states a method outside this vocabulary. New methods may be added; treat an unknown value as unstated.
      enum:
        - finger_prick
        - venous_draw
        - automatic_capillary
        - cheek_swab
      x-enum-varnames:
        - CollectionMethod_FINGER_PRICK
        - CollectionMethod_VENOUS_DRAW
        - CollectionMethod_AUTOMATIC_CAPILLARY
        - CollectionMethod_CHEEK_SWAB
      x-enum-descriptions:
        - Self-collected capillary sample from a lancet.
        - Phlebotomy draw, taken by a clinician.
        - Self-collected capillary sample from a push-button device (Tasso), no lancet.
        - Self-collected buccal swab, for DNA tests.
      example: finger_prick
    CollectionVisit:
      type: string
      description: The clinician visit the sample is taken at. Omitted for a self-collected kit. New visits may be added; treat an unknown value as a visit you cannot offer.
      enum:
        - home_phlebotomy
        - clinic
      x-enum-varnames:
        - CollectionVisit_HOME_PHLEBOTOMY
        - CollectionVisit_CLINIC
      x-enum-descriptions:
        - 'A phlebotomist visits the order''s shipping address to draw the sample. Order with collection_type AT_HOME and the test-taker''s phone number on the recipient: it must be a valid UK or Isle of Man number (a Guernsey or Jersey number is refused with 400, tag `home_visit_phone`), as the provider contacts them on it. The order item''s `collection_visit` says how booking the visit stands.'
        - 'A draw at one of the supplier''s clinics. Order with collection_type GO_TO_LAB and both addresses: the kit is posted to shipping_address for the test-taker to take along, and requested_lab_address says where they want the clinic. The supplier emails the test-taker an invite to book; the order item''s `collection_visit` says how that stands.'
      example: home_phlebotomy
    DNAReport:
      type: string
      description: 'A report category a DNA test''s bundle includes; the same vocabulary as the DNA result''s finding categories. Non-exhaustive: new categories may be added without a new API version.'
      enum:
        - carrier
        - monogenic
        - disease_risk
        - pgx
        - trait
        - longevity
        - ancestry
      example: carrier
    TurnaroundDays:
      type: object
      description: The supplier's stated lab turnaround in days, from sample received to results. A single stated figure has `min` == `max`.
      required:
        - min
        - max
      properties:
        min:
          type: integer
          format: int32
          example: 3
        max:
          type: integer
          format: int32
          example: 5
    Currency:
      type: string
      description: ISO 4217 alphabetic currency code. Omitted when the stored currency is not one of these. Versions before 2026-10-15 serve the ISO 4217 numeric code (840, 978, 826) instead.
      enum:
        - USD
        - EUR
        - GBP
      example: USD
    ItemStatus:
      type: string
      description: The kit's shipping status. Omitted until the supplier reports one. Versions before 2026-10-15 serve the integer (1-4, 0 for none) instead.
      enum:
        - pending_shipment
        - in_transit
        - delivery_attempted
        - delivered
      example: in_transit
    Image:
      type: object
      properties:
        alt_text:
          type: string
        display_order:
          type: integer
          format: int32
        height:
          type: integer
          format: int32
        id:
          type: string
          description: Decimal string.
          example: '100041'
        product_id:
          type: string
          description: Decimal string.
          example: '10002'
        url:
          type: string
        variant_id:
          type: string
          description: Decimal string.
          example: '100041'
        width:
          type: integer
          format: int32
    Biomarker:
      type: object
      description: One measurement a kit includes.
      required:
        - name
      properties:
        name:
          type: string
          description: Human-readable biomarker name.
          example: HDL Cholesterol
        code:
          type: string
          description: The code the result bundle uses for this analyte.
          example: HDL
        loinc:
          type: string
          description: LOINC code for this analyte, when known.
          example: 2085-9
    ProductVariant:
      type: object
      required:
        - name
        - biomarkers
        - requires_activation
        - availability
      properties:
        id:
          type: string
          description: Decimal string.
          example: '100041'
        product_id:
          type: string
          description: Decimal string.
          example: '10002'
        product_type_id:
          type: string
          description: Decimal string.
          example: '1'
        name:
          type: string
          description: The variant's name, as the supplier states it.
          example: Standard Kit
        description:
          type: string
          description: The supplier's blurb for this variant. Omitted when it states none.
          example: Good starter panel
        collection_method:
          $ref: '#/components/schemas/CollectionMethod'
        collection_visit:
          $ref: '#/components/schemas/CollectionVisit'
        turnaround_days:
          $ref: '#/components/schemas/TurnaroundDays'
        requires_activation:
          type: boolean
          description: Whether the kit has to be activated before the lab will process its sample. When true, call the kit activation endpoint as part of your flow; the sample is not processed without it.
          example: true
        availability:
          $ref: '#/components/schemas/Availability'
        biomarkers:
          type: array
          description: Biomarkers measured by this variant. Empty when the panel is not catalogued or could not be read.
          items:
            $ref: '#/components/schemas/Biomarker'
        reports:
          type: array
          description: 'DNA tests only: the reports this variant''s bundle includes. A DNA product''s variants are report bundles; pick one at order time by its variant id. Omitted for other product types.'
          items:
            $ref: '#/components/schemas/DNAReport'
          example:
            - carrier
            - disease_risk
        required_dna_details:
          type: array
          description: 'DNA tests only: what an order for this variant must tell Terra about the end user, as JSON paths into the create-order request (recipient.gender_at_birth, or a key of dna). Empty when the variant needs nothing; omitted for other product types. An order missing any of them is rejected with 400 before payment. Non-exhaustive: new values may be added without a new API version.'
          items:
            type: string
            enum:
              - recipient.gender_at_birth
              - dna.health_measurements.height_cm
              - dna.health_measurements.weight_kg
              - dna.health_measurements.total_cholesterol_mg_dl
              - dna.health_measurements.systolic_blood_pressure_mmhg
              - dna.health_measurements.diastolic_blood_pressure_mmhg
              - dna.health_measurements.fasting_glucose_mg_dl
              - dna.health_measurements.hba1c_percent
              - dna.ancestry
              - dna.lifestyle
              - dna.medical_history
              - dna.eligibility
              - dna.consent
          example:
            - dna.health_measurements.height_cm
            - dna.health_measurements.weight_kg
        available_collection_types:
          type: array
          items:
            type: string
        supported_ship_to_countries:
          type: array
          description: ISO-3166 alpha-2 codes this test can be ordered in (AT_HOME shipping destination; for GO_TO_LAB, the requested lab country). Gate your address form on it - orders outside these countries are rejected with an unsupported_ship_to_country field error.
          items:
            type: string
          example:
            - GB
        price_cents:
          type: integer
          format: int32
        currency:
          $ref: '#/components/schemas/Currency'
        images:
          description: This variant's images, in display order. Omitted when it has none.
          type: array
          items:
            $ref: '#/components/schemas/Image'
    Product:
      type: object
      required:
        - variants
        - availability
      properties:
        enabled:
          type: boolean
          description: Present only on ?show_all=true — the caller's per-product curation flag.
        availability:
          $ref: '#/components/schemas/Availability'
        base_price_cents:
          type: integer
          format: int32
        currency:
          $ref: '#/components/schemas/Currency'
        description:
          type: string
        id:
          type: string
          description: Decimal string.
          example: '100041'
        images:
          description: Every image of the product's variants, in display order.
          type: array
          items:
            $ref: '#/components/schemas/Image'
        name:
          type: string
        product_type_id:
          type: string
          description: Decimal string.
          example: '1'
        variants:
          type: array
          description: The product's variants, on the same curation rules as GET /products/{id}/variants. Empty when the product has none.
          items:
            $ref: '#/components/schemas/ProductVariant'
    ProductType:
      type: object
      properties:
        description:
          type: string
        id:
          type: string
          description: Decimal string.
          example: '100041'
        name:
          type: string
    ListLabsResponse:
      type: object
      required:
        - labs
      properties:
        labs:
          type: array
          items:
            $ref: '#/components/schemas/PSCLocation'
    PSCLocation:
      description: A Patient Service Center (lab draw site).
      type: object
      required:
        - code
        - name
        - address
        - phone
        - latitude
        - longitude
        - scheduling
        - distance
      properties:
        code:
          type: string
          example: PSC12345
        name:
          type: string
          example: Quest Diagnostics - Midtown
        address:
          $ref: '#/components/schemas/AddressDTO'
        phone:
          type: string
          example: +1-212-555-0100
        hours:
          type: object
          additionalProperties:
            type: string
          description: Opening hours keyed by weekday.
          example:
            monday: 08:00-17:00
        latitude:
          type: number
          example: 40.7549
        longitude:
          type: number
          example: -73.984
        scheduling:
          type: boolean
          description: Whether online scheduling is open.
        distance:
          type: number
          description: Miles from the requested zip.
    OverviewResponse:
      type: object
      required:
        - orders
        - results
        - webhooks
      properties:
        orders:
          type: object
          required:
            - total
            - by_status
          properties:
            total:
              type: integer
              example: 27
            by_status:
              type: object
              additionalProperties:
                type: integer
              description: Order counts keyed by current fulfilment status string.
              example:
                order.completed: 29
                order.processing: 8
        results:
          type: object
          required:
            - total
            - missing
          properties:
            total:
              type: integer
              example: 7
            missing:
              type: integer
              example: 8
        webhooks:
          type: object
          required:
            - failed_total
            - daily
          properties:
            failed_total:
              type: integer
              example: 5
            daily:
              type: array
              items:
                type: object
                required:
                  - date
                  - failed
                properties:
                  date:
                    type: string
                    example: '2026-05-16'
                  failed:
                    type: integer
                    example: 1
    ResendWebhookEventRequest:
      type: object
      required:
        - event_id
      properties:
        event_id:
          type: string
          description: The `event_id` of the delivered webhook (also its `X-Terra-Trace-Id`).
          example: '249956485092777984'
        event_type:
          type: string
          description: Optional; when set it must match the stored event's type.
          example: order.status_changed
    ResendWebhookEventResponse:
      type: object
      required:
        - event_id
        - event_type
        - dispatched
      properties:
        event_id:
          type: string
          example: '249956485092777984'
        event_type:
          type: string
          example: order.status_changed
        dispatched:
          type: boolean
          description: True when the event was queued; false in a dry-run preview.
    ResendWebhookEventDryRunResponse:
      type: object
      required:
        - dry_run
        - would
        - preview
      properties:
        dry_run:
          type: boolean
          const: true
        would:
          type: string
          const: resend
        preview:
          $ref: '#/components/schemas/ResendWebhookEventResponse'
    GenerateWebhookEventRequest:
      type: object
      required:
        - event_type
      properties:
        event_type:
          type: string
          enum:
            - order.status_changed
            - order_item.results_status_change
        status:
          type: string
          description: The `data.status` (for order.status_changed) or `data.results_status` (for order_item.results_status_change) the event carries, from that webhook's enum. Defaults to `order.delivery_fulfilled` and `results.results_ready`.
          example: results.results_ready
    GenerateWebhookEventResponse:
      type: object
      required:
        - event_id
        - event_type
        - dispatched
        - payload
      properties:
        event_id:
          type: string
          example: '333410942627700999'
        event_type:
          type: string
          example: order_item.results_status_change
        dispatched:
          type: boolean
          description: True when the event was queued; false in a dry-run preview.
        payload:
          description: The latest-shape webhook body.
          oneOf:
            - $ref: '#/components/schemas/OrderStatusChangedEvent'
            - $ref: '#/components/schemas/OrderItemResultsStatusChangedEvent'
    GenerateWebhookEventDryRunResponse:
      type: object
      required:
        - dry_run
        - would
        - preview
      properties:
        dry_run:
          type: boolean
          const: true
        would:
          type: string
          const: dispatch
        preview:
          $ref: '#/components/schemas/GenerateWebhookEventResponse'
    WebhookEventProblem:
      description: 'RFC 7807 problem from the webhook-events operations, with a code to branch on and a remediation to show. (Flat rather than an allOf over ProblemDetail: the conformance gate seals declared objects.)'
      type: object
      required:
        - code
        - detail
        - status
        - title
        - type
      properties:
        detail:
          type: string
          example: stored webhook event not found
        instance:
          type: string
          example: /api/v1/webhook-events/resend
        status:
          type: integer
          example: 404
        title:
          type: string
          example: Resource Not Found
        type:
          type: string
          example: https://docs.tryterra.co/vantage-api/errors/not-found-error
        code:
          type: string
          enum:
            - not_found
            - event_not_resendable
            - webhook_url_missing
        remediation:
          type: string
          example: Find the event_id with GET /api/v1/webhook-deliveries.
    WebhookDeliveriesResponse:
      type: object
      description: One page of webhook delivery outcomes, newest first. Versions before 2026-10-15 serve the items under `deliveries` instead of `data`, no `has_more`, and omit `next_cursor` on the last page.
      required:
        - data
        - has_more
        - next_cursor
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/WebhookDelivery'
        has_more:
          type: boolean
          description: Whether another page follows.
        next_cursor:
          type:
            - string
            - 'null'
          description: Pass as ?cursor= for the next page; null on the last page.
          example: '333410942627700737'
    WebhookDelivery:
      type: object
      required:
        - event_id
        - event_type
        - order_id
        - order_item_id
        - outcome
        - final_status_code
        - attempts
        - completed_at
        - event_created_at
      properties:
        event_id:
          type: string
          example: '333410942627700737'
        event_type:
          type: string
          description: Same vocabulary as the webhook event_type field (currently order.status_changed, order_item.status_changed and order_item.results_status_change). Open set - new event types may appear; treat unknown values as deliveries of a newer event family.
          example: order_item.results_status_change
        order_id:
          type: string
          example: '333410942627700736'
        order_item_id:
          type: string
          example: '333410942627700737'
        outcome:
          type: string
          description: 'One of: delivered, rejected, invalid, dead_lettered, replayed.'
          example: dead_lettered
        final_status_code:
          type:
            - integer
            - 'null'
          example: 500
        attempts:
          type: integer
          example: 6
        completed_at:
          type: string
          format: date-time
        event_created_at:
          type: string
          format: date-time
    nullable_string:
      type:
        - string
        - 'null'
    date_or_date_time:
      description: An RFC 3339 date-time, or a full date when the supplier reports only the day.
      anyOf:
        - type: string
          format: date-time
        - type: string
          format: date
    category:
      description: What kind of finding (DECISIONS.md R4).
      type: string
      enum:
        - carrier
        - monogenic
        - disease_risk
        - pgx
        - trait
        - longevity
        - ancestry
    method:
      description: 'How a finding was screened: snv_indel (sequence variants), cnv (copy number), repeat_expansion, polygenic_score, star_allele (pharmacogenomic haplotypes).'
      type: string
      enum:
        - snv_indel
        - cnv
        - repeat_expansion
        - polygenic_score
        - star_allele
    system:
      description: A body system the finding touches (DECISIONS.md R5).
      type: string
      enum:
        - performance
        - metabolic
        - cognitive
        - immune
        - detox
        - hormone
    outcome:
      description: 'The supplier''s band for this result: a display label, a colour, and its position among the supplier''s bands (1 is the lowest).'
      type: object
      additionalProperties: false
      required:
        - label
        - color
        - position
        - of
      properties:
        label:
          type: string
          minLength: 1
        color:
          description: 'Terra''s semantic colour for the band: green (favourable), amber (watch), red (unfavourable), grey (neutral).'
          type: string
          enum:
            - green
            - amber
            - red
            - grey
        position:
          type: integer
          minimum: 1
        of:
          type: integer
          minimum: 1
    score:
      type: object
      additionalProperties: false
      required:
        - value
        - type
        - ancestry_adjusted
      if:
        properties:
          type:
            enum:
              - percentile
              - percentage
        required:
          - type
      then:
        properties:
          value:
            minimum: 0
            maximum: 100
      properties:
        value:
          type: number
        type:
          description: percentile (0-100), percentage (0-100), or z_score (standard deviations from the population mean).
          type: string
          enum:
            - percentile
            - percentage
            - z_score
        ancestry_adjusted:
          description: Whether the score is standardised against the person's genetic ancestry. Null when the supplier does not say.
          type:
            - boolean
            - 'null'
    risk:
      type: object
      additionalProperties: false
      required:
        - value
        - unit
        - applies_to
      if:
        properties:
          unit:
            const: fraction
        required:
          - unit
      then:
        properties:
          value:
            maximum: 1
      else:
        properties:
          value:
            maximum: 100
      properties:
        value:
          type: number
          minimum: 0
        unit:
          description: fraction (0-1) or percent (0-100).
          type: string
          enum:
            - fraction
            - percent
        applies_to:
          description: The horizon the risk covers, e.g. lifetime or 10_years.
          type: string
          minLength: 1
    variant:
      type: object
      additionalProperties: false
      required:
        - rsid
        - genotype
        - effect_allele
        - gene
        - transcript
        - hgvs_c
        - hgvs_p
        - genomic_location
        - zygosity
        - inheritance
        - classification
      properties:
        rsid:
          anyOf:
            - type: string
              pattern: ^rs[0-9]+$
            - type: 'null'
        genotype:
          description: This person's alleles, e.g. C/T.
          $ref: '#/components/schemas/nullable_string'
        effect_allele:
          description: The allele that raises the score or risk.
          $ref: '#/components/schemas/nullable_string'
        gene:
          $ref: '#/components/schemas/nullable_string'
        transcript:
          $ref: '#/components/schemas/nullable_string'
        hgvs_c:
          $ref: '#/components/schemas/nullable_string'
        hgvs_p:
          $ref: '#/components/schemas/nullable_string'
        genomic_location:
          description: chromosome:position:ref-alt as the supplier reports it (GRCh38 unless the supplier says otherwise).
          $ref: '#/components/schemas/nullable_string'
        zygosity:
          type:
            - string
            - 'null'
          enum:
            - heterozygous
            - homozygous
            - hemizygous
            - null
        inheritance:
          type:
            - string
            - 'null'
          enum:
            - autosomal_dominant
            - autosomal_recessive
            - x_linked
            - x_linked_dominant
            - x_linked_recessive
            - mitochondrial
            - null
        classification:
          description: ACMG/AMP tier.
          type:
            - string
            - 'null'
          enum:
            - pathogenic
            - likely_pathogenic
            - uncertain_significance
            - likely_benign
            - benign
            - null
    copy_number:
      type: object
      additionalProperties: false
      required:
        - gene
        - copies
      properties:
        gene:
          type: string
          minLength: 1
        copies:
          type: integer
          minimum: 0
    drug:
      type: object
      additionalProperties: false
      required:
        - name
        - guidance
        - source
      properties:
        name:
          type: string
          minLength: 1
        guidance:
          $ref: '#/components/schemas/nullable_string'
        source:
          description: The guideline the guidance comes from, e.g. CPIC.
          $ref: '#/components/schemas/nullable_string'
    recommendation:
      type: object
      additionalProperties: false
      required:
        - text
        - kind
      properties:
        text:
          type: string
          minLength: 1
        kind:
          description: The supplier's grouping, e.g. lifestyle, diet, supplement, screening.
          $ref: '#/components/schemas/nullable_string'
    extensions:
      description: Supplier-only extras, keyed by supplier name (DECISIONS.md R6). Their shape is the supplier's and is not covered by API versioning.
      type: object
      propertyNames:
        pattern: ^[a-z][a-z0-9_]*$
      additionalProperties:
        type: object
    report:
      type: object
      additionalProperties: false
      required:
        - version
        - ordering_physician
        - specimen_received_at
        - released_at
        - url
      properties:
        version:
          description: The supplier's pipeline or report version.
          $ref: '#/components/schemas/nullable_string'
        ordering_physician:
          $ref: '#/components/schemas/nullable_string'
        specimen_received_at:
          anyOf:
            - $ref: '#/components/schemas/date_or_date_time'
            - type: 'null'
        released_at:
          anyOf:
            - $ref: '#/components/schemas/date_or_date_time'
