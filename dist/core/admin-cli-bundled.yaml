        - method_name: retrieve-referrals
          operation: get
          path: /company/referrals
          examples:
            - summary: View your referral rewards
              args: []
      x-terra-summary: Manage the company record and onboarding
      x-terra-resource: company
    AgreeToTermsRequest:
      type: object
      properties:
        terms_version:
          type: string
          description: The version of the terms being accepted, as your own identifier for it. Required. Recorded as sent; this API does not maintain a list of versions.
          x-terra-help: Terms version to accept, recorded as sent.
        document:
          type: string
          enum:
            - bundle
            - tos
            - dpa
          description: Which legal document this acceptance covers. Omitted means 'bundle' (the pre-split combined terms).
          default: bundle
          x-terra-help: 'Legal document to accept (default: bundle).'
        accepted_role:
          type:
            - string
            - 'null'
          description: Free-text role of the accepting user at acceptance time (e.g. admin, developer).
          x-terra-help: Your role when accepting, as free text (e.g. admin or developer).
      required:
        - terms_version
    BillingState:
      type: object
      properties:
        state:
          type: string
          enum:
            - ok
            - requires_action
        dashboard_url:
          type: string
          description: Where the human finishes 3DS / card entry. Present only with requires_action.
      required:
        - state
    CompanyProfile:
      type:
        - object
