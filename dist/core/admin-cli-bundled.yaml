      summary: Apply Garmin webhook endpoints
      description: Reads the rows again and writes each Garmin app's whole row list back, with the rows Terra manages pointed at the custom domain and every other row kept. The fingerprint you reviewed is required, in the body or as If-Match; a configuration that changed since is a 412 precondition_failed, so read and review again. When the review's has_existing is true, acknowledge_replacing_existing must be true or the call is a 400. While Garmin is applying an earlier change the call is a 409 not_ready, also when the lock appears with the write; retry in a few minutes. An apply that fails after writing some apps reports them in the problem's applied_app_ids. When every row is already right, nothing is written and the call is a 200 with an empty applied_app_ids. The dry run makes the same reads and checks and writes nothing to Garmin. Allow up to a minute.
