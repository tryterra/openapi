openapi: 3.1.0
info:
  title: Terra Admin API
  version: 2026.09.14.2
  description: Customer-scoped admin/agent API. Tokens are minted via an RFC 8628 device flow approved on the dashboard. Tenant targeting is the {dev_id} path segment only. Errors are RFC 7807 problem+json with a stable `code`. Mutations accept an Idempotency-Key header and emit X-RateLimit-* headers.
  x-terra-audience: cli
servers:
  - url: /api/v3/admin
security:
  - adminToken: []
tags:
  - name: auth
    description: Device-flow pairing that mints an admin token. The CLI drives this from `terra login`; there is no command for the individual steps.
  - name: tokens
    description: Manage admin tokens for this account
  - name: company
    description: Manage the company record and onboarding
  - name: team
    description: Manage team members
  - name: environments
    description: Manage environments (dev-ids) and their credentials
  - name: sources
    description: Enable and configure wearable providers
  - name: destinations
    description: Manage data destinations
  - name: dataconfig
    description: Configure which data Terra collects and how it is processed
  - name: scores
    description: Configure and inspect scores
  - name: models
    description: The catalog of generally-available models, and the per-environment history of model runs.
  - name: webhookevents
    description: Inspect and resend webhook events
  - name: connections
    description: Inspect end-user connections
  - name: workouts
    description: Manage workout metadata
  - name: entitlements
    description: Manage account capabilities
  - name: billing
    description: Subscriptions, invoices, and usage
  - name: docs
    description: Natural-language search over Terra's published documentation.
paths:
  /auth/device:
    post:
      operationId: startDeviceAuth
      x-terra-hand-written: true
      tags:
        - auth
      responses:
        '200':
          description: Device pairing started.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceStartResponse'
              example:
                device_code: kJ9…43-chars…Qw
                user_code: TERRA-K7MP-4WX2
                verification_uri: https://dashboard.tryterra.co/cli/verify
                verification_uri_complete: https://dashboard.tryterra.co/cli/verify?code=TERRA-K7MP-4WX2
                expires_in: 900
                interval: 5
        '400':
          description: invalid_request | invalid_scope (RFC 6749 §5.2 envelope).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
              example:
                error: invalid_request
                error_description: client_id is required
      summary: Begin device-pairing auth (RFC 8628)
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DeviceStartFormRequest'
      description: 'Standard RFC 8628 §3.1 device authorization request: form-encoded body, JSON response (200), RFC 6749 §5.2 error envelope, Cache-Control: no-store. This endpoint speaks only the OAuth wire format.'
  /auth/token:
    post:
      operationId: pollToken
      x-terra-hand-written: true
      tags:
        - auth
      responses:
        '200':
          description: Token minted (RFC 6749 §5.1).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthTokenResponse'
              example:
                access_token: terra_at_kJ9…shown-once…Qw
                token_type: Bearer
                expires_in: 2592000
                scope: account:read providers:read events:read
                token_id: 8b7f2c1e-4a5d-4f6e-9c3b-2d1a0e9f8b7a
        '400':
          description: authorization_pending | slow_down | access_denied | expired_token | invalid_request | unsupported_grant_type | invalid_grant (RFC 8628 §3.5 / RFC 6749 §5.2 envelope).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
              example:
                error: authorization_pending
                error_description: authorization pending
      summary: Poll for the minted token
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenPollFormRequest'
      description: 'Standard RFC 8628 §3.4 device access token request: form-encoded body with grant_type urn:ietf:params:oauth:grant-type:device_code, RFC 6749 §5.1 token response, §5.2/§3.5 error envelope, Cache-Control: no-store. This endpoint speaks only the OAuth wire format. No refresh tokens are issued — rotate via POST /tokens/self/rotate.'
  /docs/ask:
    post:
      operationId: askDocs
      x-terra-help: Ask a question about Terra using the published docs. An empty sources array means the answer was not grounded in docs.
      tags:
        - docs
      summary: Ask a question about Terra and get an answer from the documentation
      description: 'Scope-free: the search reads no account data, so any valid token may ask. The answer is generated from the published documentation and cites the pages it drew on. An answer with an empty sources array was not grounded in the documentation, which is a 200 rather than an error.'
      security:
        - adminToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocsAskRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocsAskResponse'
              example:
                answer: Call generateWidgetSession and open the URL it returns [1].
                confidence: high
                sources:
                  - label: '1'
                    title: Generate a widget session
                    description: Create a session and redirect the user to the widget.
                    url: https://docs.tryterra.co/widget
                    type: documentation
                    breadcrumbs:
                      - Docs
                      - Authentication
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /me:
    get:
      operationId: getMe
      x-terra-help: Inspect the current token. User details require account:read; otherwise user is null.
      tags:
        - tokens
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
              example:
                token_id: 8b7f2c1e-4a5d-4f6e-9c3b-2d1a0e9f8b7a
                kind: admin
                customer_id: cus_9f3k2m
                scopes:
                  - account:read
                  - providers:read
                dev_ids:
                  - prod-app-x81LmQ
                name: terra-cli on alex-mbp
                created_via: dashboard
                expires_at: '2026-08-02T09:15:00Z'
                grant_anchor_at: '2026-07-03T09:15:00Z'
                last_used_at: '2026-07-03T09:15:00Z'
                user:
                  user_id: usr_8f2a1c
                  email: alex@acme.example
                  verified: true
                  name: Alex Doe
                  phone_number: '+15551234567'
                  created_at: '2025-01-10T09:00:00Z'
                  last_login: '2026-07-01T09:00:00Z'
                  company_id: cus_9f3k2m
                  role: admin
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
      summary: Introspect the calling token
      security:
        - adminToken: []
      description: 'Scope-free: any valid token may introspect what it holds. The user object is the exception and requires account:read — the token''s own properties are self-knowledge, but the minting user''s email/phone/role is the same PII that /me/metadata and /team/members/{user_id} gate. Without that scope, user is null.'
    patch:
      operationId: patchMe
      x-terra-help: Update your dashboard profile. Returns 404 if the token has no dashboard user.
      tags:
        - tokens
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/DashboardUser'
                required:
                  - user
              example:
                user:
                  user_id: usr_8f2a1c
                  email: alex@acme.example
                  verified: true
                  name: Alex Doe (she/her)
                  phone_number: '+15551234567'
                  created_at: '2025-01-10T09:00:00Z'
                  last_login: '2026-07-01T09:00:00Z'
                  company_id: cus_9f3k2m
                  role: admin
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      summary: Update the calling principal's own dashboard user profile
      description: The write is strictly self-scoped but carries account:write — a state change requires a write scope; account:write is in the default mint set, so only explicitly read-narrowed tokens lose self-edit. 404 not_found when the token has no resolvable own dashboard.users row (see DashboardUser).
      security:
        - adminToken:
            - account:write
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchMeRequest'
  /me/metadata:
    get:
      operationId: getMeMetadata
      x-terra-help: Get your analytics layout and preferences. Returns 404 if the token has no dashboard user.
      tags:
        - tokens
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  metadata:
                    $ref: '#/components/schemas/MeMetadata'
                required:
                  - metadata
              example:
                metadata:
                  analytics_layout:
                    widgets:
                      - sleep
                      - recovery
                  preferences:
                    units: metric
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      summary: Get the calling principal's own analytics layout and preferences
      description: 'Strictly self-scoped: it reads the calling principal''s own row and there is no way to read anyone else''s. Both values are opaque JSON that the server neither interprets nor validates, and the internal debug layout is not exposed here. 404 when the token has no resolvable dashboard user.'
      security:
        - adminToken:
            - account:read
    patch:
      operationId: patchMeMetadata
      x-terra-help: Update your layout or preferences. Send at least one field; use --preferences-merge to preserve omitted preference keys.
      tags:
        - tokens
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  metadata:
                    $ref: '#/components/schemas/MeMetadata'
                required:
                  - metadata
              example:
                metadata:
                  analytics_layout:
                    widgets:
                      - sleep
                      - recovery
                  preferences:
                    units: metric
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      summary: Upsert the calling principal's own analytics layout and/or preferences
      description: Send at least one field. analytics_layout and preferences replace the stored value wholesale, so a partial preferences object drops the keys it omits; preferences_merge is the concurrency-safe alternative, shallow-merging its top-level keys atomically, and cannot be sent together with preferences.
      security:
        - adminToken:
            - account:write
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchMeMetadataRequest'
  /tokens/self:
    delete:
      operationId: revokeSelf
      x-terra-hand-written: true
      tags:
        - tokens
      responses:
        '204':
          description: Revoked.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
      summary: Revoke the calling token
      description: Scope-free, because a token is always allowed to give up its own authority. Revocation is checked per request, so this is effectively the last call the token can make and anything after it is a 401. To revoke a different token, use the tokens:admin-gated delete by id.
      security:
        - adminToken: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
  /tokens/self/rotate:
    post:
      operationId: rotateSelf
      x-terra-help: Rotate the current token within its grant window. Save the new bearer now; check its expiry, scopes and environments.
      tags:
        - tokens
      responses:
        '201':
          description: Rotated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
              example:
                token: terra_at_Nw2…shown-once…Rk
                token_id: 1c2d3e4f-5a6b-4c7d-8e9f-0a1b2c3d4e5f
                kind: admin
                customer_id: cus_9f3k2m
                scopes:
                  - account:read
                  - providers:read
                dev_ids: null
                expires_at: '2026-08-02T09:15:00Z'
                name: terra-cli on alex-mbp
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
      summary: Rotate the calling token within its grant window
      description: 'Mints a replacement for the calling token and returns the new bearer once, which is the only copy: a caller that loses it has to pair again. Rotation is available only inside the token''s grant window, and outside it the request conflicts instead of minting anything. Read expires_at, scopes and dev_ids off the response rather than assuming they match the old token.'
      security:
        - adminToken: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
  /tokens:
    get:
      operationId: listTokens
      x-terra-help: List admin and data token metadata, including revoked tokens. Excludes session tokens and bearer values.
      tags:
        - tokens
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/TokenSummary'
                  has_more:
                    type: boolean
                  next_cursor:
                    type:
                      - string
                      - 'null'
                required:
                  - data
                  - has_more
                  - next_cursor
              example:
                data:
                  - token_id: 8b7f2c1e-4a5d-4f6e-9c3b-2d1a0e9f8b7a
                    kind: admin
                    name: terra-cli on alex-mbp
                    scopes:
                      - account:read
                    dev_ids: null
                    created_by: alex@acme.com
                    created_via: device_flow
                    created_at: '2026-07-03T09:15:00Z'
                    expires_at: '2026-08-02T09:15:00Z'
                    last_used_at: '2026-07-03T09:15:00Z'
                    revoked_at: null
                  - token_id: 2b3c4d5e-6f70-4a81-92b3-c4d5e6f70a81
                    kind: data
                    name: sdk-auth-only
                    scopes:
                      - auth:write
                    dev_ids:
                      - prod-app-x81LmQ
                    created_by: token:8b7f2c1e-4a5d-4f6e-9c3b-2d1a0e9f8b7a
                    created_via: admin_api
                    created_at: '2026-07-03T09:15:00Z'
                    expires_at: '2028-07-03T09:15:00Z'
                    last_used_at: null
                    revoked_at: null
                has_more: false
                next_cursor: null
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
      summary: List the account's tokens
      description: 'Metadata for the account''s admin and data tokens. No bearer is ever returned: an admin token''s is shown only when it is minted or rotated, and re-showing a data token''s is its own keys:read-gated endpoint. Short-lived dashboard session tokens never appear, and a revoked token stays listed with revoked_at set, so filter on that rather than assuming every row is live.'
      security:
        - adminToken:
            - tokens:admin
  /tokens/{token_id}:
    delete:
      operationId: revokeToken
      x-terra-help: Revoke a token immediately, including your current token. An unknown token or one outside your account returns 404.
      tags:
        - tokens
      responses:
        '204':
          description: Revoked.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
      summary: Revoke a token by id
      description: 'Immediate: validation happens per request, so the revoked token''s next call fails. 404 when no token with that id belongs to this account, whether it never existed or is someone else''s. Revoking the token you are calling with works here too, though the self route does it without tokens:admin.'
      security:
        - adminToken:
            - tokens:admin
      parameters:
        - name: token_id
          x-terra-help: Token UUID returned by creation. The bearer value is not accepted.
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The token to act on, by the id its creation returned. The token value itself is never accepted here.
        - $ref: '#/components/parameters/IdempotencyKey'
  /company:
    get:
      operationId: getCompany
      x-terra-help: Get your account summary and company profile. Company is null if no profile exists; billing fields are excluded.
      tags:
        - company
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountSummary'
              example:
                customer_id: cus_9f3k2m
                dev_id_count: 2
                company:
                  company_id: cus_9f3k2m
                  name: Acme Fitness
                  billing_email: billing@acme.example
                  website_url: https://acme.example
                  learn_about_us: search
                  onboarded: true
                  user_flow_done: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
      summary: Account summary
      description: 'The customer id, how many dev-ids the account has, and the company profile. `company` is null when the account has no company record yet, and the profile never carries the billing columns. dev_id_count is only a count: the environments list endpoint is where the dev-ids themselves are.'
      security:
        - adminToken:
            - account:read
    patch:
      operationId: patchCompany
      x-terra-help: Update your company profile. Send at least one field; omitted fields stay unchanged. Unknown and billing fields are rejected.
      tags:
        - company
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  company:
                    $ref: '#/components/schemas/CompanyProfile'
                required:
                  - company
              example:
                company:
                  company_id: cus_9f3k2m
                  name: Acme Fitness (Inc.)
                  billing_email: billing@acme.example
                  onboarded: true
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      summary: Update company profile
      description: 'Partial: send at least one field, and omitted fields are left unchanged. Unknown fields, created_at and the billing columns (stripe_customer_id, stripe_subscription_id, stripe_metering_type) are rejected with 400 rather than quietly ignored, so a profile read cannot be sent straight back as a write.'
      security:
        - adminToken:
            - account:write
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchCompanyRequest'
  /environments:
    get:
      operationId: listEnvironments
      x-terra-help: List account environments with their profiles. A missing profile is null; credentials are excluded.
      tags:
        - environments
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/DevSummary'
                  has_more:
                    type: boolean
                  next_cursor:
                    type:
                      - string
                      - 'null'
                required:
                  - data
                  - has_more
                  - next_cursor
              example:
                data:
                  - dev_id: prod-app-x81LmQ
                    name: Production
                    label: prod
                    active: true
                    billable: true
                    profile:
                      dev_id: prod-app-x81LmQ
                      company_id: cus_9f3k2m
                      name: Production
                      billable: true
                      widget_config_url: null
                      widget_name: null
                      app_logo: null
                  - dev_id: staging-app-b52TnP
                    name: Staging
                    active: true
                    billable: false
                    profile: null
                has_more: false
                next_cursor: null
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
      summary: List the account's dev-ids
      description: 'Every dev-id on the account, cursor-paginated, each with its profile row inlined or profile: null when it has none. No credential material appears here, masked or otherwise: that is the per-environment detail read.'
      security:
        - adminToken:
            - account:read
    post:
      operationId: createEnvironmentProfile
      x-terra-help: Create a profile for an existing environment. Existing profiles are returned unchanged; this does not create credentials.
      tags:
        - environments
      responses:
        '200':
          description: OK — a profile already existed for this dev-id (idempotent get-or-create; the existing row is returned unchanged)
          content:
            application/json:
              schema:
                type: object
                properties:
                  profile:
                    $ref: '#/components/schemas/EnvironmentProfile'
                required:
                  - profile
              example:
                profile:
                  dev_id: prod-app-x81LmQ
                  company_id: cus_9f3k2m
                  name: Production
                  billable: true
                  widget_config_url: null
                  widget_name: null
                  app_logo: null
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  profile:
                    $ref: '#/components/schemas/EnvironmentProfile'
                required:
                  - profile
              example:
                profile:
                  dev_id: staging-app-b52TnP
                  company_id: cus_9f3k2m
                  name: Staging
                  billable: false
                  widget_config_url: null
                  widget_name: null
                  app_logo: null
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      summary: Create the environment profile for an existing dev-id
      description: 'This does not provision a dev-id: the dev_id in the body must already exist as a credential, and what gets created is the profile row carrying its display name and billable flag. Get-or-create, so a 200 means a profile already existed and is returned unchanged and only a 201 means one was written. name defaults to the dev_id and billable to false.'
      security:
        - adminToken:
            - account:write
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEnvironmentProfileRequest'
  /entitlements:
    get:
      operationId: listEntitlements
      x-terra-help: List granted account capabilities and their sources. Unavailable capabilities are omitted.
      tags:
        - entitlements
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Entitlement'
                  has_more:
                    type: boolean
                  next_cursor:
                    type:
                      - string
                      - 'null'
                required:
                  - data
                  - has_more
                  - next_cursor
              example:
                data:
                  - capability: vantage
                    source: stripe_entitlement
                  - capability: streaming
                    source: stripe_entitlement
                  - capability: pass_connections
                    source: manual
                has_more: false
                next_cursor: null
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
      summary: List feature entitlements
      description: 'Account-level and read-only: the capabilities this account holds, one row each, with `source` recording how each was granted (reconciled from the subscription, or set by hand). Only granted capabilities appear, so a locked feature is an absence rather than a row saying false.'
      security:
        - adminToken:
            - entitlements:read
  /billing/subscriptions:
    get:
      operationId: listSubscriptions
      x-terra-help: List subscriptions. Check cancel_at_period_end to identify active plans scheduled to end.
      tags:
        - billing
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/SubscriptionSummary'
                  has_more:
                    type: boolean
                  next_cursor:
                    type:
                      - string
                      - 'null'
                required:
                  - data
                  - has_more
                  - next_cursor
              example:
                data:
                  - id: sub_1PXk9f2c
                    status: active
                    cancel_at_period_end: false
                    collection_method: charge_automatically
                has_more: false
                next_cursor: null
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      summary: List subscriptions
      description: 'Cursor-paginated. `status` alone does not say whether a plan is ending: a subscription scheduled to stop is still active until the period closes, which is what cancel_at_period_end reports. collection_method says whether the card on file is charged automatically or an invoice is sent.'
      security:
        - adminToken:
            - billing:read
    post:
      operationId: subscribe
      x-terra-help: Add or change a plan. A requires_action response needs a card challenge at dashboard_url before the change takes effect.
      tags:
        - billing
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingState'
              example:
                state: ok
        '202':
          description: Payment confirmation is required before the plan changes. The response carries a dashboard_url; open it to complete the challenge, after which the subscription activates.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingState'
              example:
                state: requires_action
                dashboard_url: https://dashboard.tryterra.co/dashboard/settings/payment
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      summary: Add/change a plan
      description: 'The plan is named by `scope`; schedule and promo_code are optional. A 200 means the change is live, while a 202 with state requires_action means nothing has changed yet: someone has to finish the card challenge at the dashboard_url in the body before the subscription activates. Send an Idempotency-Key so that a retry replays the stored response instead of applying the change twice.'
      security:
        - adminToken:
            - billing:write
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscribeRequest'
  /billing/invoices:
