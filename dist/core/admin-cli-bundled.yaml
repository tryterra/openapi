        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      summary: List invoices
      description: 'A cursor-paginated page of the account''s invoices. Rows are lean: an amount, a currency, a status and, when they exist, links to the hosted invoice and its PDF. Every field of a row is optional, so treat a missing link as normal rather than as an error.'
      security:
        - adminToken:
            - billing:read
  /billing/invoices/upcoming:
    get:
      operationId: getUpcomingInvoice
