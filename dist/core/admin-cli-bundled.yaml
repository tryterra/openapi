                api_key: 6f8c…new-secret…2a1b
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
      summary: Rotate the legacy client_secret
      security:
        - adminToken:
            - account:write
            - keys:read
      parameters:
        - $ref: '#/components/parameters/DevId'
        - $ref: '#/components/parameters/IdempotencyKey'
      description: Mints a new client_secret for this environment and returns it once. Requires BOTH account:write (it mutates credential config) and keys:read (it discloses plaintext). Prefer coexisting data tokens — mint new, revoke old — which need no atomic swap; this exists for the dashboard settings page's legacy key. The rotated-away secret stops working immediately.
components:
  securitySchemes:
    adminToken:
      type: oauth2
      description: Terra access token (customer-scoped, kind=admin, `terra_at_*`). The ONLY grant is the RFC 8628 device-authorization flow (POST /auth/device, approve in the dashboard, poll POST /auth/token) or a dashboard mint — there is NO client_credentials token endpoint; the clientCredentials flow object below exists solely because OAS 3.1 has no first-class device-flow representation and this is where scopes are machine-readable (see x-grant-type). This surface accepts ONLY admin tokens; data tokens (kind=data, `terra_dt_*`, minted at POST /environments/{dev_id}/tokens) authenticate the data API only — the planes never cross. Each operation names its required scope; admin tokens may also carry an environment audience. The scopes map below is the whole closed vocabulary — BOTH planes. POST /auth/device grants only the admin-plane names and rejects the rest with 400 invalid_scope, so check the plane before choosing a set — x-scope-planes is the machine-readable answer, and each description opens with `Data plane:` or `Both planes:` when the name is not admin-only.
      flows:
        clientCredentials:
          tokenUrl: /api/v3/admin/auth/token
          scopes:
            account:read: Read account and dev-id metadata.
            keys:read: 'Both planes: read credential secret material — the legacy static API key (GET /api-key), a token''s bearer (GET /tokens/{id}/secret), or the data plane''s GET /v2/dashboard/developer. Dangerous: plaintext disclosure.'
            keys:write: 'Reserved for legacy static-key mutations. No admin-surface route uses it today; the dashboard rotate flow retains it. Dangerous: rotates the account''s legacy credential.'
            providers:read: 'Both planes: read provider enablement, masked OAuth credentials, and custom scopes.'
            providers:write: 'Both planes: enable/disable providers and set custom OAuth credentials and scopes.'
            destinations:read: Read webhook and Supabase destinations.
            destinations:write: Create, update, and delete destinations, and run Supabase provisioning.
            events:read: Read delivery-history event metadata.
            events:write: 'Both planes: re-dispatch (resend) a delivered event.'
            connections:read: 'Both planes: list a dev-id''s end-user connections.'
            payloads:read: Read stored delivered payload bodies (contains end-user health data).
            dataconfig:read: Read per-data-type field selection.
            dataconfig:write: Update per-data-type field selection.
            scores:read: Read the score catalog and configuration.
            scores:write: Activate and configure scores.
            models:read: 'Both planes: read the model catalog (data plane) and per-environment model-run history (admin plane).'
            models:run: 'Data plane: run a model over a user''s stored data.'
            workouts:read: 'Data plane: read workout templates and planned workouts.'
            workouts:write: 'Data plane: create workout templates and plan workouts for users.'
            labreports:read: 'Data plane: read lab reports.'
            labreports:write: 'Data plane: reprocess or delete lab reports.'
            testdata:write: 'Data plane: generate synthetic test data.'
            billing:read: 'Read billing: subscriptions, invoices, payment method, usage.'
            billing:write: 'Manage subscriptions (subscribe, cancel-incomplete). Dangerous: spends money.'
            tokens:admin: 'List and revoke any admin token in the account. Dangerous: can revoke every other credential the account holds.'
            entitlements:read: Read company feature entitlements.
            auth:write: 'Data plane: create user authentication flows — widget sessions, auth tokens (in place of a client_secret).'
            connections:write: 'Data plane: deauthenticate users and update connection attributes.'
            data:read: 'Data plane: read stored end-user health data (activity, sleep, body, …).'
            data:write: 'Data plane: push or delete end-user health data.'
            routes:read: 'Data plane: read routes and pushed routes.'
            routes:write: 'Data plane: create, update, push, and delete routes.'
            datalinks:read: 'Data plane: read data links.'
            datalinks:write: 'Data plane: create and delete data links.'
            graphs:read: 'Data plane: read graph sessions.'
            graphs:write: 'Data plane: create and manage graph sessions (public renders of health data).'
            agents:read: 'Data plane: read agents, bundles, jobs, and schedules.'
            agents:write: 'Data plane: create, update, and delete agents and their configuration.'
            agents:run: 'Data plane: execute agents and bundles (incurs model spend).'
            ai:run: 'Data plane: run AI-context queries and the MCP proxy.'
            tokens:read: List token metadata for an environment (never re-shows a bearer).
            tokens:write: 'Mint and revoke tokens for an environment — credential issuance. Dangerous: transitively as broad as everything issuable.'
            account:write: Update account/company profile, onboarding, terms and referral data.
            team:read: Read the company's team member roster.
            team:write: 'Update or remove a team member (name, phone, role; detach from the company). Dangerous: can revoke another human''s access.'
          x-scope-planes:
            account:read: admin
            keys:read: both
            keys:write: admin
            providers:read: both
            providers:write: both
            destinations:read: admin
            destinations:write: admin
            events:read: admin
            events:write: both
            connections:read: both
            payloads:read: admin
            dataconfig:read: admin
            dataconfig:write: admin
            scores:read: admin
            scores:write: admin
            models:read: both
            models:run: data
            workouts:read: data
            workouts:write: data
            labreports:read: data
            labreports:write: data
            testdata:write: data
            billing:read: admin
            billing:write: admin
            tokens:admin: admin
            entitlements:read: admin
            auth:write: data
            connections:write: data
            data:read: data
            data:write: data
            routes:read: data
            routes:write: data
            datalinks:read: data
            datalinks:write: data
            graphs:read: data
            graphs:write: data
            agents:read: data
            agents:write: data
            agents:run: data
            ai:run: data
            tokens:read: admin
            tokens:write: admin
            account:write: admin
            team:read: admin
            team:write: admin
          x-scope-dangerous:
            - billing:write
            - keys:read
            - keys:write
            - team:write
            - tokens:admin
            - tokens:write
          x-not-a-real-flow: Scope registry only. Token issuance is the device flow (see scheme description); this tokenUrl does not accept client_credentials grants.
      x-grant-type: urn:ietf:params:oauth:grant-type:device_code
    sessionToken:
      type: http
      scheme: bearer
      bearerFormat: terra_st_...
      description: 'A dashboard session token, minted per login. Routes that record who a person is talking to accept ONLY this kind — a device-flow admin token carrying the same scopes is rejected. Scopes are enforced per operation and named in each description: an HTTP bearer scheme cannot carry an OAuth2 scope list, so the security requirement is necessarily empty.'
  parameters:
    DevId:
      name: dev_id
      in: path
      required: true
      schema:
        type: string
      description: The developer-id (the only tenant-targeting input).
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
      description: 'Stripe-style idempotency: same key + same body replays the stored response; same key + different body → 409. Mutations only.'
    DryRun:
      name: dry_run
      in: query
      required: false
      schema:
        type: boolean
      description: When true, returns a DryRunResult preview without committing.
  responses:
    Unauthorized:
      description: Missing/invalid/expired admin token.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: unauthorized
            detail: unknown access token
            instance: /api/v3/admin/environments/prod-app-x81LmQ/unified-api/sources/garmin
            code: unauthorized
            remediation: Obtain a new one via the device flow or your dashboard.
    Forbidden:
      description: The token is missing the required scope.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: forbidden
            detail: 'token is missing the required scope: providers:write'
            instance: /api/v3/admin/environments/prod-app-x81LmQ/unified-api/sources/garmin
            code: scope_missing
            remediation: Request a new token that includes providers:write (device flow or dashboard) and approve the additional scope.
    NotFound:
      description: Resource not found (or not owned — no existence oracle).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: not found
            detail: dev-id not found
            instance: /api/v3/admin/environments/prod-app-x81LmQ/unified-api/sources/garmin
            code: dev_id_not_found
            remediation: Confirm the dev-id via `GET /environments`.
    ValidationError:
      description: Request validation failed (see errors[]).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: bad request
            detail: approved scope was not requested
            instance: /api/v3/admin/environments/prod-app-x81LmQ/unified-api/sources/garmin
            code: validation_failed
            errors:
              - 'scopes: at least one required'
    RateLimited:
      description: Per-token rate limit exceeded; see Retry-After.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: too many requests
            detail: per-token rate limit exceeded
            instance: /api/v3/admin/environments/prod-app-x81LmQ/unified-api/sources/garmin
            code: rate_limited
            remediation: Back off and retry after the Retry-After interval.
    Conflict:
      description: Idempotency-Key reuse with a different body, or a precondition conflict.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: conflict
            detail: the account has reached its active-token limit
            instance: /api/v3/admin/environments/prod-app-x81LmQ/unified-api/sources/garmin
            code: token_limit_reached
            remediation: Revoke unused tokens, then retry.
    ServiceUnavailable:
      description: A required subsystem is not available on this deployment.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: service unavailable
            detail: billing is not available on this deployment
            instance: /api/v3/admin/environments/prod-app-x81LmQ/unified-api/sources/garmin
            code: service_unavailable
    InternalError:
      description: Unexpected server-side failure while processing the request.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: internal server error
            detail: an internal error occurred
            instance: /api/v3/admin/company
            code: internal_error
    UnprocessableEntity:
      description: The request is well-formed but the target resource can't perform it (e.g. provider disallows custom credentials).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: unprocessable entity
            detail: this provider does not support custom credentials
            instance: /api/v3/admin/environments/prod-app-x81LmQ/unified-api/sources/garmin
            code: unsupported_operation
  schemas:
    AccountSummary:
