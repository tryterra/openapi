          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      summary: Check terms acceptance
      description: 'Answers a single boolean for the version in the path, and an account that has never accepted it is agreed: false rather than an error. Omitting the `document` query accepts a match under any document; pass one to require that specific document.'
