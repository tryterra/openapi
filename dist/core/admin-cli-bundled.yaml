  /environments/{dev_id}/models/runs:
    get:
      operationId: listModelRuns
      tags:
        - models
      summary: Model-run history
      description: A page of the environment's model runs (one per GET /v2/models/run), newest first, from the 30-day run log. user_id filters the stored Terra user UUID directly; an unknown model yields an empty page. status filters by run outcome; run_id fetches a single run directly and widens the lookup to the full retained history so it is never cut off by the default window.
      security:
        - adminToken:
            - models:read
      parameters:
        - $ref: '#/components/parameters/DevId'
        - name: user_id
          in: query
          schema:
            type: string
            format: uuid
        - name: model
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum:
              - success
              - error
        - name: run_id
          in: query
          schema:
            type: string
        - name: since
          in: query
          schema:
            type: string
        - name: until
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
        - name: cursor
          in: query
          schema:
            type: string
      responses:
        '200':
          description: A page of model runs (keyset cursor).
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ModelRunRecord'
                  has_more:
                    type: boolean
                  next_cursor:
                    type:
                      - string
                      - 'null'
                required:
                  - data
                  - has_more
                  - next_cursor
              example:
                data:
                  - run_id: 5f0b7d2e-9c1a-4e5b-8f3d-6a7b8c9d0e1f
                    user_id: 00000000-0000-0000-0000-000000000101
                    model: sleep-quality
                    status: success
                    latency_ms: 412
                    start_time: '2026-07-09T00:00:00Z'
                    end_time: '2026-07-16T00:00:00Z'
                    submitted_at: '2026-07-16T09:14:02.113Z'
                    output_truncated: false
                    output:
                      score: 82
                has_more: false
                next_cursor: null
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
