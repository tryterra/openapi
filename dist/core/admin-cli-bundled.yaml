          description: Exact, case-sensitive destination URL recorded at delivery time. Combines with destination when both are supplied. Also matches older rows without a recorded destination ID.
          schema:
            type: string
          example: https://api.acme.com/terra/webhook
        - name: limit
          x-terra-help: 'Positive rows per page: default 50, clamped to 200. --paginate fetches pages; --max-pages caps page count.'
          in: query
          schema:
            type: integer
            minimum: 1
            default: 50
          description: Rows per page. Defaults to 50; a larger value is clamped to 200 rather than refused.
        - name: cursor
          x-terra-help: Previous next_cursor; its window overrides --since/--until (supplied times must still be RFC3339).
          in: query
          schema:
            type: string
          description: The previous page's next_cursor. It carries the window the first page resolved, so since and until are ignored while it is set, but supplied values must still be valid RFC3339.
        - name: since
          x-terra-help: 'Inclusive oldest sent_at (RFC3339). Default: 7 days before until, or 14 with --event-id.'
          in: query
          schema:
            type: string
            format: date-time
          description: Oldest sent_at to return, inclusive, as RFC3339. Defaults to 7 days before until, or 14 days before it when event_id is given.
        - name: until
          x-terra-help: 'Inclusive newest sent_at (RFC3339). Default: now.'
          in: query
          schema:
            type: string
            format: date-time
          description: Newest sent_at to return, inclusive, as RFC3339. Defaults to now.
        - name: outcome
          x-terra-help: 'HTTP outcome: delivered is status <=299; failed is status >299.'
          in: query
          schema:
            type: string
            enum:
              - delivered
              - failed
          description: 'Delivery outcome, from the HTTP status the destination returned: delivered is 299 or below, failed is above it.'
        - name: provider
