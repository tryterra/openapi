    post:
      operationId: rotateEnvironmentApiKey
      x-terra-confirmation-reason: Your current API key stops working straight away, so anything still using it will break.
      x-terra-help: Rotate the legacy API key and return its replacement. The old key stops working immediately; requires keys:write.
      tags:
