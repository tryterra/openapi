                title: unprocessable entity
                detail: the Supabase project is paused
                instance: /api/v3/admin/environments/prod-app-x81LmQ/unified-api/destinations/supabase/provision
                code: unsupported_operation
                remediation: Its status is INACTIVE. Restore the project from the Supabase dashboard, wait until its status is ACTIVE_HEALTHY, then provision again.
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          description: Supabase's management API returned an error (code dependency_failed, with Supabase's message as the remediation), or Supabase provisioning is not available on this deployment. When a project was created but could not be connected, the remediation names its reference to retry with as project_ref.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: about:blank
                title: service unavailable
                detail: the Supabase management API returned an error
                instance: /api/v3/admin/environments/prod-app-x81LmQ/unified-api/destinations/supabase/provision
                code: dependency_failed
                remediation: The project limit for this organization has been reached.
      summary: Provision the Supabase destination
      description: 'Long-running: provisioning a Supabase project can take minutes, so allow a generous timeout rather than reading a slow response as a hang. It needs a ready oauth_session_id and exactly one of a project_ref from the projects list or a create_project naming one of that list''s organizations, and it creates a data destination as a side effect: the destination_id it returns delivers every event type and is managed through the ordinary destinations endpoints from then on. A created project''s database password is returned once as database_password, so send an Idempotency-Key with create_project: once a call succeeds, a retry replays the result with database_password null. If a call fails after Supabase created the project, retrying the same create_project on the same session resumes that project rather than creating a second one, and returns its password once connected. replace_destination_id must name a Supabase destination, which is deleted only after the new one is written.'
      security:
        - adminToken:
            - destinations:write
      parameters:
        - $ref: '#/components/parameters/DevId'
        - $ref: '#/components/parameters/DryRun'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupabaseProvisionRequest'
