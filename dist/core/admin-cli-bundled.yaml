    CurrentUsageRow:
      type: object
      properties:
        subscription_id:
          type: string
        item_id:
          type: string
        scope:
          type: string
          description: Compatibility label; unknown when the product is not in the configured catalogue.
        product_id:
          type: string
        product_name:
          type: string
        price_id:
          type: string
        meter_id:
          type: string
        currency:
          type: string
          description: Native Stripe currency. All pricing amounts are decimal strings in this currency's minor unit, never major units.
        event_name:
          type: string
        display_name:
          type: string
        formula:
          type: string
        period_start:
          type: integer
          format: int64
          description: Native subscription item period, inclusive start in Unix seconds.
        period_end:
          type: integer
          format: int64
          description: Native subscription item period, exclusive end in Unix seconds.
        usage_window_start:
          type: integer
          format: int64
          description: Inclusive start of the provider-supported minute-aligned measurement window.
        usage_window_end:
          type: integer
          format: int64
          description: Exclusive end of the measured minute window. Can extend less than a minute beyond the native period.
        period_alignment:
          type: string
          enum:
            - exact
            - minute_envelope
        amount:
          type: number
          description: Eventually consistent measurement for usage_window_start/end, not an invoice amount or exact billed-period quantity when alignment is minute_envelope.
        included:
          type:
            - integer
            - 'null'
          format: int64
          description: First finite tier with explicit zero per-unit pricing; null when unknown or absent.
        daily:
          type: array
          description: UTC daily windows enclosing the native period. Edge days can extend beyond it.
          items:
            $ref: '#/components/schemas/UsageDay'
        pricing:
          description: Exact native monetary facts. null when the provider pricing representation is unavailable or unsupported.
          anyOf:
            - $ref: '#/components/schemas/UsagePricing'
            - type: 'null'
        pause_collection:
          description: Collection pause remains visible and does not suppress the usage measurement.
          anyOf:
            - $ref: '#/components/schemas/SubscriptionPauseSummary'
            - type: 'null'
      required:
        - subscription_id
        - item_id
        - scope
        - product_id
        - product_name
        - price_id
        - meter_id
        - currency
        - event_name
        - display_name
        - formula
        - period_start
        - period_end
        - usage_window_start
        - usage_window_end
        - period_alignment
        - amount
        - included
        - daily
        - pricing
        - pause_collection
