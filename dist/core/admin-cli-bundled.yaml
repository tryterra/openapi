  /billing/subscriptions/cancel-incomplete:
    post:
      operationId: cancelIncomplete
      x-terra-confirmation-reason: 'Cancels unfinished subscriptions: either all of them, or only the ones this request names.'
      x-terra-help: Cancel incomplete subscriptions with unfinished payment challenges (requires billing:write).
      tags:
        - billing
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                only_operation_keys:
                  type: boolean
                  default: false
                  description: Select only incomplete subscriptions belonging to the supplied operation keys. Used by payment-failure callbacks so an older challenge cannot cancel a newer purchase.
                  x-terra-help: Limit cancellation to the supplied operation keys; use this for a specific failed payment challenge.
                operation_keys:
                  type: array
                  maxItems: 100
                  items:
                    type: string
                    minLength: 1
                    maxLength: 255
                  description: Candidate subscription Idempotency-Key values to acknowledge only after their owned subscription is canceled or incomplete_expired.
                  x-terra-help: Original Idempotency-Key values for the incomplete purchases to cancel or acknowledge.
      responses:
        '200':
          description: OK (or DryRunResult when ?dry_run=true).
          content:
            application/json:
              schema:
                type: object
                anyOf:
                  - $ref: '#/components/schemas/BillingState'
                  - $ref: '#/components/schemas/DryRunResult'
              example:
                state: ok
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      summary: Cancel unfinished subscriptions
      description: |
        Accepts an admin token with explicitly approved billing:write or a dashboard session
        with billing:write. Device-flow approval requires an account admin; no dashboard
        session is required when using the approved token. System tokens are rejected.
        Reads every page of the canonical customer's subscriptions and selects only incomplete.
        Terminal incomplete_expired subscriptions are excluded. Commit rechecks ownership and status
        before each cancellation.
        Cancellation is sequential and can partially complete if a later Stripe request fails.
        With ?dry_run=true the preview lists the subscriptions the call would cancel, read with the
        same selection, and cancels nothing. `would` is cancel, or noop when none are incomplete.
        Stripe can move one out of incomplete between the preview and the commit, which is why the
        commit rechecks each subscription rather than trusting the list.
      security:
        - adminToken:
            - billing:write
      parameters:
        - $ref: '#/components/parameters/DryRun'
        - $ref: '#/components/parameters/IdempotencyKey'
