        - $ref: '#/components/parameters/DryRun'
        - $ref: '#/components/parameters/IdempotencyKey'
    get:
      operationId: listTeamInvitations
      x-terra-help: List unclaimed, unexpired team invitations. Invitation tokens are not recoverable; revoke and reissue if lost.
      tags:
        - team
      summary: List outstanding invitations
      description: 'Returns the caller''s own company''s invitations that are still claimable — unclaimed and unexpired. Claimed and expired rows stay in the table as the record of what happened but are not listed. The token itself is never returned: only its digest is stored, so an invitation cannot be recovered, only revoked and reissued.'
      responses:
        '200':
          description: OK
