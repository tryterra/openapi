  /billing/subscriptions:
    get:
      operationId: listSubscriptions
      x-terra-help: List subscriptions. Check cancel_at_period_end to identify active plans scheduled to end.
      tags:
        - billing
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/SubscriptionSummary'
                  has_more:
                    type: boolean
                  next_cursor:
                    type:
                      - string
                      - 'null'
                required:
                  - data
                  - has_more
                  - next_cursor
              example:
                data:
                  - id: sub_1PXk9f2c
                    status: active
                    cancel_at_period_end: false
                    collection_method: charge_automatically
                    scopes:
                      - api
                      - growth
                has_more: false
                next_cursor: null
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      summary: List subscriptions
      description: 'Cursor-paginated. `status` alone does not say whether a plan is ending: a subscription scheduled to stop is still active until the period closes, which is what cancel_at_period_end reports. collection_method says whether the card on file is charged automatically or an invoice is sent. scopes contains billing plan labels for active, trialing, past_due and unpaid subscriptions; other states return an empty array. These labels never authorize products: use /entitlements.'
      security:
        - adminToken:
            - billing:read
    post:
      operationId: subscribe
      x-terra-confirmation-reason: Charges your saved payment method.
      x-terra-help: Add or change a plan (requires billing:write). A requires_action response needs payment at payment_url.
      tags:
        - billing
      responses:
        '200':
          description: OK (or DryRunResult when ?dry_run=true).
          content:
            application/json:
              schema:
                type: object
                anyOf:
                  - $ref: '#/components/schemas/BillingState'
                  - $ref: '#/components/schemas/DryRunResult'
              example:
                state: ok
        '202':
          description: Payment confirmation is required before the plan changes. The response carries a payment_url and/or client_secret. Use the hosted page or embedded Stripe confirmation to complete payment, after which the subscription activates.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingState'
              example:
                state: requires_action
                payment_url: https://invoice.stripe.com/i/example
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      summary: Add or change a plan
      description: |
        Accepts an admin token with explicitly approved billing:write or a dashboard session
        with billing:write. Device-flow approval requires an account admin; no dashboard
        session is required when using the approved token. System tokens are rejected.
        The admin API owns the scope-to-price mapping, eligibility checks and Stripe writes.
        Annual event plans also require a deferred monthly metered overage subscription after payment.
        A committed 202 means payment is pending, with a hosted payment_url and/or an embedded
        Stripe invoice confirmation client_secret. Never log the client secret or cache it as account data.
        Product access and provisioning follow the existing Stripe webhook settlement.
        Send an Idempotency-Key so a successful response can be replayed on retry.
        With ?dry_run=true the same planning runs and nothing is subscribed: the preview carries
        the action it would take (create or update), the price items it would add or remove, the
        proration date and behaviour, whether an annual plan defers its metered overage, and an
        invoice estimate of what the change would bill now. `would` is create or update.
        The estimate is current Stripe state rather than a reservation, and no preview can say
        whether the card will need a challenge; the commit recalculates it.
      security:
        - adminToken:
            - billing:write
      parameters:
        - $ref: '#/components/parameters/DryRun'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscribeRequest'
