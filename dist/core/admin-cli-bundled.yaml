      x-terra-help: Mint a scoped, long-lived data token. Returns the bearer, also retrievable with keys:read. Rotate by minting a replacement and revoking the old token.
      tags:
        - tokens
      summary: Create a data access token
      description: Creates a dev-scoped, explicitly-scoped, long-lived data-plane token (e.g. auth:write only for SDK authentication). Multiple tokens coexist per dev-id, so rotation = mint new + revoke old — no shared-secret cutover. The bearer is returned at mint and retrievable later via the keys:read-gated /secret sub-resource (API-key DX parity).
      security:
