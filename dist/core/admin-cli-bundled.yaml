          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      summary: Upsert a workout's metadata
      description: 'Upsert, and preserving rather than replacing: an absent or null pace_units leaves whatever is stored in place, so this cannot clear it (the PATCH on this path can). created_at is applied only when the row is first inserted and is ignored afterwards.'
      security:
        - adminToken:
            - dataconfig:write
      parameters:
        - $ref: '#/components/parameters/DevId'
        - name: workout_id
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PutWorkoutMetadataRequest'
    patch:
      operationId: patchWorkoutMetadata
      tags:
        - workouts
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  workout:
                    $ref: '#/components/schemas/WorkoutMetadata'
                required:
                  - workout
              example:
                workout:
                  workout_id: wk_9f3k2m
                  created_at: '2026-05-01T12:00:00Z'
                  pace_units: null
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      summary: Overwrite a workout's pace_units
      description: A PATCH, but pace_units is required and overwrites unconditionally, and sending null clears the column. That is the difference from the PUT on this path, which preserves whatever is already stored when pace_units is absent or null.
      security:
        - adminToken:
            - dataconfig:write
      parameters:
        - $ref: '#/components/parameters/DevId'
        - name: workout_id
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchWorkoutMetadataRequest'
    delete:
      operationId: deleteWorkoutMetadata
      tags:
        - workouts
      summary: Delete a workout's metadata
      description: 'Deletes the metadata row for the workout, not the workout or its data: what goes is the stored pace_units. The 204 carries nothing, and unlike the other destructive routes here this one has no dry-run, so read the value first if you might want to put it back.'
      security:
        - adminToken:
            - dataconfig:write
      parameters:
        - $ref: '#/components/parameters/DevId'
        - name: workout_id
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: Deleted.
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
