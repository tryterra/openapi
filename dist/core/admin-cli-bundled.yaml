          $ref: '#/components/responses/ServiceUnavailable'
      summary: Delivery-history debug surface
      description: 'Delivery metadata, not payloads: each row is one dispatch with its HTTP status, latency and size, while the body that was sent is a separate payloads:read-gated sub-resource. Keyset cursor pagination, and the window is the actionable 14 days, so anything older is not queryable here. Filter by outcome (delivered or failed), provider, data_type, user_id, reference_id, a since/until window, or event_id for one exact event.'
      security:
        - adminToken:
            - events:read
      parameters:
        - $ref: '#/components/parameters/DevId'
        - name: limit
          in: query
          schema:
            type: integer
        - name: cursor
          in: query
          schema:
            type: string
        - name: since
          in: query
          schema:
            type: string
        - name: until
          in: query
          schema:
            type: string
        - name: outcome
          in: query
          schema:
            type: string
            enum:
              - delivered
              - failed
        - name: provider
          in: query
          schema:
            type: string
        - name: data_type
          in: query
          schema:
            type: string
        - name: user_id
          in: query
          schema:
            type: string
        - name: reference_id
          in: query
          schema:
            type: string
        - name: event_id
          in: query
          schema:
            type: string
          description: Exact event id; defaults the window to the 14-day actionable range.
  /environments/{dev_id}/webhook-events/resend:
    post:
      operationId: resendWebhookEvent
      tags:
        - webhookevents
      responses:
        '202':
          description: Queued for redelivery. Dispatch is asynchronous, so a 202 means the event was accepted rather than delivered; re-read the event to see the outcome.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResendResult'
              example:
                event_id: c9d0e1f2-3a4b-4c5d-8e9f-a0b1c2d3e4f5
                event_type: activity
                dispatched: true
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      summary: Re-dispatch a stored event
      description: 'Asynchronous: a 202 with dispatched: true means the event was accepted for redelivery, not that it arrived, so re-read the event to see the outcome. The destination receives the stored payload again, so a receiver that is not idempotent sees the same event twice. All three of user_id, event_id and event_type are required, which means fetching the row from the list endpoint first.'
      security:
        - adminToken:
            - events:write
      parameters:
        - $ref: '#/components/parameters/DevId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResendEventRequest'
