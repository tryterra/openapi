              schema:
                $ref: '#/components/schemas/DryRunResult'
              example:
                dry_run: true
                would: provision
                preview:
                  create_project:
                    name: terra-prod
                    organization_id: wxyzorgabcdefgh
                    region: us-east-1
                  organization: Acme
                  will_create_project: true
                  will_return_database_password: true
