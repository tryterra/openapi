        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      summary: Poll Supabase OAuth state
      description: 'Reports one of pending, ready or failed for the session started on this path. Poll it at the `interval` the start response gave and give up at its `expires_in`: a failed authorization is a 200 carrying state: failed, not an error status. The session reads pending until the authorization completes, and a 404 means only that the handle is unknown or expired.'
      security:
        - adminToken:
