      description: dashboard.company_info row for the customer, joined with its dashboard.company_billing row, or null if no company_info row exists yet. The billing columns (stripe_customer_id, stripe_subscription_id, stripe_metering_type) are never included in the response.
      additionalProperties: true
    CreateDestinationRequest:
      type: object
      properties:
        type:
          type: string
          description: Where data is delivered, e.g. webhook, s3, gcs. Omitted defaults to webhook, which is the common case; an unrecognised type is a 400.
          default: webhook
          x-terra-help: 'Destination type, e.g. webhook, s3 or gcs (default: webhook).'
        url:
          type: string
          description: Where deliveries are sent. Required. For a webhook this is the HTTPS endpoint; for the storage and database types it is the location that type addresses.
          x-terra-help: Delivery endpoint or storage/database location; use an HTTPS endpoint for webhooks.
        event_types:
          type: array
          description: Which events to deliver here, as a list of event-type names. Omitted delivers the default set for the type, and an unrecognised name is a 400 naming it.
          items:
            type: string
          x-terra-help: Events to deliver; repeat for each type. Omitted uses the destination type defaults; unknown names are rejected.
        active:
          type: boolean
          description: Whether to start delivering immediately. Omitted defaults to true.
          default: true
          x-terra-help: 'Start delivering immediately (default: true).'
        metadata:
          type: string
