              $ref: '#/components/schemas/SupabaseProvisionRequest'
  /environments/{dev_id}/unified-api/scopes:
    get:
      operationId: listUnifiedApiScopes
      tags:
        - dataconfig
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/SelectedDataField'
                  has_more:
                    type: boolean
                  next_cursor:
                    type:
                      - string
                      - 'null'
                required:
                  - data
                  - has_more
                  - next_cursor
              example:
                data:
                  - data_type: activity
                    fields:
                      - steps
                      - distance_metres
                      - calories
                    samples_enabled: false
                has_more: false
                next_cursor: null
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
      summary: Per-data-type field selection
      description: 'One row per data type the environment collects, carrying the fields selected within that type and its samples flag. This is the inner axis only: which data types are selected at all is set by the PUT on this path, and a type that is not selected does not appear here.'
      security:
        - adminToken:
            - dataconfig:read
      parameters:
        - $ref: '#/components/parameters/DevId'
    patch:
      operationId: patchUnifiedApiScopes
      tags:
        - dataconfig
      responses:
        '200':
          description: Updated (or DryRunResult when ?dry_run=true).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SelectedDataField'
              example:
                data_type: activity
                fields:
                  - steps
                  - distance_metres
                samples_enabled: false
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
      summary: Replace a data-type field selection
      description: 'Scoped to the single data type named in the body, and the field list replaces what was stored: anything left out of `fields` is deselected. samples_enabled comes back in the response but cannot be set here, and the PUT on this path is what selects data types in the first place. Supports ?dry_run=true for a preview that commits nothing.'
      security:
        - adminToken:
            - dataconfig:write
      parameters:
        - $ref: '#/components/parameters/DevId'
        - $ref: '#/components/parameters/DryRun'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SelectedDataFieldsRequest'
    put:
      operationId: putUnifiedApiScopes
      tags:
        - dataconfig
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SelectedDataTypes'
              example:
                scopes:
                  - ATHLETE
                  - ACTIVITY
                  - BODY
                  - SLEEP
                samples_enabled: true
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
      summary: Replace which data types are selected
      security:
        - adminToken:
            - dataconfig:write
      parameters:
        - $ref: '#/components/parameters/DevId'
        - $ref: '#/components/parameters/IdempotencyKey'
      description: 'Sets WHICH data types this environment collects, wholesale — the PATCH on this path sets the fields within one data type. Send the complete desired set: anything omitted is deselected, and nothing is read back first, so a concurrent edit is never silently reinstated. ATHLETE is always selected and need not be sent; SAMPLES is the per-row samples flag, not a data type; HEALTH_OBSERVATION is 403 access_denied unless the account holds the health_observation entitlement. Gated dataconfig:write rather than account:write so an environment''s data scopes stay editable by every role that can configure data.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplaceDataTypesRequest'
