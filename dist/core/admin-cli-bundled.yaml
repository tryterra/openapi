                data:
                  - id: 3f1c0a7e-9b52-4d61-8a3f-5c9e2d7b1a04
                    company_id: cus_acme
                    email: new.engineer@acme.test
                    role: developer
                    source: null
                    invited_by_user_id: usr_admin_acme
                    created_at: '2026-07-29T09:15:00Z'
                    expires_at: '2026-08-05T09:15:00Z'
                    claimed_at: null
                    claimed_by_user_id: null
                has_more: false
                next_cursor: null
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
