        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      summary: Default payment method (masked)
      description: 'The default card only, and only the fields that are safe to show: brand, last4 and expiry. has_card is the field to branch on, since when it is false the account has no card on file and the rest are absent.'
      security:
        - adminToken:
            - billing:read
  /billing/usage:
    get:
      operationId: getUsage
      x-terra-help: Get metered usage totals. Requires a meter and a minute-aligned Unix-second start/end window; usage is eventually consistent.
      tags:
        - billing
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageResponse'
              example:
                meter_id: mtr_61RQw
                start: 1748736000
                end: 1751328000
                total_usage: 18234
                summaries:
                  - meter_id: mtr_61RQw
                    aggregated_value: 18234
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      summary: Metered usage totals
      description: All three of meter_id, start and end are required, so there is no default window, and the bounds are plain integers rather than the RFC3339 timestamps the rest of this API uses. The response repeats the window it measured, the total, and a per-meter breakdown.
      security:
        - adminToken:
            - billing:read
      parameters:
        - name: meter_id
          x-terra-help: Billing meter configured for your account. An unknown meter returns 404.
          in: query
          required: true
          schema:
            type: string
          description: The billing meter to total. One of the meters configured for your account; an unknown one is a 404.
        - name: start
          x-terra-help: Positive Unix-second window start, a multiple of 60 and before --end. Required; no default.
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
            multipleOf: 60
          description: Start of the window, as a positive unix-second timestamp. Must be minute-aligned (a multiple of 60), which is the billing provider's own rule, and before end.
        - name: end
          x-terra-help: Positive Unix-second window end, a multiple of 60 and after --start. Recent usage may still be arriving.
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
            multipleOf: 60
          description: End of the window, as a positive unix-second timestamp. Minute-aligned like start. Usage is eventually consistent, so a window ending at now may still be filling in.
  /billing/subscriptions/cancel-incomplete:
    post:
      operationId: cancelIncomplete
      x-terra-help: Cancel all subscriptions with unfinished payment challenges. List subscriptions again to see which remain.
