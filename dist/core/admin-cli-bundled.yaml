      summary: Delivery-history debug surface
      description: 'Delivery metadata, not payloads: each row is one dispatch with its HTTP status, latency and size, while the body that was sent is a separate payloads:read-gated sub-resource. Keyset cursor pagination over a bounded window: the default is the trailing 7 days, since and until move it, and nothing older than the 14 days a payload is retained for is worth querying. Filter by outcome (delivered or failed), provider, data_type, destination_type, destination, destination_url, summary_id, user_id, reference_id, or event_id for one exact event. An event_id widens the default window to 14 days. No matching deliveries returns an empty page; an unknown user_id or reference_id returns 404.'
