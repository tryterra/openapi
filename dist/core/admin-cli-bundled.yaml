              $ref: '#/components/schemas/WidgetConfig'
  /environments/{dev_id}/api-key:
    get:
      operationId: getEnvironmentApiKey
      tags:
        - environments
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DevKeys'
              example:
                dev_id: prod-app-x81LmQ
                api_key: 6f8c…full-secret…2a1b
                signing_secret: e3d9…full-secret…77c4
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
      summary: Full credential material (audited)
      description: Discloses the environment's client_secret and its webhook signing secret in plaintext, which is why it sits behind keys:read rather than account:read and is audited. Everywhere else in this API masks them. For new work prefer per-environment data tokens, which can be minted and revoked independently instead of being shared.
      security:
        - adminToken:
            - keys:read
      parameters:
        - $ref: '#/components/parameters/DevId'
  /environments/{dev_id}/unified-api/sources:
    get:
      operationId: listSources
      tags:
        - sources
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProviderSummary'
                  has_more:
                    type: boolean
                  next_cursor:
                    type:
                      - string
                      - 'null'
                required:
                  - data
                  - has_more
                  - next_cursor
              example:
                data:
                  - provider: garmin
                    active: true
                    auth_redirect_url: https://api.acme.com/terra/callback
                  - provider: oura
                    active: true
                has_more: false
                next_cursor: null
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
      summary: List enabled providers
      description: Covers unified-api providers only. Rows are lean, giving the provider, whether it is active and its auth redirect URL, with credentials and custom scopes on their own sub-resources.
      security:
        - adminToken:
            - providers:read
      parameters:
        - $ref: '#/components/parameters/DevId'
  /environments/{dev_id}/unified-api/sources/{provider}:
    put:
      operationId: enableSource
      tags:
        - sources
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderEnabled'
              example:
                provider: garmin
                active: true
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
      summary: Enable a provider (idempotent)
      description: 'Enabling only turns the provider on: it configures no credentials and no scopes, so until custom credentials are set the environment authorizes end users against Terra''s own OAuth app, which is what terra_owned reports on the credentials read. A repeat call is not an error and answers with the same provider and active pair.'
      security:
        - adminToken:
            - providers:write
      parameters:
        - $ref: '#/components/parameters/DevId'
        - name: provider
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/IdempotencyKey'
    delete:
      operationId: disableSource
      tags:
        - sources
      responses:
        '200':
          description: Dry-run preview.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DryRunResult'
              example:
                dry_run: true
                would: disable
                preview:
                  provider: garmin
        '204':
          description: Disabled.
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
      summary: Disable a provider
      description: Takes the provider out of this environment's enabled set. Nothing is collected from it while it is off, and enabling it again does not backfill the gap. Pass ?dry_run=true for a preview that commits nothing; the PUT on this path is the inverse.
      security:
        - adminToken:
            - providers:write
      parameters:
        - $ref: '#/components/parameters/DevId'
        - name: provider
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/DryRun'
        - $ref: '#/components/parameters/IdempotencyKey'
  /environments/{dev_id}/unified-api/sources/{provider}/credentials:
    get:
      operationId: getSourceCredentials
      tags:
        - sources
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderCredentials'
              example:
                provider: garmin
                has_credentials: true
                terra_owned: false
                credential:
                  provider_client_id: acme-garmin-oauth
                  provider_client_secret_masked: '****9876'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
      summary: Provider OAuth credentials (masked)
      description: Reports whether this environment has its own OAuth app for the provider and, if so, the client id with the secret masked to its last digits. `credential` is null when none is set, and terra_owned distinguishes running on Terra's app from running on the customer's. The secret itself is write-only and is never readable here.
      security:
        - adminToken:
            - providers:read
      parameters:
        - $ref: '#/components/parameters/DevId'
        - name: provider
          in: path
          required: true
          schema:
            type: string
    put:
      operationId: setSourceCredentials
      tags:
        - sources
      summary: Set custom provider OAuth credentials
      description: Set the customer's own OAuth credentials (client_id/secret, optional redirect URL, verification secret, sandbox) so auth runs against their app. Idempotent; the secret is write-only and masked on read.
      security:
        - adminToken:
            - providers:write
      parameters:
        - $ref: '#/components/parameters/DevId'
        - name: provider
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProviderCredentialWrite'
      responses:
        '200':
          description: The stored credential (secret masked).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderCredentials'
              example:
                provider: garmin
                has_credentials: true
                terra_owned: false
                credential:
                  provider_client_id: acme-garmin-oauth
                  provider_client_secret_masked: '****4321'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /environments/{dev_id}/unified-api/sources/{provider}/scopes:
    get:
      operationId: getSourceScopes
      tags:
        - sources
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderScopes'
              example:
                provider: garmin
                scopes:
                  - read:activity
                  - read:sleep
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
      summary: Custom OAuth scopes
      description: Only the custom scopes this environment has set, never the provider's own defaults. The array is empty rather than null when nothing custom is configured, which is how the provider's default scopes read.
      security:
        - adminToken:
            - providers:read
      parameters:
        - $ref: '#/components/parameters/DevId'
        - name: provider
          in: path
          required: true
          schema:
            type: string
    put:
      operationId: setSourceScopes
      tags:
        - sources
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderScopes'
              example:
                provider: garmin
                scopes:
                  - read:activity
                  - read:sleep
                  - read:body
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
      summary: Set custom OAuth scopes
      description: 'A full replace of the environment''s custom scope set for this provider: whatever is not in the body is removed. An empty array clears the custom scopes entirely, which puts the provider''s defaults back in use.'
      security:
        - adminToken:
            - providers:write
      parameters:
        - $ref: '#/components/parameters/DevId'
        - name: provider
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScopesRequest'
  /environments/{dev_id}/unified-api/destinations:
    get:
      operationId: listDestinations
      tags:
        - destinations
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/DestinationSummary'
                  has_more:
                    type: boolean
                  next_cursor:
                    type:
                      - string
                      - 'null'
                required:
                  - data
                  - has_more
                  - next_cursor
              example:
                data:
                  - id: '1937255512398764032'
                    type: webhook
                    url: https://api.acme.com/terra/webhook
                    active: true
                    event_types:
                      - activity
                      - sleep
                      - daily
                has_more: false
                next_cursor: null
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
      summary: List destinations
      description: 'Rows carry no credential material: a destination''s signing secret is returned only in the create response, and the metadata an advanced destination type was configured with is not read back. Cursor-paginated, and inactive destinations are listed too, with active: false.'
      security:
        - adminToken:
            - destinations:read
      parameters:
        - $ref: '#/components/parameters/DevId'
    post:
      operationId: createDestination
      tags:
        - destinations
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedDestination'
              example:
                id: '1937255512398764032'
                type: webhook
                url: https://api.acme.com/terra/webhook
                active: true
                event_types:
                  - activity
                  - sleep
                signing_secret: a4f8…shown-once…c917
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
      summary: Create a destination
      description: 'The 201 body is the only place this destination''s signing_secret appears: signing is per destination, and neither the list nor the update endpoint returns it again, so store it now. `url` is the only required field, type defaults to webhook, and `metadata` carries the credential JSON that advanced destination types need.'
      security:
        - adminToken:
            - destinations:write
      parameters:
        - $ref: '#/components/parameters/DevId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDestinationRequest'
  /environments/{dev_id}/unified-api/destinations/{destination_id}:
    patch:
      operationId: patchDestination
      tags:
        - destinations
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DestinationSummary'
              example:
                id: '1937255512398764032'
                type: webhook
                url: https://api.acme.com/terra/webhook
                active: false
                event_types:
                  - activity
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
      summary: Update a destination
      description: 'Only `active` and `event_types` can change: a destination''s URL and type are fixed once created, so pointing deliveries somewhere else means creating a new destination and deleting the old one. The response is the destination summary, which never includes the signing secret.'
      security:
        - adminToken:
            - destinations:write
      parameters:
        - $ref: '#/components/parameters/DevId'
        - name: destination_id
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchDestinationRequest'
    delete:
      operationId: deleteDestination
      tags:
        - destinations
      responses:
        '200':
          description: Dry-run preview.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DryRunResult'
              example:
                dry_run: true
                would: delete
                preview:
                  id: '1937255512398764032'
                  type: webhook
                  url: https://api.acme.com/terra/webhook
        '204':
          description: Deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
      summary: Delete a destination
      description: Removal is permanent and takes the destination's signing secret with it, so recreating the same URL produces a new destination with a new secret that receivers have to be told about. Pass ?dry_run=true first for a preview of what would go.
      security:
        - adminToken:
            - destinations:write
      parameters:
        - $ref: '#/components/parameters/DevId'
        - name: destination_id
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/DryRun'
        - $ref: '#/components/parameters/IdempotencyKey'
  /environments/{dev_id}/unified-api/destinations/supabase/oauth:
    post:
      operationId: startSupabaseOauth
      tags:
        - destinations
      responses:
        '201':
          description: Started.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupabaseStartResponse'
              example:
                authorization_url: https://api.supabase.com/v1/oauth/authorize?client_id=…&state=…
                oauth_session_id: 7f3a…64-hex…c2d1
                expires_in: 900
                interval: 5
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      summary: Start Supabase OAuth
      description: 'Opens a pairing session and changes nothing yet: someone has to visit the authorization_url and approve access, after which the state endpoint for this oauth_session_id reports ready. The session expires after `expires_in` seconds, and `interval` is how often to poll in the meantime.'
      security:
        - adminToken:
            - destinations:write
      parameters:
        - $ref: '#/components/parameters/DevId'
        - $ref: '#/components/parameters/IdempotencyKey'
  /environments/{dev_id}/unified-api/destinations/supabase/oauth/{oauth_session_id}:
    get:
      operationId: pollSupabaseOauth
      tags:
        - destinations
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupabaseState'
              example:
                state: ready
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      summary: Poll Supabase OAuth state
      description: 'Reports one of pending, ready or failed for the session started on this path. Poll it at the `interval` the start response gave and give up at its `expires_in`: a failed authorization is a 200 carrying state: failed, not an error status.'
      security:
        - adminToken:
            - destinations:write
      parameters:
        - $ref: '#/components/parameters/DevId'
        - name: oauth_session_id
          in: path
          required: true
          schema:
            type: string
  /environments/{dev_id}/unified-api/destinations/supabase/oauth/{oauth_session_id}/projects:
    get:
      operationId: listSupabaseProjects
      tags:
        - destinations
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                  has_more:
                    type: boolean
                  next_cursor:
                    type:
                      - string
                      - 'null'
                  meta:
                    type: object
                required:
                  - data
                  - has_more
                  - next_cursor
              example:
                data:
                  - id: abcdefghijklmnop
                    name: acme-prod
                meta:
                  organization: acme
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
