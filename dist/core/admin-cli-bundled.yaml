        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
      summary: Update a destination
      description: '`config` is merged over the stored configuration: an omitted field keeps its value, secrets included, so a form can send only what changed, and null clears an optional field. A stored secret is never sent to a new endpoint: changing a database''s scheme, host, port, database or username, a Kafka host or port, a Supabase project_url or an Azure account_url requires the secret in the same request. The type cannot change. Activating a destination, or editing an active one, needs a complete configuration. A webhook keeps its signing secret. Any successful update resets the destination''s delivery-failure tracking. The response is the destination with its secrets masked.'
      security:
