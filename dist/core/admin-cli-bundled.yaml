          example:
            type: about:blank
            title: conflict
            detail: the account has reached its active-token limit
            instance: /api/v3/admin/environments/prod-app-x81LmQ/unified-api/sources/garmin
            code: token_limit_reached
            remediation: Revoke unused tokens, then retry.
    PreconditionFailed:
      description: The state the request was conditioned on has changed since it was read.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: precondition failed
            detail: your Garmin configuration changed since you reviewed it
            instance: /api/v3/admin/environments/prod-app-x81LmQ/unified-api/sources/garmin/webhook-endpoints/apply
            code: precondition_failed
            remediation: Read the webhook endpoints again, review them, and apply with the new fingerprint.
    ServiceUnavailable:
      description: A required subsystem is not available on this deployment.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: service unavailable
            detail: billing is not available on this deployment
            instance: /api/v3/admin/environments/prod-app-x81LmQ/unified-api/sources/garmin
            code: service_unavailable
    InternalError:
      description: Unexpected server-side failure while processing the request.
