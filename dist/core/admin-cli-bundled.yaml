  /environments/{dev_id}/webhook-events/stats:
    get:
      operationId: getEventStats
      x-terra-help: Summarize delivery attempts, outcomes, retries and response times (events:read). Defaults to a flat basic summary for the last 24 hours. Use --view full for graphs and breakdowns; add --compare previous_period for a preceding-window summary.
      tags:
        - webhookevents
      summary: Delivery event statistics
      description: 'Recorded outbound delivery attempt analytics over [since, until). Basic is the default: flat scalar counts, rates and latency percentiles, without bucket or breakdown aggregation. Full preserves those top-level metrics and adds every UTC time bucket, breakdowns and a response-time histogram. Full allows at most 1500 intersecting buckets; basic has no bucket limit. Status 200-299 is successful; every other status is failed. delivery_attempts includes retries; successful_attempts and failed_attempts partition that count. Latency samples must be finite and positive; units are milliseconds. Percentiles use TDigest over the whole window. Breakdown dimensions are event data type, provider, destination type and HTTP status. compare=previous_period requires view=full and adds a summary for the immediately preceding equal-duration window. This does not include synchronous API reads. Timestamps must be within 1900-2299 with at most millisecond precision. Destination filters apply to every metric and to the comparison window.'
      security:
        - adminToken:
            - events:read
      parameters:
        - $ref: '#/components/parameters/DevId'
        - name: destination
          in: query
          x-terra-help: Exact destination ID recorded at delivery time. Older rows without IDs do not match; use --destination-url for those.
          description: String-encoded destination ID, matched exactly against the delivery-time record. Rows that predate destination ID recording do not match. Use destination_url to include older rows.
          schema:
            type: string
          example: '1937255512398764032'
        - name: destination_url
          in: query
          x-terra-help: Exact recorded destination URL, including older deliveries. Combines with --destination.
          description: Exact, case-sensitive destination URL recorded at delivery time. Combines with destination when both are supplied. Also matches older rows without a recorded destination ID.
          schema:
            type: string
          example: https://api.acme.com/terra/webhook
        - name: since
          in: query
          x-terra-help: 'Inclusive start (RFC3339, millisecond precision). Default: 24 hours before --until.'
          description: Inclusive start in RFC3339 with at most millisecond precision.
          schema:
            type: string
            format: date-time
          example: '2026-06-01T00:00:00Z'
        - name: until
          in: query
          x-terra-help: 'Exclusive end (RFC3339, millisecond precision). Default: now.'
          description: Exclusive end in RFC3339 with at most millisecond precision. Must be after since.
          schema:
            type: string
            format: date-time
          example: '2026-06-01T00:01:00Z'
        - name: granularity
          in: query
          x-terra-help: 'Full view only. UTC bucket size: minute, hour, day. Default: minute up to 6h, hour up to 7d, otherwise day.'
          description: Only affects view=full. UTC bucket size. Defaults to minute for windows up to 6 hours, hour for windows up to 7 days, and day otherwise. The full-view window must fit at most 1500 buckets, including partial boundary buckets.
          schema:
            type: string
            enum:
              - minute
              - hour
              - day
          example: minute
        - name: compare
          in: query
          x-terra-help: Requires --view full. Use previous_period for the preceding equal-length window.
          description: Requires view=full. Adds a flat summary for the previous equal-duration period. Omit to avoid the additional aggregate query.
          schema:
            type: string
            enum:
              - previous_period
          example: previous_period
        - name: view
          in: query
          description: Response detail level. Basic returns flat scalar summary fields. Full keeps the same summary fields and adds time series and resource-specific detail sections. Defaults to basic.
          x-terra-help: 'Response detail: basic (default) or full. Full adds graph and breakdown data.'
          schema:
            type: string
            enum:
              - basic
              - full
            default: basic
          example: full
      responses:
        '200':
          description: Scalar summary metrics in both views; full adds documented detail sections.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventStatsResponse'
              examples:
                basic:
                  summary: Default flat summary
                  value:
                    since: '2026-06-01T00:00:00Z'
                    until: '2026-06-01T00:01:00Z'
                    view: basic
                    bytes: 512
                    delivery_attempts: 1
                    successful_attempts: 1
                    failed_attempts: 0
                    retry_attempts: 0
                    success_rate: 1
                    response_time_samples: 1
                    p50_response_time_ms: 125
                    p95_response_time_ms: 125
                    p99_response_time_ms: 125
                full:
                  summary: Full analytics, including graph data
                  value:
                    since: '2026-06-01T00:00:00Z'
                    until: '2026-06-01T00:01:00Z'
                    view: full
                    bytes: 512
                    delivery_attempts: 1
                    successful_attempts: 1
                    failed_attempts: 0
                    retry_attempts: 0
                    success_rate: 1
                    response_time_samples: 1
                    p50_response_time_ms: 125
                    p95_response_time_ms: 125
                    p99_response_time_ms: 125
                    granularity: minute
                    series:
                      - bucket_start: '2026-06-01T00:00:00Z'
                        bytes: 512
                        delivery_attempts: 1
                        successful_attempts: 1
                        failed_attempts: 0
                        retry_attempts: 0
                        success_rate: 1
                    breakdowns:
                      data_type:
                        - data_type: daily
                          bytes: 512
