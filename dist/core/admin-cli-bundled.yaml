            type: string
          description: The provider this applies to, as a slug, e.g. garmin. An unrecognised provider is a 400.
        - $ref: '#/components/parameters/IdempotencyKey'
    delete:
      operationId: disableSource
      x-terra-help: Disable a provider and stop collection. Re-enabling does not backfill the gap. Use --dry-run to preview.
