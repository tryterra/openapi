      tags:
        - team
      summary: Invite someone to the company
      description: Records a pending membership for the caller's own company and returns the one-use invitation token. The company comes from the token's principal and cannot be named in the body. Only the token's digest is stored, so the value in this response is the only copy — a lost token must be replaced, not recovered. The invitee redeems it during dashboard sign-in, which is where the company and role are applied.
