      description: 'Scoped to the single data type named in the body, and the field list replaces what was stored: anything left out of `fields` is deselected. samples_enabled comes back in the response but cannot be set here, and the PUT on this path is what selects data types in the first place. A data type that is not selected returns 404 in both preview and live mode. Supports ?dry_run=true for a preview that commits nothing.'
      security:
        - adminToken:
            - dataconfig:write
      parameters:
        - $ref: '#/components/parameters/DevId'
        - $ref: '#/components/parameters/DryRun'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SelectedDataFieldsRequest'
    put:
      operationId: putUnifiedApiScopes
      x-terra-help: Replace selected data types; omitted types are deselected. ATHLETE stays selected; HEALTH_OBSERVATION needs its entitlement. SAMPLES controls sample flags.
      tags:
        - dataconfig
      responses:
        '200':
          description: Updated (or DryRunResult when ?dry_run=true).
          content:
            application/json:
              schema:
                type: object
                anyOf:
                  - $ref: '#/components/schemas/SelectedDataTypes'
                  - $ref: '#/components/schemas/DryRunResult'
              example:
                scopes:
                  - ATHLETE
                  - ACTIVITY
                  - BODY
                  - SLEEP
                samples_enabled: true
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
      summary: Replace which data types are selected
      security:
        - adminToken:
            - dataconfig:write
      parameters:
        - $ref: '#/components/parameters/DevId'
        - $ref: '#/components/parameters/DryRun'
        - $ref: '#/components/parameters/IdempotencyKey'
      description: 'Sets WHICH data types this environment collects, wholesale — the PATCH on this path sets the fields within one data type. Send the complete desired set: anything omitted is deselected, and nothing is read back first, so a concurrent edit is never silently reinstated. ATHLETE is always selected and need not be sent; SAMPLES is the per-row samples flag, not a data type; HEALTH_OBSERVATION is 403 access_denied unless the account holds the health_observation entitlement. Gated dataconfig:write rather than account:write so an environment''s data scopes stay editable by every role that can configure data.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplaceDataTypesRequest'
