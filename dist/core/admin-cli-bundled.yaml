              example:
                authorization_url: https://api.supabase.com/v1/oauth/authorize?client_id=…&state=…
                oauth_session_id: 7f3a…64-hex…c2d1
                expires_in: 900
                interval: 5
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      summary: Start Supabase OAuth
      description: 'Opens a pairing session and changes nothing yet: someone has to visit the authorization_url and approve access, after which the state endpoint for this oauth_session_id reports ready. The session expires after `expires_in` seconds, and `interval` is how often to poll in the meantime. The body is optional. With `return_to: dashboard` the browser comes back to the dashboard''s connections page with `supabase_setup=success&oauth_session_id=<id>`, or `supabase_setup=error&reason=<code>` if the authorization failed; the default, `cli`, shows a page telling the user to return to their terminal. Both values share one redirect_uri, the Terra callback registered with Supabase; return_to only decides where that callback sends the browser.'
      security:
        - adminToken:
            - destinations:write
