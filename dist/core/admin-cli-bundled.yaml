    EventRecord:
      type: object
      properties:
        event_id:
          type: string
        sent_at:
          type: string
          format: date-time
        data_type:
          type: string
        provider:
          type: string
        destination_type:
          type: string
        destination_id:
          type: string
          description: String-encoded destination ID recorded at delivery time. Absent on older rows that did not record an ID.
        destination_url:
          type: string
          description: Destination URL recorded at delivery time, including for destinations since edited or deleted. Empty for destinations without a URL.
        http_status:
          type: integer
        response_time_ms:
          type: integer
          format: int64
        bytes:
          type: integer
          format: int64
        connection_id:
          type: string
          description: string-encoded 64-bit id
        user_id:
          type: string
          format: uuid
          description: The Terra user the delivery belongs to, as a UUID. Pass it to resend with the row's event_id and data_type. Absent on a row whose connection has since been deleted.
        reference_id:
          type: string
          description: Your own id for that user, as it was set on the connection. Absent where none is set, or where the connection has since been deleted.
      x-terra-operations:
        - method_name: stats
          operation: get
          path: /environments/{dev_id}/webhook-events/stats
          examples:
            - summary: Summarize delivery outcomes and response times
              args:
                - '--env'
                - <dev-id>
            - summary: Summarize one destination
              args:
                - '--env'
                - <dev-id>
                - '--destination'
                - <destination-id>
            - summary: Compare hourly delivery statistics with the previous period
              args:
                - '--env'
                - <dev-id>
                - '--view'
                - full
                - '--granularity'
                - hour
                - '--compare'
                - previous_period
        - method_name: list
          operation: get
          path: /environments/{dev_id}/webhook-events
          columns:
            - event_id
            - data_type
            - provider
            - destination_type
            - destination_id
            - destination_url
            - http_status
            - sent_at
          examples:
            - summary: Find failed deliveries for one destination
              args:
                - '--env'
                - <dev-id>
                - '--outcome'
                - failed
                - '--destination'
                - <destination-id>
            - summary: Filter providers and destinations
              args:
                - '--env'
                - <dev-id>
                - '--provider'
                - GARMIN
                - '--provider'
                - FITBIT
                - '--destination-type'
                - webhook
                - '--destination-type'
                - s3
            - summary: Find deliveries in a time window (replace the sample dates)
              args:
                - '--env'
                - <dev-id>
                - '--since'
                - '2026-09-01T00:00:00Z'
                - '--until'
                - '2026-09-02T00:00:00Z'
            - summary: Fetch up to 2 pages of 25 deliveries each
              args:
                - '--env'
                - <dev-id>
                - '--limit'
                - '25'
