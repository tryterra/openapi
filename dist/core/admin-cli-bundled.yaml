          in: path
          required: true
          schema:
            type: string
          description: The session handle the start step returned. It expires, so a stale handle is a 404 rather than an error naming the session.
  /environments/{dev_id}/unified-api/destinations/supabase/provision:
    post:
      operationId: provisionSupabase
      x-terra-confirmation-reason: Can create a new project in your Supabase organization, which Supabase may bill for, and deletes the destination it replaces.
      x-terra-help: Provision a Supabase data destination in an existing or new project. Requires a ready OAuth session; may take minutes.
