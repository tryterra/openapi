  /environments/{dev_id}/users/stats:
    get:
      operationId: getUserStats
      x-terra-help: Connection balances, delivery attempts and bytes (connections:read). Defaults to a flat basic summary for the trailing 3 months; --until is exclusive. Use --view full for daily buckets and current provider balances (at most 1500 buckets).
      tags:
        - connections
      summary: Connection and delivery statistics
      description: Connection and delivery analytics over [since, until), defaulting to the trailing 3 months. The default basic view returns only flat scalar summary metrics. Full keeps those metrics at the same top level and adds current provider balances and every UTC daily bucket, including inactive days. Activity counts are zero-filled and connection balances carry forward. delivery_attempts counts recorded outbound attempts, including retries and failures. net_connections is the all-time CREATE minus DELETE balance at the end of the interval, not a sum or distinct-user count. Current provider balances are independent of the requested window; observed_at is their read time, not an ingestion watermark or atomic snapshot. since and until support at most millisecond precision and must be within 1900-2299. Full is limited to 1500 intersecting daily buckets, including partial boundary buckets. Basic skips daily and provider aggregation and has no bucket limit.
      security:
        - adminToken:
            - connections:read
      parameters:
        - $ref: '#/components/parameters/DevId'
        - name: since
          x-terra-help: 'Inclusive statistics start (RFC3339). Default: 3 months before --until. Millisecond precision.'
          in: query
          schema:
            type: string
            format: date-time
          description: Inclusive start of the event window. Defaults to 3 months before until.
          example: '2026-06-01T00:00:00Z'
        - name: until
          x-terra-help: 'Exclusive statistics end (RFC3339). Default: now. Must be after --since. Millisecond precision.'
          in: query
          schema:
            type: string
            format: date-time
          description: Exclusive end of the event window. Defaults to now. Must be after since.
          example: '2026-06-03T00:00:00Z'
        - name: view
          in: query
          description: Response detail level. Basic returns flat scalar summary fields. Full keeps the same summary fields and adds time series and resource-specific detail sections. Defaults to basic.
          x-terra-help: 'Response detail: basic (default) or full. Full adds graph and breakdown data.'
          schema:
            type: string
            enum:
              - basic
              - full
            default: basic
          example: full
      responses:
        '200':
          description: Scalar summary metrics in both views; full adds documented detail sections.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserStatsResponse'
              examples:
                basic:
                  summary: Default flat summary
                  value:
                    since: '2026-06-01T00:00:00Z'
                    until: '2026-06-03T00:00:00Z'
                    view: basic
                    net_connections: 10
                    net_connection_change: 2
                    connections_created: 3
                    connections_deleted: 1
                    delivery_attempts: 240
                    bytes: 1048576
                full:
                  summary: Full analytics, including graph data
                  value:
                    since: '2026-06-01T00:00:00Z'
                    until: '2026-06-03T00:00:00Z'
                    view: full
                    net_connections: 10
                    net_connection_change: 2
                    connections_created: 3
                    connections_deleted: 1
                    delivery_attempts: 240
                    bytes: 1048576
                    granularity: day
                    current:
                      observed_at: '2026-06-10T12:00:00Z'
                      net_connections: 9
                      providers:
                        - provider: garmin
                          net_connections: 9
                    series:
                      - bucket_start: '2026-06-01T00:00:00Z'
                        net_connections: 10
                        net_connection_change: 2
                        connections_created: 2
                        connections_deleted: 0
                        delivery_attempts: 200
                        bytes: 1000000
                      - bucket_start: '2026-06-02T00:00:00Z'
                        net_connections: 10
                        net_connection_change: 0
                        connections_created: 1
                        connections_deleted: 1
                        delivery_attempts: 40
                        bytes: 48576
