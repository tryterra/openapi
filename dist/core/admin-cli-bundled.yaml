openapi: 3.1.0
info:
  title: Terra Admin API
  version: 2026.10.09.1
  description: Customer-scoped admin/agent API. Tokens are minted via an RFC 8628 device flow approved on the dashboard. Tenant targeting is the {dev_id} path segment only. Errors are RFC 7807 problem+json with a stable `code`. Mutations accept an Idempotency-Key header and emit X-RateLimit-* headers. Product reads and replay actions additionally require current entitlements (403 entitlement_required). Disabled environments return 403 environment_disabled; unavailable current authorization returns 503 authorization_unavailable. Billing, configuration and recovery retain their existing permissions.
  x-terra-audience: cli
servers:
  - url: /api/v3/admin
security:
  - adminToken: []
tags:
  - name: auth
    description: Device-flow pairing that mints an admin token. The CLI drives this from `terra login`; there is no command for the individual steps.
  - name: tokens
    description: Manage admin tokens for this account
  - name: company
    description: Manage the company record and onboarding
  - name: team
    description: Manage team members
  - name: environments
    description: Manage environments (dev-ids) and their credentials
  - name: sources
    description: Enable and configure wearable providers
  - name: destinations
    description: Manage data destinations
  - name: dataconfig
    description: Configure which data Terra collects and how it is processed
  - name: scores
    description: Configure and inspect scores
  - name: models
    description: The catalog of generally-available models, and the per-environment history of model runs.
  - name: webhookevents
    description: Inspect, resend and generate webhook events
  - name: connections
    description: Inspect end-user connections
  - name: syntheticusers
    description: Create synthetic test users and start or stop the data they generate
  - name: workouts
    description: Manage workout metadata
  - name: vantage
    description: Configure Vantage
  - name: entitlements
    description: Manage account capabilities
  - name: billing
    description: Subscriptions, invoices, and usage
  - name: docs
    description: Natural-language search over Terra's published documentation.
paths:
  /auth/authorize:
    get:
      operationId: authorizeOAuth
      x-terra-hand-written: true
      tags:
        - auth
      summary: Begin an authorization-code grant with S256 PKCE
      description: Requires ADMIN_OAUTH_ENABLED. Accepts an HTTPS client ID metadata document URL as client_id, and validates the client and the exact registered redirect before any redirect. Empty scope selects the MCP preset. Untrusted clients receive a local error page. Consent is completed through the authenticated dashboard bridge.
      security: []
      parameters:
        - name: client_id
          in: query
          required: true
          schema:
            type: string
          description: HTTPS client ID metadata document URL.
        - name: redirect_uri
          in: query
          required: true
          schema:
            type: string
          description: Registered redirect URI.
        - name: response_type
          in: query
          required: true
          schema:
            type: string
            enum:
              - code
          description: Authorization code response.
        - name: code_challenge
          in: query
          required: true
          schema:
            type: string
          description: Base64url SHA-256 of the verifier.
        - name: code_challenge_method
          in: query
          required: true
          schema:
            type: string
            enum:
              - S256
          description: Required PKCE method.
        - name: resource
          in: query
          required: true
          style: form
          explode: true
          schema:
            type: array
            minItems: 1
            items:
              type: string
          description: https://access.tryterra.co/api/v3/admin/mcp
        - name: scope
          in: query
          schema:
            type: string
          description: Space-separated admin scopes.
        - name: state
          in: query
          schema:
            type: string
          description: Opaque state echoed unchanged.
        - name: requested_dev_ids
          in: query
          schema:
            type: string
          description: Optional space-separated environment IDs.
      responses:
        '302':
          description: Dashboard consent redirect, or a client error redirect with state and iss.
          headers:
            Location:
              description: Redirect destination.
              schema:
                type: string
        '400':
          description: Client or redirect is untrusted; no redirect is issued.
          content:
            text/html:
              schema:
                type: string
        '503':
          description: Authorization-code flow is disabled (temporarily_unavailable JSON), or the client's metadata could not be fetched (an HTML page with Retry-After; no redirect is issued because the redirect URI is unverified).
          headers:
            Retry-After:
              schema:
                type: string
              description: Seconds to wait before retrying.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
            text/html:
              schema:
                type: string
  /auth/device:
    post:
      operationId: startDeviceAuth
      x-terra-hand-written: true
      tags:
        - auth
      responses:
        '200':
          description: Device pairing started.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceStartResponse'
              example:
                device_code: kJ9…43-chars…Qw
                user_code: TERRA-K7MP-4WX2
                verification_uri: https://dashboard.tryterra.co/cli/verify
                verification_uri_complete: https://dashboard.tryterra.co/cli/verify?code=TERRA-K7MP-4WX2
                expires_in: 900
                interval: 5
        '400':
          description: invalid_request | invalid_scope (RFC 6749 §5.2 envelope).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
              example:
                error: invalid_request
                error_description: client_id is required
      summary: Begin device-pairing auth (RFC 8628)
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DeviceStartFormRequest'
      description: 'Standard RFC 8628 §3.1 device authorization request: form-encoded body, JSON response (200), RFC 6749 §5.2 error envelope, Cache-Control: no-store. This endpoint speaks only the OAuth wire format.'
  /auth/token:
    post:
      operationId: pollToken
      x-terra-hand-written: true
      tags:
        - auth
      responses:
        '200':
          description: Token minted (RFC 6749 §5.1).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthTokenResponse'
              example:
                access_token: terra_at_kJ9…shown-once…Qw
                token_type: Bearer
                expires_in: 2592000
                scope: account:read providers:read events:read
                token_id: 8b7f2c1e-4a5d-4f6e-9c3b-2d1a0e9f8b7a
        '400':
          description: authorization_pending | slow_down | access_denied | expired_token | invalid_request | unsupported_grant_type | invalid_grant | invalid_client (RFC 8628 §3.5 / RFC 6749 §5.2 envelope).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
              example:
                error: authorization_pending
                error_description: authorization pending
        '401':
          description: Header client authentication failed (RFC 6749 §5.2).
          headers:
            WWW-Authenticate:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
        '503':
          description: temporarily_unavailable with Retry-After when the authorization-code flow is disabled, client metadata or keys cannot be fetched, or assertion replay protection is unavailable.
          headers:
            Retry-After:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
      summary: Exchange an authorization code or poll a device grant
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              anyOf:
                - $ref: '#/components/schemas/TokenPollFormRequest'
                - $ref: '#/components/schemas/AuthorizationCodeFormRequest'
                - $ref: '#/components/schemas/AuthorizationCodeAssertionFormRequest'
      description: 'Accepts authorization_code with code, S256 code_verifier, canonical MCP resource and optional exact redirect_uri, authenticated by the client''s declared method: none with a CIMD client_id, or private_key_jwt for CIMD clients that declare it, in which case client_id may be omitted. Requires ADMIN_OAUTH_ENABLED. Also accepts the standard RFC 8628 §3.4 device access token request: form-encoded body with grant_type urn:ietf:params:oauth:grant-type:device_code, RFC 6749 §5.1 token response, §5.2/§3.5 error envelope, Cache-Control: no-store. This endpoint speaks only the OAuth wire format. No refresh tokens are issued — rotate via POST /tokens/self/rotate.'
  /docs/ask:
    post:
      operationId: askDocs
      x-terra-help: Ask a question about Terra using the published docs. An empty sources array means the answer was not grounded in docs.
      tags:
        - docs
      summary: Ask a question about Terra and get an answer from the documentation
      description: 'Scope-free: the search reads no account data, so any valid token may ask. The answer is generated from the published documentation and cites the pages it drew on. An answer with an empty sources array was not grounded in the documentation, which is a 200 rather than an error.'
      security:
        - adminToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocsAskRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocsAskResponse'
              example:
                answer: Call generateWidgetSession and open the URL it returns [1].
                confidence: high
                sources:
                  - label: '1'
                    title: Generate a widget session
                    description: Create a session and redirect the user to the widget.
                    url: https://docs.tryterra.co/widget
                    type: documentation
                    breadcrumbs:
                      - Docs
                      - Authentication
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /me:
    get:
      operationId: getMe
      x-terra-help: Inspect the current token. User details require account:read; otherwise user is null.
      tags:
        - tokens
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
              example:
                token_id: 8b7f2c1e-4a5d-4f6e-9c3b-2d1a0e9f8b7a
                kind: admin
                customer_id: cus_9f3k2m
                scopes:
                  - account:read
                  - providers:read
                dev_ids:
                  - prod-app-x81LmQ
                name: terra-cli on alex-mbp
                created_via: dashboard
                expires_at: '2026-08-02T09:15:00Z'
                grant_anchor_at: '2026-07-03T09:15:00Z'
                last_used_at: '2026-07-03T09:15:00Z'
                user:
                  user_id: usr_8f2a1c
                  email: alex@acme.example
                  verified: true
                  name: Alex Doe
                  phone_number: '+15551234567'
                  created_at: '2025-01-10T09:00:00Z'
                  last_login: '2026-07-01T09:00:00Z'
                  company_id: cus_9f3k2m
                  role: admin
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
      summary: Introspect the calling token
      security:
        - adminToken: []
      description: 'Scope-free: any valid token may introspect what it holds. The user object is the exception and requires account:read — the token''s own properties are self-knowledge, but the minting user''s email/phone/role is the same PII that /me/metadata and /team/members/{user_id} gate. Without that scope, user is null.'
    patch:
      operationId: patchMe
      x-terra-help: Update your dashboard profile. Returns 404 if the token has no dashboard user.
      tags:
        - tokens
      responses:
        '200':
          description: Updated (or DryRunResult when ?dry_run=true).
          content:
            application/json:
              schema:
                type: object
                anyOf:
                  - type: object
                    properties:
                      user:
                        $ref: '#/components/schemas/DashboardUser'
                    required:
                      - user
                  - $ref: '#/components/schemas/DryRunResult'
              example:
                user:
                  user_id: usr_8f2a1c
                  email: alex@acme.example
                  verified: true
                  name: Alex Doe (she/her)
                  phone_number: '+15551234567'
                  created_at: '2025-01-10T09:00:00Z'
                  last_login: '2026-07-01T09:00:00Z'
                  company_id: cus_9f3k2m
                  role: admin
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      summary: Update the calling principal's own dashboard user profile
      description: The write is strictly self-scoped but carries account:write — a state change requires a write scope; account:write is in the default mint set, so only explicitly read-narrowed tokens lose self-edit. 404 not_found when the token has no resolvable own dashboard user (see DashboardUser).
      security:
        - adminToken:
            - account:write
      parameters:
        - $ref: '#/components/parameters/DryRun'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchMeRequest'
  /tokens/self:
    delete:
      operationId: revokeSelf
      x-terra-hand-written: true
      tags:
        - tokens
      responses:
        '200':
          description: DryRunResult when ?dry_run=true. The preview describes the token the call would revoke, which is the calling token itself.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DryRunResult'
              example:
                dry_run: true
                would: revoke
                preview:
                  token_id: 1c2d3e4f-5a6b-4c7d-8e9f-0a1b2c3d4e5f
                  kind: admin
                  name: terra-cli on alex-mbp
                  scopes:
                    - account:read
                  dev_ids: null
                  created_by: alex@acme.test
                  created_via: device
                  created_at: '2026-06-24T10:00:00Z'
                  expires_at: '2026-07-24T10:00:00Z'
                  last_used_at: '2026-06-24T11:02:00Z'
                  revoked_at: null
        '204':
          description: Revoked.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
      summary: Revoke the calling token
      description: Scope-free, because a token is always allowed to give up its own authority. Revocation is checked per request, so this is effectively the last call the token can make and anything after it is a 401. To revoke a different token, use the tokens:admin-gated delete by id.
      security:
        - adminToken: []
      parameters:
        - $ref: '#/components/parameters/DryRun'
        - $ref: '#/components/parameters/IdempotencyKey'
  /tokens/self/rotate:
    post:
      operationId: rotateSelf
      x-terra-confirmation-reason: The token you're signed in with stops working. Its replacement is shown only once, so save it.
      x-terra-help: Rotate the current token within its grant window. Save the new bearer now; check its expiry, scopes and environments.
      tags:
        - tokens
      responses:
        '200':
          description: DryRunResult when ?dry_run=true. The preview carries the clamped expiry the successor would get (a rotation near the grant anchor yields a short token); it omits token_id and token, which do not exist until the swap runs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DryRunResult'
              example:
                dry_run: true
                would: rotate
                preview:
                  kind: admin
                  name: ci runner
                  scopes:
                    - account:read
                  created_at: '2026-06-24T10:00:00Z'
                  expires_at: '2026-07-24T10:00:00Z'
                  last_used_at: null
                  revoked_at: null
                  rotated_from: 1c2d3e4f-5a6b-4c7d-8e9f-0a1b2c3d4e5f
                  will_return_token: true
        '201':
          description: Rotated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
              example:
                token: terra_at_Nw2…shown-once…Rk
                token_id: 1c2d3e4f-5a6b-4c7d-8e9f-0a1b2c3d4e5f
                kind: admin
                customer_id: cus_9f3k2m
                scopes:
                  - account:read
                  - providers:read
                dev_ids: null
                expires_at: '2026-08-02T09:15:00Z'
                name: terra-cli on alex-mbp
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
      summary: Replace the token you're signed in with
      description: 'Mints a replacement for the calling token and returns the new bearer once, which is the only copy: a caller that loses it has to pair again. Rotation is available only inside the token''s grant window, and outside it the request conflicts instead of minting anything. Read expires_at, scopes and dev_ids off the response rather than assuming they match the old token.'
      security:
        - adminToken: []
      parameters:
        - $ref: '#/components/parameters/DryRun'
        - $ref: '#/components/parameters/IdempotencyKey'
  /tokens:
    get:
      operationId: listTokens
      x-terra-help: List admin and data token metadata, including revoked tokens. Excludes session tokens and bearer values.
      tags:
        - tokens
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/TokenSummary'
                  has_more:
                    type: boolean
                  next_cursor:
                    type:
                      - string
                      - 'null'
                required:
                  - data
                  - has_more
                  - next_cursor
              example:
                data:
                  - token_id: 8b7f2c1e-4a5d-4f6e-9c3b-2d1a0e9f8b7a
                    kind: admin
                    name: terra-cli on alex-mbp
                    scopes:
                      - account:read
                    dev_ids: null
                    created_by: alex@acme.com
                    created_via: device_flow
                    created_at: '2026-07-03T09:15:00Z'
                    expires_at: '2026-08-02T09:15:00Z'
                    last_used_at: '2026-07-03T09:15:00Z'
                    revoked_at: null
                  - token_id: 2b3c4d5e-6f70-4a81-92b3-c4d5e6f70a81
                    kind: data
                    name: sdk-auth-only
                    scopes:
                      - auth:write
                    dev_ids:
                      - prod-app-x81LmQ
                    created_by: token:8b7f2c1e-4a5d-4f6e-9c3b-2d1a0e9f8b7a
                    created_via: admin_api
                    created_at: '2026-07-03T09:15:00Z'
                    expires_at: '2028-07-03T09:15:00Z'
                    last_used_at: null
                    revoked_at: null
                has_more: false
                next_cursor: null
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
      summary: List the account's tokens
      description: 'Metadata for the account''s admin and data tokens. No bearer is ever returned: an admin token''s is shown only when it is minted or rotated, and re-showing a data token''s is its own keys:read-gated endpoint. Short-lived dashboard session tokens never appear, and a revoked token stays listed with revoked_at set, so filter on that rather than assuming every row is live.'
      security:
        - adminToken:
            - tokens:admin
  /tokens/{token_id}:
    delete:
      operationId: revokeToken
      x-terra-confirmation-reason: This token stops working straight away, so anything still using it will fail.
      x-terra-help: Revoke a token immediately, including your current token. An unknown token or one outside your account returns 404.
      tags:
        - tokens
      responses:
        '200':
          description: DryRunResult when ?dry_run=true. The preview is the token that would be revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DryRunResult'
              example:
                dry_run: true
                would: revoke
                preview:
                  token_id: 1c2d3e4f-5a6b-4c7d-8e9f-0a1b2c3d4e5f
                  kind: admin
                  name: ci runner
                  scopes:
                    - account:read
                  created_at: '2026-06-24T10:00:00Z'
                  expires_at: '2026-07-24T10:00:00Z'
                  last_used_at: null
                  revoked_at: null
        '204':
          description: Revoked.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
      summary: Revoke an access token
      description: 'Immediate: validation happens per request, so the revoked token''s next call fails. 404 when no token with that id belongs to this account, whether it never existed or is someone else''s. Revoking the token you are calling with works here too, though the self route does it without tokens:admin.'
      security:
        - adminToken:
            - tokens:admin
      parameters:
        - name: token_id
          x-terra-help: Token UUID returned by creation. The bearer value is not accepted.
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The token to act on, by the id its creation returned. The token value itself is never accepted here.
        - $ref: '#/components/parameters/DryRun'
        - $ref: '#/components/parameters/IdempotencyKey'
  /company:
    get:
      operationId: getCompany
      x-terra-help: Get your account summary, company profile and whether a billing account is linked. Company and billing are null if no profile exists; billing identifiers are never returned.
      tags:
        - company
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountSummary'
              example:
                customer_id: cus_9f3k2m
                dev_id_count: 2
                company:
                  company_id: cus_9f3k2m
                  name: Acme Fitness
                  billing_email: billing@acme.example
                  website_url: https://acme.example
                  learn_about_us: search
                  onboarded: true
                  user_flow_done: true
                billing:
                  linked: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
      summary: Account summary
      description: 'The customer id, how many dev-ids the account has, and the company profile. `company` is null when the account has no company record yet, and the profile never carries the billing columns. `billing` reports only whether a billing account is linked, never its identifiers, and is null exactly when `company` is null. dev_id_count is only a count: the environments list endpoint is where the dev-ids themselves are.'
      security:
        - adminToken:
            - account:read
    patch:
      operationId: patchCompany
      x-terra-help: Update your company profile. Send at least one field; omitted fields stay unchanged. Unknown and billing fields are rejected.
      tags:
        - company
      responses:
        '200':
          description: Updated (or DryRunResult when ?dry_run=true).
          content:
            application/json:
              schema:
                type: object
                anyOf:
                  - type: object
                    properties:
                      company:
                        $ref: '#/components/schemas/CompanyProfile'
                    required:
                      - company
                  - $ref: '#/components/schemas/DryRunResult'
              example:
                company:
                  company_id: cus_9f3k2m
                  name: Acme Fitness (Inc.)
                  billing_email: billing@acme.example
                  onboarded: true
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      summary: Update company profile
