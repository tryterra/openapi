          in: query
          schema:
            type: array
            items:
              type: string
          style: form
          explode: false
          description: Provider slugs, matched case-insensitively, e.g. garmin. Repeat the parameter to widen the filter; an event matching any of them is returned.
        - name: data_type
          x-terra-help: Case-insensitive payload types (e.g. activity, sleep, body). Repeat to match any type.
          in: query
          schema:
            type: array
            items:
              type: string
          style: form
          explode: false
          description: Payload types, matched case-insensitively, e.g. activity, sleep or body. Repeat the parameter to widen the filter; an event matching any of them is returned.
        - name: destination_type
          x-terra-help: Case-insensitive destination kinds (e.g. webhook, s3, kafka). Repeat to match any kind.
          in: query
          schema:
            type: array
            items:
              type: string
          style: form
          explode: false
          description: Destination kinds the payload was delivered to, matched case-insensitively, e.g. webhook, s3 or kafka. Repeat the parameter to widen the filter; an event matching any of them is returned.
        - name: summary_id
          x-terra-help: Exact summary ID in any delivered record. Older payloads without recorded IDs never match.
          in: query
          schema:
            type: string
          description: A summary id carried by the payload, matched exactly. An event is returned when any of the records it delivered carries it. Payloads written before summary ids were recorded carry none and never match.
        - name: user_id
          x-terra-help: Terra user UUID; unknown users return 404. Intersects with --reference-id.
          in: query
          schema:
            type: string
            format: uuid
          description: Terra user id, a UUID, resolved to that user's connection before the history is read. An unknown user returns 404; a user with no deliveries in this environment returns an empty page. Combines with reference_id rather than overriding it.
        - name: reference_id
          x-terra-help: Exact user reference across connections; unknown reference returns 404. Empty intersection with --user-id returns no events.
          in: query
          schema:
            type: string
          description: Your own id for a user, matched exactly and resolved to every connection under it. No match is a 404, not an empty page. Given with user_id it narrows further, so a user that is not under the reference matches no events.
        - name: event_id
          x-terra-help: Exact event ID; default window widens to 14 days. Override with --since/--until; no matching delivery returns an empty page.
          in: query
          schema:
            type: string
          description: Exact event id. An id is identity-keyed rather than time-keyed, so it widens the default window from 7 days to the 14 days a payload is retained for.
  /environments/{dev_id}/webhook-events/resend:
    post:
      operationId: resendWebhookEvent
      x-terra-help: Re-send a stored payload in the selected environment (events:write). Acceptance is asynchronous; the destination may receive the event twice.
      tags:
        - webhookevents
      responses:
        '200':
          description: DryRunResult when ?dry_run=true. Every lookup and the routing decision have run, so destination_count is how many destinations a live resend would reach; nothing is queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DryRunResult'
              example:
                dry_run: true
                would: resend
                preview:
                  event_id: 7d2f1c3a-9b4e-4f60-8a1d-2c3b4e5f6a7b
                  event_type: activity
                  user_id: 3f8e2b1c-4d5a-4e6f-9a0b-1c2d3e4f5a6b
                  destination_count: 2
                  dispatched: false
        '202':
          description: Queued for redelivery. Dispatch is asynchronous, so a 202 means the event was accepted rather than delivered; re-read the event to see the outcome.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResendResult'
              example:
                event_id: c9d0e1f2-3a4b-4c5d-8e9f-a0b1c2d3e4f5
                event_type: activity
                dispatched: true
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      summary: Re-dispatch a stored event
      description: 'Asynchronous: a 202 with dispatched: true means the event was accepted for redelivery, not that it arrived, so re-read the event to see the outcome. The destination receives the stored payload again, so a receiver that is not idempotent sees the same event twice. All three of user_id, event_id and event_type are required, which means fetching the row from the list endpoint first.'
      security:
        - adminToken:
            - events:write
      parameters:
        - $ref: '#/components/parameters/DevId'
        - $ref: '#/components/parameters/DryRun'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResendEventRequest'
  /environments/{dev_id}/webhook-events/generate:
    post:
      operationId: generateWebhookEvent
      x-terra-help: Generate a synthetic event in the selected environment and deliver it to its destinations (testdata:write). Use --dry-run to see the payload without delivering.
      tags:
        - webhookevents
      responses:
        '200':
          description: DryRunResult when ?dry_run=true. The preview is the GenerateEventResult that a real call would return, with dispatched false; nothing is stored or delivered, and the preview's event_id is not a real event.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DryRunResult'
              example:
                dry_run: true
                would: dispatch
                preview:
                  event_id: 7d2f1c3a-9b4e-4f60-8a1d-2c3b4e5f6a7b
                  type: sleep
                  provider: null
                  destination_id: null
                  dispatched: false
                  payload:
                    type: sleep
                    data: []
        '202':
          description: Queued for delivery. Dispatch is asynchronous, so the event is stored and accepted rather than delivered; it appears in the delivery history under event_id once sent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerateEventResult'
              example:
                event_id: 7d2f1c3a-9b4e-4f60-8a1d-2c3b4e5f6a7b
                user_id: 3f8e2b1c-4d5a-4e6f-9a0b-1c2d3e4f5a6b
                reference_id: qa-runner-17
                type: daily
                provider: garmin
                destination_id: null
                dispatched: true
                payload:
                  type: daily
                  user:
