      summary: List Supabase projects
      description: 'Reads the projects visible to the OAuth session, so it works only once that session has reached the ready state: poll it first, or expect a 409. Each row carries the organization it belongs to, and `meta.organizations` lists every organization the authorization can see, so a project can be created in one that has none yet. Pass a row''s `id` to provision as project_ref, or an organization''s `id` as create_project.organization_id.'
      security:
        - adminToken:
            - destinations:write
      parameters:
        - $ref: '#/components/parameters/DevId'
        - name: oauth_session_id
