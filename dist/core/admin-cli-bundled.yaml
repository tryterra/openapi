        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
      summary: Disable a provider
      description: Takes the provider out of this environment's enabled set. Nothing is collected from it while it is off, and enabling it again does not backfill the gap. Pass ?dry_run=true for a preview that commits nothing; the PUT on this path is the inverse.
      security:
        - adminToken:
            - providers:write
      parameters:
        - $ref: '#/components/parameters/DevId'
        - name: provider
          x-terra-help: Provider slug, e.g. garmin. Unknown providers return 400.
          in: path
          required: true
          schema:
            type: string
          description: The provider this applies to, as a slug, e.g. garmin. An unrecognised provider is a 400.
        - $ref: '#/components/parameters/DryRun'
        - $ref: '#/components/parameters/IdempotencyKey'
