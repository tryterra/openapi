      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
    get:
      operationId: listTeamInvitations
      tags:
        - team
      summary: List outstanding invitations
      description: 'Returns the caller''s own company''s invitations that are still claimable — unclaimed and unexpired. Claimed and expired rows stay in the table as the record of what happened but are not listed. The token itself is never returned: only its digest is stored, so an invitation cannot be recovered, only revoked and reissued.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/TeamInvitation'
                  has_more:
                    type: boolean
                  next_cursor:
                    type:
                      - string
                      - 'null'
                required:
                  - data
                  - has_more
                  - next_cursor
              example:
                data:
                  - id: 3f1c0a7e-9b52-4d61-8a3f-5c9e2d7b1a04
                    company_id: cus_acme
                    email: new.engineer@acme.test
                    role: developer
                    source: null
                    invited_by_user_id: usr_admin_acme
                    created_at: '2026-07-29T09:15:00Z'
                    expires_at: '2026-08-05T09:15:00Z'
                    claimed_at: null
                    claimed_by_user_id: null
                has_more: false
                next_cursor: null
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      security:
        - adminToken:
            - team:read
  /team/invitations/{invitation_id}:
    delete:
      operationId: revokeTeamInvitation
      tags:
        - team
      summary: Revoke an outstanding invitation
      description: 'Withdraws an unclaimed invitation. Tenancy is structural — the delete carries the caller''s own company — so an id belonging to another company matches nothing and answers 404 rather than confirming it exists. A claimed invitation is also a 404: that person is already a member, and removing them is DELETE /team/members/{user_id}.'
      parameters:
        - name: invitation_id
          in: path
          required: true
          schema:
