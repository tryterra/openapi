      description: 'Acceptance is recorded per document, so `document` matters: omitting it records the acceptance against the combined `bundle`, which is not the same record as accepting `tos` and `dpa` separately. accepted_role is free text, stored as given. The response echoes the version it recorded, which the check endpoint reads back.'
