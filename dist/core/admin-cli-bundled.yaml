          in: path
          required: true
          schema:
            type: string
          description: The terms_version to check.
        - name: document
          x-terra-help: 'Document to check: bundle, tos or dpa. Omit to match acceptance under any document.'
          in: query
          required: false
          schema:
            type: string
            enum:
              - bundle
              - tos
              - dpa
          description: Narrow the check to one document. Omitted means accepted under any document.
