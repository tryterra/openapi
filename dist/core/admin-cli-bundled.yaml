        - $ref: '#/components/parameters/DevId'
        - $ref: '#/components/parameters/DryRun'
        - $ref: '#/components/parameters/IdempotencyKey'
      description: Mints a new client_secret for this environment and returns it. Requires keys:write, the dangerous scope reserved for legacy-key mutation, which a default token does not hold; keys:read alone reveals but never rotates. Prefer coexisting data tokens — mint new, revoke old — which need no atomic swap; this exists for the dashboard settings page's legacy key. The rotated-away secret stops working immediately.
components:
  securitySchemes:
    adminToken:
      type: oauth2
      description: Terra access token (customer-scoped, kind=admin, `terra_at_*`). Tokens are minted by the RFC 8628 device-authorization flow (POST /auth/device, approve in the dashboard, poll POST /auth/token), the authorization_code grant (GET /auth/authorize, dashboard consent, S256 exchange at POST /auth/token), or a dashboard mint. There is no client_credentials token endpoint; the clientCredentials flow object below exists solely because OAS 3.1 has no first-class device-flow representation and this is where scopes are machine-readable (see x-grant-type); the authorizationCode flow is the browser grant and shares the same scopes. This surface accepts ONLY admin tokens; data tokens (kind=data, `terra_dt_*`, minted at POST /environments/{dev_id}/tokens) authenticate the data API only — the planes never cross. Each operation names its required scope; admin tokens may also carry an environment audience. The scopes map below is the whole closed vocabulary — BOTH planes. POST /auth/device grants only the admin-plane names and rejects the rest with 400 invalid_scope, so check the plane before choosing a set — x-scope-planes is the machine-readable answer, and a data-only description also opens with `Data plane:`. Every admin-grantable description is the sentence the approval page shows the person granting it, so it cites no routes and carries no plane, danger or sensitivity marker; the lists below are the only statement of those facts. More lists classify the admin-grantable scopes by rule. x-scope-dangerous is anything irreversible or about money, people, or credentials (spend, remove a person, issue or revoke credentials, rotate the key) — a default grant leaves it off and the approver must turn it on. It maps each dangerous scope to what it puts at stake (money, access or team). x-scope-sensitive is disclosure of what the approver already sees in the dashboard (the environment key, stored payload bodies) — granted by default, labeled. x-scope-account-level is anything that acts on the customer as a whole rather than one environment — a token limited to environments cannot hold it. Everything else is reversible configuration, undone with the same token. x-scope-presets are the named grant sets the approval page offers, derived from those lists.
      flows:
        clientCredentials:
          tokenUrl: /api/v3/admin/auth/token
          scopes:
            account:read: See your account details and environment IDs.
            keys:read: See your API key, the secret values of your data access tokens and the credentials your destinations use.
            keys:write: Replace your API key. Anything using the old key will stop working.
            providers:read: See which wearables and apps are turned on, and their settings.
            providers:write: Turn wearables and apps on or off, and change their sign-in settings.
            destinations:read: See where your data is sent, like a webhook or Supabase.
            destinations:write: Add, change or remove where your data is sent.
            events:read: See a log of the data sent to you, without its contents.
            events:write: Send data again.
            connections:read: See which of your users have connected.
            payloads:read: See your users' health data, both what was sent to you and what is stored for them.
            dataconfig:read: See which health data fields you get.
            dataconfig:write: Change which health data fields you get.
            scores:read: See which scores are turned on, and their settings.
            scores:write: Turn scores on and change their settings.
            models:read: See the available models and their past results.
            models:run: 'Data plane: run a model over a user''s stored data.'
            workouts:read: 'Data plane: read workout templates and planned workouts.'
            workouts:write: 'Data plane: create workout templates and plan workouts for users.'
            labreports:read: 'Data plane: read lab reports.'
            labreports:write: 'Data plane: reprocess or delete lab reports.'
            testdata:write: Send made-up health data to where your data goes, from one-off events or test users you can start and stop.
            billing:read: See your plan, invoices, payment method and usage.
            billing:write: Change your plan, pay invoices and update payment details. This can spend money.
            tokens:admin: See and revoke every token across your account, including other people's.
            entitlements:read: See which features your company has access to.
            auth:write: 'Data plane: create user authentication flows — widget sessions, auth tokens (in place of a client_secret).'
            connections:write: 'Data plane: deauthenticate users and update connection attributes.'
            data:read: 'Data plane: read stored end-user health data (activity, sleep, body, …).'
            data:write: 'Data plane: push or delete end-user health data.'
            routes:read: 'Data plane: read routes and pushed routes.'
            routes:write: 'Data plane: create, update, push, and delete routes.'
            datalinks:read: 'Data plane: read data links.'
            datalinks:write: 'Data plane: create and delete data links.'
            graphs:read: 'Data plane: read graph sessions.'
            graphs:write: 'Data plane: create and manage graph sessions (public renders of health data).'
            vantage:read: 'Data plane: read Vantage orders, results, labs and configuration.'
            vantage:write: 'Data plane: create Vantage orders, simulate orders and update configuration or result acknowledgments. Includes vantage:read.'
            agents:read: 'Data plane: read agents, bundles, jobs, and schedules.'
            agents:write: 'Data plane: create, update, and delete agents and their configuration.'
            agents:run: 'Data plane: execute agents and bundles (incurs model spend).'
            ai:run: 'Data plane: run AI-context queries and the MCP proxy.'
            tokens:read: See the data access tokens in an environment, but not their secret values.
            tokens:write: Create and revoke data access tokens in an environment, including other people's. A new token can do anything it's given access to.
            account:write: Change your profile and your company's details.
            team:read: See who is on your team.
            team:write: Invite, change or remove team members. This can take away someone's access.
          x-scope-planes:
            account:read: admin
            keys:read: both
            keys:write: admin
            providers:read: both
            providers:write: both
            destinations:read: admin
            destinations:write: admin
            events:read: admin
            events:write: both
            connections:read: both
            payloads:read: admin
            dataconfig:read: admin
            dataconfig:write: admin
            scores:read: admin
            scores:write: admin
            models:read: both
            models:run: data
            workouts:read: data
            workouts:write: data
            labreports:read: data
            labreports:write: data
            testdata:write: both
            billing:read: admin
            billing:write: admin
            tokens:admin: admin
            entitlements:read: admin
            auth:write: data
            connections:write: data
            data:read: data
            data:write: data
            routes:read: data
            routes:write: data
            datalinks:read: data
            datalinks:write: data
            graphs:read: data
            graphs:write: data
            vantage:read: data
            vantage:write: data
            agents:read: data
            agents:write: data
            agents:run: data
            ai:run: data
            tokens:read: admin
            tokens:write: admin
            account:write: admin
            team:read: admin
            team:write: admin
          x-scope-dangerous:
            billing:write: money
            keys:write: access
            team:write: team
            tokens:admin: access
            tokens:write: access
          x-scope-sensitive:
            - keys:read
            - payloads:read
          x-scope-account-level:
            - account:read
            - account:write
            - billing:read
            - billing:write
            - entitlements:read
            - team:read
            - team:write
            - tokens:admin
