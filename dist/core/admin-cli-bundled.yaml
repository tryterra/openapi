  /environments/{dev_id}/models/runs:
    get:
      operationId: listModelRuns
      x-terra-help: List model runs, newest first, from the last 30 days by default. Unknown models return an empty page.
      tags:
        - models
      summary: Model-run history
      description: A page of the environment's model runs (one per GET /v2/models/run), newest first, from the 30-day run log. user_id filters the stored Terra user UUID directly; an unknown model yields an empty page. status filters by run outcome; run_id matches an exact run within the selected window. Both browsing and run_id lookups default to the last 30 days; since, until and cursor still apply.
      security:
        - adminToken:
            - models:read
      parameters:
        - $ref: '#/components/parameters/DevId'
        - name: user_id
          x-terra-help: Terra user UUID stored on the run.
          in: query
          schema:
            type: string
            format: uuid
          description: Terra user id whose runs to return, matched against the id stored on the run itself.
        - name: model
          x-terra-help: Exact model name. Unknown names return an empty page.
          in: query
          schema:
            type: string
          description: One model name, matched exactly. An unrecognised name is an empty page rather than a 400, since this plane does not carry the model catalog.
        - name: status
          x-terra-help: 'Filter by run outcome: success or error.'
          in: query
          schema:
            type: string
            enum:
              - success
              - error
          description: Outcome of the run.
        - name: run_id
          x-terra-help: 'Exact run ID within the selected window (default: last 30 days).'
          in: query
          schema:
            type: string
          description: Exact run id within the selected window. Defaults to the last 30 days, as browsing does; since, until and cursor still apply.
        - name: since
          x-terra-help: 'Inclusive run submission start (RFC3339). Default: 30 days before --until.'
          in: query
          schema:
            type: string
            format: date-time
          description: Oldest submitted_at to return, inclusive, as RFC3339. Defaults to 30 days before until, which is the whole retained history.
        - name: until
          x-terra-help: 'Inclusive run submission end (RFC3339). Default: now.'
          in: query
          schema:
            type: string
            format: date-time
          description: Newest submitted_at to return, inclusive, as RFC3339. Defaults to now.
        - name: limit
          x-terra-help: 'Rows per page: default 50, clamped to 200. Use --paginate for multiple pages; --max-pages caps page count.'
          in: query
          schema:
            type: integer
            default: 50
            minimum: 1
          description: Rows per page. Defaults to 50; a larger value is clamped to 200 rather than refused.
        - name: cursor
          x-terra-help: Previous next_cursor. Its window overrides time bounds; supplied times must still be valid RFC3339.
          in: query
          schema:
            type: string
          description: The previous page's next_cursor. It carries the window the first page resolved, so since and until are ignored while it is set.
      responses:
        '200':
          description: A page of model runs (keyset cursor).
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ModelRunRecord'
                  has_more:
                    type: boolean
                  next_cursor:
                    type:
                      - string
                      - 'null'
                required:
                  - data
                  - has_more
                  - next_cursor
              example:
                data:
                  - run_id: 5f0b7d2e-9c1a-4e5b-8f3d-6a7b8c9d0e1f
                    user_id: 00000000-0000-0000-0000-000000000101
                    model: sleep-quality
                    status: success
                    latency_ms: 412
                    start_time: '2026-07-09T00:00:00Z'
                    end_time: '2026-07-16T00:00:00Z'
                    submitted_at: '2026-07-16T09:14:02.113Z'
                    output_truncated: false
                    output:
                      score: 82
                has_more: false
                next_cursor: null
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
