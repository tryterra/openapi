        - name: user_id
          in: query
          schema:
            type: string
            format: uuid
        - name: reference_id
          in: query
          schema:
            type: string
        - name: created_since
          in: query
          description: Lower bound (inclusive, RFC3339) on connection creation time. This surface windows on creation time rather than on the data's own timestamps. `since` is accepted as a synonym, and every occurrence of either spelling must carry the same value — a disagreeing value is a 400, whether it arrives under `since` or as a repeat of this parameter.
          schema:
            type: string
            format: date-time
        - name: since
          in: query
          description: Synonym for created_since, accepted so the shorter name a caller reaches for first is not rejected. Every occurrence of either spelling must carry the same value — a disagreeing value is a 400, whether it arrives under `created_since` or as a repeat of this parameter.
          schema:
            type: string
            format: date-time
        - name: created_until
          in: query
          description: Upper bound (inclusive, RFC3339) on connection creation time. `until` is accepted as a synonym, and every occurrence of either spelling must carry the same value — a disagreeing value is a 400, whether it arrives under `until` or as a repeat of this parameter.
          schema:
            type: string
            format: date-time
        - name: until
          in: query
          description: Synonym for created_until, accepted so the shorter name a caller reaches for first is not rejected. Every occurrence of either spelling must carry the same value — a disagreeing value is a 400, whether it arrives under `created_until` or as a repeat of this parameter.
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          schema:
            type: integer
        - name: cursor
          in: query
          schema:
            type: string
