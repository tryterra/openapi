        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      summary: Default payment method (masked)
      description: 'The default card only, and only the fields that are safe to show: brand, last4 and expiry. has_card is the field to branch on, since when it is false the account has no card on file and the rest are absent.'
      security:
        - adminToken:
            - billing:read
  /billing/usage:
    get:
      operationId: getUsage
      tags:
        - billing
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageResponse'
              example:
                meter_id: mtr_61RQw
                start: 1748736000
                end: 1751328000
                total_usage: 18234
                summaries:
                  - meter_id: mtr_61RQw
                    aggregated_value: 18234
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      summary: Metered usage totals
      description: All three of meter_id, start and end are required, so there is no default window, and the bounds are plain integers rather than the RFC3339 timestamps the rest of this API uses. The response repeats the window it measured, the total, and a per-meter breakdown.
      security:
        - adminToken:
            - billing:read
      parameters:
        - name: meter_id
          in: query
          required: true
          schema:
            type: string
        - name: start
          in: query
          required: true
          schema:
            type: integer
        - name: end
          in: query
          required: true
          schema:
            type: integer
  /billing/subscriptions/cancel-incomplete:
    post:
      operationId: cancelIncomplete
      tags:
        - billing
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingState'
              example:
                state: ok
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      summary: Cancel incomplete (failed-3DS) subscriptions
      description: 'Sweeps the account''s subscriptions that are still incomplete because a payment challenge was never finished. There is no request body, so nothing here names one subscription: the sweep covers all of them. The response is a billing state rather than a list of what was cancelled, so re-read the list endpoint to see what survived.'
      security:
        - adminToken:
            - billing:write
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
  /environments/{dev_id}:
    get:
      operationId: getEnvironment
      tags:
        - environments
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DevDetail'
              example:
                dev_id: prod-app-x81LmQ
                name: Production
                active: true
                billable: true
                profile:
                  dev_id: prod-app-x81LmQ
                  company_id: cus_9f3k2m
                  name: Production
                  billable: true
                  widget_config_url: null
                  widget_name: null
                  app_logo: null
                api_key_masked: '****k2Qw'
                signing_secret_masked: '****9xLm'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
      summary: Dev-id detail (masked secrets)
      description: Both credentials come back masked to their last few characters; the unmasked material is the keys:read-gated api-key endpoint under this path. `profile` is null for a dev-id with no profile row yet, which the POST on the environments collection creates.
      security:
        - adminToken:
            - account:read
      parameters:
        - $ref: '#/components/parameters/DevId'
    patch:
      operationId: patchEnvironmentProfile
      tags:
        - environments
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  profile:
                    $ref: '#/components/schemas/EnvironmentProfile'
                required:
                  - profile
              example:
                profile:
                  dev_id: prod-app-x81LmQ
                  company_id: cus_9f3k2m
                  name: Production (EU)
                  billable: true
                  widget_config_url: null
                  widget_name: null
                  app_logo: null
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      summary: Update the environment profile's display fields
      description: 'Display fields only, `name` and `billable`, at least one of them, with omitted fields left unchanged. The widget config and the data-type selection have their own endpoints, and `active` is deliberately not writable here: setting it would mean round-tripping the credential''s whole data-type set, which could lose a concurrent change.'
      security:
        - adminToken:
            - account:write
      parameters:
        - $ref: '#/components/parameters/DevId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchEnvironmentProfileRequest'
  /environments/{dev_id}/unified-api/widget/config:
