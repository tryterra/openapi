                - dataconfig:write
                - destinations:read
                - destinations:write
                - entitlements:read
                - events:read
                - events:write
                - keys:read
                - models:read
                - payloads:read
                - providers:read
                - providers:write
                - scores:read
                - scores:write
                - team:read
                - testdata:write
                - tokens:read
            - name: Read only
              summary: Auditing, onboarding a teammate, or a demo. Every read except credential material and payload bodies.
              scopes:
                - account:read
                - billing:read
                - connections:read
                - dataconfig:read
                - destinations:read
                - entitlements:read
                - events:read
                - models:read
                - providers:read
                - scores:read
                - team:read
                - tokens:read
            - name: Full access
              summary: Every admin-grantable scope, dangerous ones included.
              scopes:
                - account:read
                - account:write
                - billing:read
                - billing:write
                - connections:read
                - dataconfig:read
                - dataconfig:write
                - destinations:read
                - destinations:write
                - entitlements:read
                - events:read
                - events:write
                - keys:read
                - keys:write
                - models:read
                - payloads:read
                - providers:read
                - providers:write
                - scores:read
                - scores:write
                - team:read
                - team:write
                - testdata:write
                - tokens:admin
                - tokens:read
                - tokens:write
          x-not-a-real-flow: Scope registry only. Token issuance is the device flow or the authorizationCode flow (see scheme description); this tokenUrl does not accept client_credentials grants.
        authorizationCode:
          authorizationUrl: /api/v3/admin/auth/authorize
          tokenUrl: /api/v3/admin/auth/token
          scopes:
            account:read: See your account details and environment IDs.
            keys:read: See your API key, the secret values of your data access tokens and the credentials your destinations use.
