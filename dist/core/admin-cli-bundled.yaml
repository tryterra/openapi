        - $ref: '#/components/parameters/DevId'
        - name: provider
          x-terra-help: Provider slug, e.g. garmin. Unknown providers return 400.
          in: path
          required: true
          schema:
            type: string
          description: The provider this applies to, as a slug, e.g. garmin. An unrecognised provider is a 400.
    put:
      operationId: setSourceCredentials
      x-terra-help: Set custom provider OAuth credentials. Repeated calls are safe; the secret is write-only and masked on read.
      tags:
        - sources
      summary: Set custom provider OAuth credentials
      description: Set the customer's own OAuth credentials (client_id/secret, optional redirect URL, verification secret, sandbox) so auth runs against their app. Idempotent; the secret is write-only and masked on read.
      security:
        - adminToken:
            - providers:write
      parameters:
        - $ref: '#/components/parameters/DevId'
        - name: provider
          x-terra-help: Provider slug, e.g. garmin. Unknown providers return 400.
          in: path
          required: true
          schema:
            type: string
          description: The provider this applies to, as a slug, e.g. garmin. An unrecognised provider is a 400.
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProviderCredentialWrite'
      responses:
        '200':
          description: The stored credential (secret masked).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderCredentials'
              example:
                provider: garmin
                has_credentials: true
                terra_owned: false
                credential:
