      summary: Update the environment profile's display fields
      description: 'Display fields only, `name` and `billable`, at least one of them, with omitted fields left unchanged. The widget config and the data-type selection have their own endpoints, and `active` is deliberately not writable here: setting it would mean round-tripping the credential''s whole data-type set, which could lose a concurrent change.'
