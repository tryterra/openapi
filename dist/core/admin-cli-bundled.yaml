          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      summary: Get the dev-id's widget config
      description: 'Branding and configuration for the connect widget. Exactly one of widget_config_url and widget_config is served, depending on the deployment: the URL is an S3 indirection on legacy deployments and the document is inlined on newer ones, so read whichever is non-null rather than assuming either.'
