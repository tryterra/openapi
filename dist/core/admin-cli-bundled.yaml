      summary: Current metered usage by subscription item
      description: Includes active, trialing, past_due and unpaid subscriptions, including collection-paused items. Native subscription periods remain separate from the enclosing minute-aligned measurement windows required by Stripe. minute_envelope amounts are estimates for that measurement window, never exact billed-period quantities or invoice charges. UTC daily edge buckets can extend beyond the period. Rows preserve currencies and independent periods; no account-wide total is computed. Pricing decimals are exact strings in currency minor units; unavailable pricing is null. Meter data is eventually consistent.
