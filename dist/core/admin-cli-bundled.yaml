          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
      summary: Full credential material (audited)
      description: Discloses the environment's client_secret and its webhook signing secret in plaintext, which is why it sits behind keys:read rather than account:read and is audited. Everywhere else in this API masks them. For new work prefer per-environment data tokens, which can be minted and revoked independently instead of being shared.
