                      url: https://example.com/terra
                      active: true
                      event_types: []
                      configured: true
                      missing: []
                      config:
                        url: https://example.com/terra
                        delivery: push
                      will_return_signing_secret: true
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchCreatedDestinations'
              example:
                data:
                  - id: '1937255512398764032'
                    type: webhook
                    url: https://api.acme.com/terra/webhook
                    active: true
                    event_types: []
                    configured: true
                    missing: []
                    config:
                      url: https://api.acme.com/terra/webhook
                      delivery: push
                    signing_secret: a4f8…shown-once…c917
                  - id: '1937255512398764033'
                    type: s3
                    url: ''
                    active: false
                    event_types: []
                    configured: false
                    missing:
                      - config.bucket
                      - config.region
                      - config.access_key_id
                      - config.secret_access_key
                    config:
                      bucket: null
                      region: null
                      access_key_id: null
                      secret_access_key_masked: null
                    signing_secret: null
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
      summary: Create several destinations
      description: 'Creates up to 100 destinations in one transaction, so either every destination is created or none is. Each item takes the same fields as a single create and is validated the same way, before anything is written; every invalid item is reported in one 400 whose errors are prefixed with its position, e.g. items[2].config.url. The deprecated url and metadata fields are not accepted. The response lists the destinations in request order, and for a webhook its item is the only place its signing_secret appears, so store it now, or pass signing_secret_source: environment on that item. Through the MCP, a batch whose result would not fit in one tool result is a 400 asking for smaller batches, so no signing secret is ever lost to a truncated result.'
      security:
        - adminToken:
