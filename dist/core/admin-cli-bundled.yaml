              example:
                provisioned: true
                project_ref: abcdefghijklmnop
                project_created: true
                destination_id: '1937255512398764033'
                database_password: q8Zr…32-chars…Kx1v
                replaced_destination_id: '1937255512398760001'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          description: The project_ref names a project that is paused, or that failed or was removed, so it cannot be provisioned into until it is restored or repaired in Supabase (code unsupported_operation, with the project's status in the remediation). Retrying unchanged returns the same error.
          content:
