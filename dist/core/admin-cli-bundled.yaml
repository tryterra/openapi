        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
      summary: Delete a destination
      description: Removal is permanent and takes the destination's signing secret with it, so recreating the same URL produces a new destination with a new secret that receivers have to be told about. Its delivery-failure tracking is reset. Pass ?dry_run=true first for a preview of what would go.
