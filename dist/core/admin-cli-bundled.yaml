        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      summary: Replace the dev-id's widget config (full replace)
      description: 'A whole-document replace, not a merge: any field left out of the body is cleared, so read the current config first and send it back with the edit applied. Send whichever of widget_config_url and widget_config this deployment serves; the other is not accepted.'
      security:
        - adminToken:
