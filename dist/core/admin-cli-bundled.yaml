    sessionToken:
      type: http
      scheme: bearer
      bearerFormat: terra_st_...
      description: 'A dashboard session token, minted per login. Routes that record who a person is talking to accept ONLY this kind — a device-flow admin token carrying the same scopes is rejected. Scopes are enforced per operation and named in each description: an HTTP bearer scheme cannot carry an OAuth2 scope list, so the security requirement is necessarily empty.'
  parameters:
    SyntheticUserId:
      name: user_id
      x-terra-help: Synthetic user ID from the synthetic-users list.
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: The synthetic user to act on, by the id its creation returned.
    DevId:
      name: dev_id
      x-terra-help: Environment developer ID, selected with --env.
      in: path
      required: true
      schema:
        type: string
      description: The developer-id (the only tenant-targeting input).
    IdempotencyKey:
      name: Idempotency-Key
      x-terra-help: Reuse this key when retrying; a call without one is a new operation.
      in: header
      required: false
      schema:
        type: string
      description: 'Stripe-style idempotency: same key + same body replays the stored response; same key + different body → 409. Mutations only.'
    DryRun:
      name: dry_run
      x-terra-help: Preview the change without committing it.
      in: query
      required: false
      schema:
        type: boolean
      description: When true the operation commits nothing and answers 200 with a DryRunResult — {dry_run, would, preview} — whatever its live success code is. Operations whose live success is also 200 publish both the live response and DryRunResult in the response schema.
    PayloadSamples:
      name: samples
      x-terra-help: Set to false to leave out the time-series sample arrays, which keeps the payload small.
      in: query
      required: false
      schema:
        type: boolean
        default: true
      description: When false, arrays named samples or ending in _samples are removed from the returned payload, which keeps it small enough to read. It changes only this response; the stored payload keeps its samples.
  responses:
    Unauthorized:
      description: Missing/invalid/expired admin token.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: unauthorized
            detail: unknown access token
            instance: /api/v3/admin/environments/prod-app-x81LmQ/unified-api/sources/garmin
            code: unauthorized
            remediation: Obtain a new one via the device flow or your dashboard.
    Forbidden:
      description: The token is missing the required scope.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: forbidden
            detail: 'token is missing the required scope: providers:write'
            instance: /api/v3/admin/environments/prod-app-x81LmQ/unified-api/sources/garmin
            code: scope_missing
            remediation: Request a new token that includes providers:write (device flow or dashboard) and approve the additional scope.
    NotFound:
      description: Resource not found (or not owned — no existence oracle).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: not found
            detail: dev-id not found
            instance: /api/v3/admin/environments/prod-app-x81LmQ/unified-api/sources/garmin
            code: dev_id_not_found
            remediation: Confirm the dev-id via `GET /environments`.
    ValidationError:
      description: Request validation failed (see errors[]).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: bad request
            detail: approved scope was not requested
            instance: /api/v3/admin/environments/prod-app-x81LmQ/unified-api/sources/garmin
            code: validation_failed
            errors:
              - 'scopes: at least one required'
    RateLimited:
      description: Per-token rate limit exceeded; see Retry-After.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: too many requests
            detail: per-token rate limit exceeded
            instance: /api/v3/admin/environments/prod-app-x81LmQ/unified-api/sources/garmin
            code: rate_limited
            remediation: Back off and retry after the Retry-After interval.
