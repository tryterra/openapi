      tags:
        - sources
      summary: Update custom sign-in settings for a wearable or app
      description: Changes the fields sent and keeps every other stored value, so the client secret can stay unsent. Send at least one field. An empty client_secret or verification_secret is a 400; omit it to keep the stored value. redirect_url null resets the redirect to the provider default, and verification_secret null clears it. The merged credential passes every check the PUT on this path runs, including, for Garmin, a check against Garmin with the stored secret; the redirect host check runs when redirect_url is sent. secret_ref moves the secret to a secret store and client_secret moves it back, with or without secret_ref null; a credential read from a store keeps reading it there when neither is sent. When the merged credential equals the stored one, nothing is written. A provider without your own credentials is a 404; set them with the PUT first. The response is the masked credential as the GET returns it.
