      x-terra-help: Revoke an unclaimed invitation. Missing, claimed and other-company invitations return 404.
      tags:
        - team
      summary: Revoke an invitation
      description: 'Withdraws an unclaimed invitation. Tenancy is structural — the delete carries the caller''s own company — so an id belonging to another company matches nothing and answers 404 rather than confirming it exists. A claimed invitation is also a 404: that person is already a member, and removing them is DELETE /team/members/{user_id}.'
