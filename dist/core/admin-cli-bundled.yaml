        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
      summary: List end-user connections
      description: A page of the environment's end-user connections, newest first (created-time desc), with keyset cursor pagination. Filter by provider, active, user_id, reference_id and a created_since/created_until window.
      security:
        - adminToken:
            - connections:read
      parameters:
        - $ref: '#/components/parameters/DevId'
        - name: provider
