        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      summary: Upcoming (preview) invoice
      description: 'A preview of the invoice the open period would produce, not an issued one: its id is the literal `upcoming` and created_at is null. The list endpoint covers invoices that have actually been issued.'
      security:
        - adminToken:
            - billing:read
  /billing/payment-method:
    get:
      operationId: getPaymentMethod
      x-terra-help: Get the default card with masked details. When has_card is false, card details are absent.
      tags:
        - billing
