  /environments/{dev_id}/unified-api/scores/history:
    get:
      operationId: listScoresHistory
      x-terra-help: List computed scores, newest first. Defaults to the last 7 days; user_id is null when a provider user is unmapped.
      tags:
        - scores
      summary: Score history
      description: A page of the environment's computed scores, newest first, from ClickHouse. Filter by score (type), user_id (the Terra user_id, resolved to its provider-side id via the connection service), provider_user_id (the stored provider-side id, matched directly), and the since/until window. Each row is annotated with the user_id its provider_user_id maps to (null if unmapped). Keyset cursor pagination.
      security:
        - adminToken:
            - scores:read
      parameters:
        - $ref: '#/components/parameters/DevId'
        - name: score
          x-terra-help: Score name, alias, enum name or numeric enum value. Unknown scores return 400.
          in: query
          schema:
            type: string
          description: 'One score, named however you have it: the score name, an alias, the enum name, or the numeric enum value. An unrecognised score is a 400.'
        - name: user_id
          x-terra-help: Terra user UUID, resolved to provider IDs. No connection returns an empty page; intersects with --provider-user-id.
          in: query
          schema:
            type: string
            format: uuid
          description: Terra user id, resolved to that user's provider_user_id(s) before the history is read, since the stored rows carry only the provider's id. A user with no connection is an empty page, so a paging caller can tell "no rows" from a broken request. Intersects with provider_user_id when both are sent.
        - name: provider_user_id
          x-terra-help: Exact provider-side user ID. Intersects with --user-id when both are set.
          in: query
          schema:
            type: string
          description: The provider's own id for a user, matched exactly as stored. No resolution, so this is the filter to reach for when the Terra user id is not to hand.
        - name: since
          x-terra-help: 'Inclusive score computation start (RFC3339). Default: 7 days before --until.'
          in: query
          schema:
            type: string
            format: date-time
          description: Oldest insert_timestamp to return, inclusive, as RFC3339. Windows on when the score was computed, not on the period it covers. Defaults to 7 days before until.
        - name: until
          x-terra-help: 'Inclusive score computation end (RFC3339). Default: now.'
          in: query
          schema:
            type: string
            format: date-time
          description: Newest insert_timestamp to return, inclusive, as RFC3339. Defaults to now.
        - name: limit
          x-terra-help: 'Rows per page: default 50, clamped to 200. Use --paginate for multiple pages; --max-pages caps page count.'
          in: query
          schema:
            type: integer
            default: 50
            minimum: 1
          description: Rows per page. Defaults to 50; a larger value is clamped to 200 rather than refused.
        - name: cursor
          x-terra-help: Previous next_cursor. Its window overrides time bounds; supplied times must still be valid RFC3339.
          in: query
          schema:
            type: string
          description: The previous page's next_cursor. It carries the window the first page resolved, so since and until are ignored while it is set.
      responses:
        '200':
          description: A page of score records (keyset cursor).
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ScoreHistoryRecord'
                  has_more:
                    type: boolean
                  next_cursor:
                    type:
                      - string
                      - 'null'
                required:
                  - data
                  - has_more
                  - next_cursor
              example:
                data:
                  - provider_user_id: a1b2c3d4
                    user_id: 8f14e45f-ceea-467d-9f6a-3b1c2d4e5f6a
                    provider: garmin
                    score: sleep
                    value: 82
                    dimensions:
                      - 80
                      - 75
                      - 90
                      - -1
                      - -1
                      - -1
                      - -1
                      - -1
                    start_time: '2026-07-15T22:00:00Z'
                    end_time: '2026-07-16T07:00:00Z'
                    inserted_at: '2026-07-16T08:14:02.113Z'
                has_more: false
                next_cursor: null
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
