        '429':
          $ref: '#/components/responses/RateLimited'
      summary: List destinations
      description: 'Rows carry no credential material: a destination''s signing secret is returned only in the create response, and the metadata an advanced destination type was configured with is not read back. Cursor-paginated, and inactive destinations are listed too, with active: false.'
      security:
        - adminToken:
            - destinations:read
      parameters:
        - $ref: '#/components/parameters/DevId'
    post:
      operationId: createDestination
      x-terra-help: Create a destination. Save the signing_secret now; it is returned only once. Type defaults to webhook.
      tags:
        - destinations
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedDestination'
              example:
                id: '1937255512398764032'
                type: webhook
                url: https://api.acme.com/terra/webhook
                active: true
                event_types:
                  - activity
                  - sleep
                signing_secret: a4f8…shown-once…c917
