        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      summary: List Supabase projects
      description: 'Reads the projects visible to the OAuth session, so it works only once that session has reached the ready state: poll it first, or expect a 409. Rows are passed through as the objects Supabase returns rather than a fixed Terra shape, and `meta` names the organization they belong to. Pick a project_ref from here to pass to the provision call.'
      security:
        - adminToken:
            - destinations:write
      parameters:
        - $ref: '#/components/parameters/DevId'
        - name: oauth_session_id
          in: path
          required: true
