        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      summary: Provision the Supabase destination
      description: 'Long-running: provisioning a Supabase project can take minutes, so allow a generous timeout rather than reading a slow response as a hang. It needs a ready oauth_session_id and a project_ref from the projects list, and it creates a data destination as a side effect: the destination_id it returns is managed through the ordinary destinations endpoints from then on.'
      security:
        - adminToken:
            - destinations:write
