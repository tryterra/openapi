        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
      summary: Enable a provider (idempotent)
      description: 'Enabling only turns the provider on: it configures no credentials and no scopes, so until custom credentials are set the environment authorizes end users against Terra''s own OAuth app, which is what terra_owned reports on the credentials read. A repeat call is not an error and answers with the same provider and active pair.'
      security:
        - adminToken:
            - providers:write
      parameters:
        - $ref: '#/components/parameters/DevId'
        - name: provider
