openapi: 3.2.0
info:
  title: Real Time Streaming API
  version: 2026.11.11.1
  license:
    name: Apache-2.0
    url: https://github.com/tryterra/openapi/blob/master/LICENSE
  description: |-
    Mints the tokens that open the Terra real-time streaming WebSocket. Call an operation below with your developer credentials, then open the socket and present the token in the IDENTIFY frame.

    - `POST /auth/user` mints a **producer** token for one user, to push live samples: single-use and short-lived, or reusable until it expires or `POST /auth/user/revoke` revokes it.
    - `POST /auth/developer` mints a **consumer** token, to receive the live dispatch stream for all of your users.
    - The socket protocol (the `/connect` socket, its frame opcodes, handshake, heartbeats and close codes) is in the AsyncAPI document `rt.asyncapi.yaml`, since OpenAPI cannot express a bidirectional socket protocol.
    - A refused credential is an `application/problem+json` Problem whose `code` says why: `unauthorized` (401), `scope_missing` or `audience_restricted` (403), or `authorization_unavailable` (503) when the credential could not be checked.
    - When the credential cannot be checked before the request is handled, the earlier `application/json` `{"message": ...}` answers still occur: 400 for missing or malformed authentication headers, 403 for invalid credentials and 503 when validation failed. Branch on the status code first.
servers:
  - url: https://ws.tryterra.co
security:
  - ApiKeyAuth: []
    DevID: []
  - BasicAuth: []
tags:
  - name: Authentication
    summary: Authentication
    description: Mint the tokens that open the real-time streaming socket, as a producer for one user or as a consumer for all of them, and revoke reusable producer tokens.
    x-displayName: Authentication
paths:
  /auth/developer:
    post:
      summary: Stream - Generate developer token
      description: Returns a single-use token that opens a consumer connection, which receives the live stream for all of your users.
      operationId: generate-developer-token
      tags:
        - Authentication
      responses:
        '200':
          description: Token generated.
          content:
            application/json:
              schema:
                type: object
                required:
                  - token
                properties:
                  token:
                    type: string
                    description: Single-use token to present in the IDENTIFY frame.
                    example: cG9RvLY5.yvKm778XMIPm1ig93BJEoRCVGHzlrBNjzWdeXePTaMM
        '400':
          description: Missing or malformed authentication headers.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The credential lacks the scope this operation requires (code `scope_missing`) or is not granted for this dev-id (`audience_restricted`); or, as a message, invalid, inactive or not enabled for streaming.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '500':
          description: Token generation failed.
        '503':
          $ref: '#/components/responses/AuthorizationUnavailable'
  /auth/user:
    post:
      summary: Stream - Generate user token
      description: |-
        Returns a token that opens a producer connection for one user, to push that user's live samples.

        - By default the token is single-use and short-lived.
        - With `reusable=true` the same token opens a connection on every reconnect until it expires or is revoked with `POST /auth/user/revoke`, and the response adds `expires_in`.
      operationId: generate-user-token
      tags:
        - Authentication
      parameters:
        - name: id
          in: query
          description: 'The user the token is for: their Terra user ID (a UUID, returned when they connect), their `connection_id`, or a streaming test user''s `t_` ID from the dashboard''s "generate test data" tool. A user who is not connected under your developer ID, or a test user that has expired, gets `403`.'
          required: true
          schema:
            type: string
        - name: reusable
          in: query
          description: Set to `true` for a reusable token instead of a single-use one. Defaults to `false`. A test user (`t_` ID) cannot have a reusable token and gets `400`.
          required: false
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Token generated.
          content:
            application/json:
              schema:
                type: object
                required:
                  - token
                properties:
                  token:
                    type: string
                    description: Token to present in the IDENTIFY frame. A reusable token starts with `rt.`.
                    example: OTYwNWFi5ZWQMTAxMjg0Y2Qw.gzrPzZcS3Gy8QDOxbiPRwu30PTB3VxW0eE
                  expires_in:
                    type: integer
                    description: Seconds until the reusable token expires, never later than the credential that minted it. Present only with `reusable=true`.
                    example: 28800
        '400':
          description: Missing `id` parameter, `reusable=true` for a test user, or missing/malformed authentication headers.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The credential lacks the scope this operation requires (code `scope_missing`) or is not granted for this dev-id (`audience_restricted`); or, as a message, invalid, inactive or not enabled for streaming, or the user does not belong to this developer.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '500':
          description: Token generation failed.
        '503':
          $ref: '#/components/responses/AuthorizationUnavailable'
  /auth/user/revoke:
    post:
      summary: Stream - Revoke reusable user tokens
      description: |-
        Revokes one reusable producer token, or every reusable token minted for one user, and returns how many it revoked.

        - A revoked token is refused at IDENTIFY from then on (close `4001`).
        - Single-use tokens are not affected. An unknown or already revoked token returns `revoked: 0`, not an error.
        - Valid credentials can revoke even when Streaming is not enabled for the account.
      operationId: revoke-user-tokens
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Exactly one of `token` or `user_id`.
              properties:
                token:
                  type: string
                  description: The reusable token to revoke, as `POST /auth/user` returned it.
                  example: rt.OTYwNWFi5ZWQMTAxMjg0Y2Qw.gzrPzZcS3Gy8QDOxbiPRwu30PTB3VxW0eE
                user_id:
                  type: string
                  description: Revokes every reusable token minted for this user. Pass the same `id` the tokens were minted with.
      responses:
        '200':
          description: Tokens revoked.
          content:
            application/json:
              schema:
                type: object
                required:
                  - revoked
                properties:
                  revoked:
                    type: integer
                    description: The number of tokens revoked; `0` when none matched.
                    example: 1
        '400':
          description: Neither or both of `token` and `user_id`, a malformed body, or missing/malformed authentication headers.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The credential lacks the scope this operation requires (code `scope_missing`) or is not granted for this dev-id (`audience_restricted`); or, as a message, invalid credentials.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '500':
          description: Revocation failed.
        '503':
          $ref: '#/components/responses/AuthorizationUnavailable'
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
      description: Your API key for authentication
    DevID:
      type: apiKey
      in: header
      name: dev-id
      description: Your developer ID for authentication and tracking
    BasicAuth:
      type: http
      scheme: basic
      description: |
        HTTP Basic credentials carrying your developer ID as the username and API
        key as the password (`Authorization: Basic base64(dev-id:api-key)`). An
        alternative to the dev-id / x-api-key header pair on the streaming token
        endpoints.
  schemas:
    Problem:
      type: object
      description: |
        An error response, following RFC 9457 (Problem Details for HTTP APIs, which obsoletes RFC 7807). Returned with `Content-Type: application/problem+json` on every 4xx/5xx response. The HTTP status line carries the status code; it is intentionally not repeated in the body. `type`, `title` and `instance` are always present; `detail` is included when a specific explanation is available.
      properties:
        type:
          type: string
          description: A URI reference identifying the problem type. Defaults to `about:blank`.
          example: about:blank
        title:
          type: string
          description: A short, human-readable summary of the problem type (the lowercased HTTP status text).
          example: unauthorized
        instance:
          type: string
          description: The request path, including any query string, that produced this problem.
          example: /api/v2/activity?user_id=d4aba475-f714-4663-88fe-28f18b8599b0&to_webhook=false
        code:
          type: string
          description: 'Stable error classification: branch on this, not on `detail`. A refused credential returns unauthorized (401: missing, invalid, expired or revoked), scope_missing (403: the credential lacks the scope the operation requires) or audience_restricted (403: the credential is not granted for this dev-id). authorization_unavailable (503) means the credential or the product access could not be checked; retry later. Product gates return entitlement_required (403) or environment_disabled (403). service_unavailable (503) means the request never reached the service; dependency_failed (502 or 504) means the service did not complete it, though it may already have acted on it. Report uploads return validation_failed, unsupported_file_type or too_many_files (400), and payload_too_large (413).'
        product:
          type: string
          description: The product checked by the authorization gate, when classified.
        detail:
          type: string
          description: A human-readable explanation specific to this occurrence of the problem.
          example: dev-id or x-api-key headers are missing
      required:
        - type
        - title
        - instance
    Message:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          example: invalid credentials
    UnauthorizedProblem:
      type: object
      description: A refused credential, always with its code.
      properties:
        type:
          type: string
          description: A URI reference identifying the problem type. Defaults to `about:blank`.
          example: about:blank
        title:
          type: string
          description: A short, human-readable summary of the problem type (the lowercased HTTP status text).
          example: unauthorized
        instance:
          type: string
          description: The request path, including any query string, that produced this problem.
          example: /api/v2/activity?user_id=d4aba475-f714-4663-88fe-28f18b8599b0&to_webhook=false
        code:
          type: string
          description: 'Stable error classification: branch on this, not on `detail`. A refused credential returns unauthorized (401: missing, invalid, expired or revoked), scope_missing (403: the credential lacks the scope the operation requires) or audience_restricted (403: the credential is not granted for this dev-id). authorization_unavailable (503) means the credential or the product access could not be checked; retry later. Product gates return entitlement_required (403) or environment_disabled (403). service_unavailable (503) means the request never reached the service; dependency_failed (502 or 504) means the service did not complete it, though it may already have acted on it. Report uploads return validation_failed, unsupported_file_type or too_many_files (400), and payload_too_large (413).'
        product:
          type: string
          description: The product checked by the authorization gate, when classified.
        detail:
          type: string
          description: A human-readable explanation specific to this occurrence of the problem.
          example: dev-id or x-api-key headers are missing
      required:
        - type
        - title
        - instance
        - code
  responses:
    Unauthorized:
      description: The credential is missing, invalid, expired or revoked (code `unauthorized`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/UnauthorizedProblem'
          example:
            type: about:blank
            title: unauthorized
            instance: /activity
            detail: dev-id or x-api-key headers are missing
            code: unauthorized
    AuthorizationUnavailable:
      description: Authorization is temporarily unavailable (code `authorization_unavailable`), or credential validation failed (a message). Retry later.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
        application/json:
          schema:
            $ref: '#/components/schemas/Message'
