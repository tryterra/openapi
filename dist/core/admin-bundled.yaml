      summary: Re-show a token's bearer
      description: 'Returns the token including its bearer. Deliberate API-key DX parity: the credential tokens succeed has always been retrievable, so tokens are too. Gated by keys:read (dangerous plaintext disclosure, same class as GET /api-key) and audited. Admin tokens are never retrievable (422).'
