            application/json:
              schema:
                $ref: '#/components/schemas/RotatedApiKey'
              example:
                dev_id: prod-app-x81LmQ
                api_key: 6f8c…new-secret…2a1b
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
      summary: Rotate the legacy client_secret
      security:
        - adminToken:
            - account:write
            - keys:read
      parameters:
        - $ref: '#/components/parameters/DevId'
        - $ref: '#/components/parameters/IdempotencyKey'
      description: Mints a new client_secret for this environment and returns it once. Requires BOTH account:write (it mutates credential config) and keys:read (it discloses plaintext). Prefer coexisting data tokens — mint new, revoke old — which need no atomic swap; this exists for the dashboard settings page's legacy key. The rotated-away secret stops working immediately.
components:
  securitySchemes:
    adminToken:
      type: oauth2
      description: Terra access token (customer-scoped, kind=admin, `terra_at_*`). The ONLY grant is the RFC 8628 device-authorization flow (POST /auth/device, approve in the dashboard, poll POST /auth/token) or a dashboard mint — there is NO client_credentials token endpoint; the clientCredentials flow object below exists solely because OAS 3.1 has no first-class device-flow representation and this is where scopes are machine-readable (see x-grant-type). This surface accepts ONLY admin tokens; data tokens (kind=data, `terra_dt_*`, minted at POST /environments/{dev_id}/tokens) authenticate the data API only — the planes never cross. Each operation names its required scope; admin tokens may also carry an environment audience. The scopes map below is the whole closed vocabulary — BOTH planes. POST /auth/device grants only the admin-plane names and rejects the rest with 400 invalid_scope, so check the plane before choosing a set — x-scope-planes is the machine-readable answer, and each description opens with `Data plane:` or `Both planes:` when the name is not admin-only.
      flows:
        clientCredentials:
          tokenUrl: /api/v3/admin/auth/token
          scopes:
            account:read: Read account and dev-id metadata.
            keys:read: 'Both planes: read credential secret material — the legacy static API key (GET /api-key), a token''s bearer (GET /tokens/{id}/secret), or the data plane''s GET /v2/dashboard/developer. Dangerous: plaintext disclosure.'
            keys:write: 'Reserved for legacy static-key mutations. No admin-surface route uses it today; the dashboard rotate flow retains it. Dangerous: rotates the account''s legacy credential.'
            providers:read: 'Both planes: read provider enablement, masked OAuth credentials, and custom scopes.'
            providers:write: 'Both planes: enable/disable providers and set custom OAuth credentials and scopes.'
            destinations:read: Read webhook and Supabase destinations.
            destinations:write: Create, update, and delete destinations, and run Supabase provisioning.
            events:read: Read delivery-history event metadata.
            events:write: 'Both planes: re-dispatch (resend) a delivered event.'
            connections:read: 'Both planes: list a dev-id''s end-user connections.'
            payloads:read: Read stored delivered payload bodies (contains end-user health data).
            dataconfig:read: Read per-data-type field selection.
            dataconfig:write: Update per-data-type field selection.
            scores:read: Read the score catalog and configuration.
            scores:write: Activate and configure scores.
            models:read: 'Both planes: read the model catalog (data plane) and per-environment model-run history (admin plane).'
            models:run: 'Data plane: run a model over a user''s stored data.'
            workouts:read: 'Data plane: read workout templates and planned workouts.'
            workouts:write: 'Data plane: create workout templates and plan workouts for users.'
            labreports:read: 'Data plane: read lab reports.'
            labreports:write: 'Data plane: reprocess or delete lab reports.'
            testdata:write: 'Data plane: generate synthetic test data.'
            billing:read: 'Read billing: subscriptions, invoices, payment method, usage.'
            billing:write: 'Manage subscriptions (subscribe, cancel-incomplete). Dangerous: spends money.'
            tokens:admin: 'List and revoke any admin token in the account. Dangerous: can revoke every other credential the account holds.'
            entitlements:read: Read company feature entitlements.
            auth:write: 'Data plane: create user authentication flows — widget sessions, auth tokens (in place of a client_secret).'
            connections:write: 'Data plane: deauthenticate users and update connection attributes.'
            data:read: 'Data plane: read stored end-user health data (activity, sleep, body, …).'
            data:write: 'Data plane: push or delete end-user health data.'
            routes:read: 'Data plane: read routes and pushed routes.'
            routes:write: 'Data plane: create, update, push, and delete routes.'
            datalinks:read: 'Data plane: read data links.'
            datalinks:write: 'Data plane: create and delete data links.'
            graphs:read: 'Data plane: read graph sessions.'
            graphs:write: 'Data plane: create and manage graph sessions (public renders of health data).'
            agents:read: 'Data plane: read agents, bundles, jobs, and schedules.'
            agents:write: 'Data plane: create, update, and delete agents and their configuration.'
            agents:run: 'Data plane: execute agents and bundles (incurs model spend).'
            ai:run: 'Data plane: run AI-context queries and the MCP proxy.'
            tokens:read: List token metadata for an environment (never re-shows a bearer).
            tokens:write: 'Mint and revoke tokens for an environment — credential issuance. Dangerous: transitively as broad as everything issuable.'
            account:write: Update account/company profile, onboarding, terms and referral data.
            team:read: Read the company's team member roster.
            team:write: 'Update or remove a team member (name, phone, role; detach from the company). Dangerous: can revoke another human''s access.'
          x-scope-planes:
            account:read: admin
            keys:read: both
            keys:write: admin
            providers:read: both
            providers:write: both
            destinations:read: admin
            destinations:write: admin
            events:read: admin
            events:write: both
            connections:read: both
            payloads:read: admin
            dataconfig:read: admin
            dataconfig:write: admin
            scores:read: admin
            scores:write: admin
            models:read: both
            models:run: data
            workouts:read: data
            workouts:write: data
            labreports:read: data
            labreports:write: data
            testdata:write: data
            billing:read: admin
            billing:write: admin
            tokens:admin: admin
            entitlements:read: admin
            auth:write: data
            connections:write: data
            data:read: data
            data:write: data
            routes:read: data
            routes:write: data
            datalinks:read: data
            datalinks:write: data
            graphs:read: data
            graphs:write: data
            agents:read: data
            agents:write: data
            agents:run: data
            ai:run: data
            tokens:read: admin
            tokens:write: admin
            account:write: admin
            team:read: admin
            team:write: admin
          x-scope-dangerous:
            - billing:write
            - keys:read
            - keys:write
            - team:write
            - tokens:admin
            - tokens:write
          x-not-a-real-flow: Scope registry only. Token issuance is the device flow (see scheme description); this tokenUrl does not accept client_credentials grants.
      x-grant-type: urn:ietf:params:oauth:grant-type:device_code
    sessionToken:
      type: http
      scheme: bearer
      bearerFormat: terra_st_...
      description: 'A dashboard session token, minted per login. Routes that record who a person is talking to accept ONLY this kind — a device-flow admin token carrying the same scopes is rejected. Scopes are enforced per operation and named in each description: an HTTP bearer scheme cannot carry an OAuth2 scope list, so the security requirement is necessarily empty.'
  parameters:
    DevId:
      name: dev_id
      in: path
      required: true
      schema:
        type: string
      description: The developer-id (the only tenant-targeting input).
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
      description: 'Stripe-style idempotency: same key + same body replays the stored response; same key + different body → 409. Mutations only.'
    DryRun:
      name: dry_run
      in: query
      required: false
      schema:
        type: boolean
      description: When true, returns a DryRunResult preview without committing.
  responses:
    Unauthorized:
      description: Missing/invalid/expired admin token.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: unauthorized
            detail: unknown access token
            instance: /api/v3/admin/environments/prod-app-x81LmQ/unified-api/sources/garmin
            code: unauthorized
            remediation: Obtain a new one via the device flow or your dashboard.
    Forbidden:
      description: The token is missing the required scope.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: forbidden
            detail: 'token is missing the required scope: providers:write'
            instance: /api/v3/admin/environments/prod-app-x81LmQ/unified-api/sources/garmin
            code: scope_missing
            remediation: Request a new token that includes providers:write (device flow or dashboard) and approve the additional scope.
    NotFound:
      description: Resource not found (or not owned — no existence oracle).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: not found
            detail: dev-id not found
            instance: /api/v3/admin/environments/prod-app-x81LmQ/unified-api/sources/garmin
            code: dev_id_not_found
            remediation: Confirm the dev-id via `GET /environments`.
    ValidationError:
      description: Request validation failed (see errors[]).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: bad request
            detail: approved scope was not requested
            instance: /api/v3/admin/environments/prod-app-x81LmQ/unified-api/sources/garmin
            code: validation_failed
            errors:
              - 'scopes: at least one required'
    RateLimited:
      description: Per-token rate limit exceeded; see Retry-After.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: too many requests
            detail: per-token rate limit exceeded
            instance: /api/v3/admin/environments/prod-app-x81LmQ/unified-api/sources/garmin
            code: rate_limited
            remediation: Back off and retry after the Retry-After interval.
    Conflict:
      description: Idempotency-Key reuse with a different body, or a precondition conflict.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: conflict
            detail: the account has reached its active-token limit
            instance: /api/v3/admin/environments/prod-app-x81LmQ/unified-api/sources/garmin
            code: token_limit_reached
            remediation: Revoke unused tokens, then retry.
    ServiceUnavailable:
      description: A required subsystem is not available on this deployment.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: service unavailable
            detail: billing is not available on this deployment
            instance: /api/v3/admin/environments/prod-app-x81LmQ/unified-api/sources/garmin
            code: service_unavailable
    InternalError:
      description: Unexpected server-side failure while processing the request.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: internal server error
            detail: an internal error occurred
            instance: /api/v3/admin/company
            code: internal_error
    UnprocessableEntity:
      description: The request is well-formed but the target resource can't perform it (e.g. provider disallows custom credentials).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: unprocessable entity
            detail: this provider does not support custom credentials
            instance: /api/v3/admin/environments/prod-app-x81LmQ/unified-api/sources/garmin
            code: unsupported_operation
  schemas:
    AccountSummary:
      type: object
      properties:
        customer_id:
          type: string
        dev_id_count:
          type: integer
        company:
          $ref: '#/components/schemas/CompanyProfile'
    AgreeToTermsRequest:
      type: object
      properties:
        terms_version:
          type: string
        document:
          type: string
          enum:
            - bundle
            - tos
            - dpa
          description: Which legal document this acceptance covers. Omitted means 'bundle' (the pre-split combined terms).
        accepted_role:
          type:
            - string
            - 'null'
          description: Free-text role of the accepting user at acceptance time (e.g. admin, developer).
      required:
        - terms_version
    BillingState:
      type: object
      properties:
        state:
          type: string
          enum:
            - ok
            - requires_action
        dashboard_url:
          type: string
          description: Where the human finishes 3DS / card entry. Present only with requires_action.
      required:
        - state
    CompanyProfile:
      type:
        - object
        - 'null'
      description: dashboard.company_info row for the customer, joined with its dashboard.company_billing row, or null if no company_info row exists yet. The billing columns (stripe_customer_id, stripe_subscription_id, stripe_metering_type) are never included in the response.
      additionalProperties: true
    CreateDestinationRequest:
      type: object
      properties:
        type:
          type: string
          description: defaults to webhook
        url:
          type: string
        event_types:
          type: array
          items:
            type: string
        active:
          type: boolean
        metadata:
          type: string
          description: advanced-type credential JSON
      required:
        - url
    CreateEnvironmentProfileRequest:
      type: object
      description: dev_id is required and must already exist as a tesseract credential — this does not provision one. name defaults to dev_id; billable defaults to false.
      properties:
        dev_id:
          type: string
        name:
          type: string
        billable:
          type: boolean
      required:
        - dev_id
      additionalProperties: false
    CreateTeamInvitationRequest:
      type: object
      description: 'A new invitation. There is deliberately no company_id and no source: the invited company is the caller''s own, read from the token''s principal, and source is provenance a customer-authenticated caller must not be able to set (it would let an invite grant a capability nobody sanctioned). Both are rejected, not ignored.'
      properties:
        email:
          type: string
          format: email
          description: The address being invited. The claim only succeeds for a user signing in with this address.
        role:
          type: string
          enum:
            - admin
            - developer
          description: The role the invitee gets on joining. superadmin is not assignable, matching PATCH /team/members/{user_id}.
      required:
        - email
        - role
      additionalProperties: false
    DashboardUser:
      type:
        - object
        - 'null'
      description: 'A dashboard.users row: user_id, email, verified, name, phone_number, created_at, last_login, company_id, role. No credential material — passwords live in dashboard.auth_keys, a separate table this surface never reads. null when the caller''s token has no resolvable own user (see PatchMeRequest''s description).'
      additionalProperties: true
    DataToken:
      type: object
      properties:
        token:
          type: string
          description: The bearer (terra_dt_*). Shown once at mint.
        token_id:
          type: string
        dev_id:
          type: string
        scopes:
          type: array
          items:
            type: string
        name:
          type: string
        created_at:
          type: string
          format: date-time
        expires_at:
          type:
            - string
            - 'null'
          format: date-time
          description: Expiry; null = never expires.
        last_used_at:
          type:
            - string
            - 'null'
          format: date-time
        revoked_at:
          type:
            - string
            - 'null'
          format: date-time
      required:
        - token_id
        - dev_id
        - scopes
        - name
        - created_at
        - expires_at
    DestinationSummary:
      type: object
      properties:
        id:
          type: string
          description: string-encoded 64-bit id
        type:
          type: string
        url:
          type: string
        active:
          type: boolean
        event_types:
          type: array
          items:
            type: string
      required:
        - id
        - type
        - url
        - active
    DevDetail:
      type: object
      properties:
        dev_id:
          type: string
        name:
          type: string
        label:
          type: string
        active:
          type: boolean
        billable:
          type: boolean
        profile:
          $ref: '#/components/schemas/EnvironmentProfile'
        api_key_masked:
          type: string
        signing_secret_masked:
          type: string
        user_limit:
          type: integer
          format: int64
    DevKeys:
      type: object
      properties:
        dev_id:
          type: string
        api_key:
          type: string
          description: full client_secret — returned once, keys:read only
        signing_secret:
          type: string
    DevSummary:
      type: object
      properties:
        dev_id:
          type: string
        name:
          type: string
        label:
          type: string
        active:
          type: boolean
        billable:
          type: boolean
        profile:
          $ref: '#/components/schemas/EnvironmentProfile'
    DeviceStartFormRequest:
      type: object
      description: RFC 8628 §3.1 device authorization request (form-encoded wire mode).
      properties:
        client_id:
          type: string
          description: Public client identifier; recorded as the pairing session's client name.
        scope:
          type: string
          description: Space-separated scopes; omitted = the default grantable set. The device flow issues an admin token, so the grantable names are the ones the adminToken scope registry marks `admin` or `both` in x-scope-planes. Data-plane names are rejected with 400 invalid_scope.
          x-scope-plane: admin
        requested_dev_ids:
          type: string
          description: Optional space-separated audience dev-ids (Terra extension parameter). Omitted = the whole account. Account-level scopes cannot be combined with an audience.
      required:
        - client_id
    DeviceStartResponse:
      type: object
      description: RFC 8628 §3.2 device authorization response. The four fields the RFC requires are required here; a client that cannot read device_code has no way to poll.
      properties:
        device_code:
          type: string
        user_code:
          type: string
        verification_uri:
          type: string
        expires_in:
          type: integer
        verification_uri_complete:
          type: string
        interval:
          type: integer
          description: 'Polling interval in seconds. RFC 8628 §3.2: absent means 5.'
      required:
        - device_code
        - user_code
        - verification_uri
        - expires_in
    DryRunResult:
      type: object
      description: Returned by any mutating endpoint invoked with ?dry_run=true.
      properties:
        dry_run:
          type: boolean
          enum:
            - true
        would:
          type: string
          description: the action that would be taken
        preview:
          type: object
      required:
        - dry_run
        - would
        - preview
    EnsureReferralCodeRequest:
      type: object
      properties:
        referral_code:
          type: string
      required:
        - referral_code
    Entitlement:
      type: object
      properties:
        capability:
          type: string
        source:
          type: string
    EnvironmentProfile:
      type:
        - object
        - 'null'
      description: 'The dev-id''s environment profile, or null when no profile row exists yet (POST /environments creates one for an existing credential). Exactly one of widget_config_url / widget_config is served per deployment: widget_config_url (an S3 indirection) on legacy deployments, the inlined widget_config after the environments release.'
      properties:
        dev_id:
          type: string
        company_id:
          type: string
        name:
          type: string
        billable:
          type:
            - boolean
            - 'null'
        widget_config_url:
          type:
            - string
            - 'null'
          description: Legacy only — replaced by widget_config after the environments release.
        widget_config:
          type:
            - object
            - 'null'
          description: The widget configuration document, served inline. Environments-release deployments only.
          additionalProperties: true
        widget_name:
          type:
            - string
            - 'null'
        app_logo:
          type:
            - string
            - 'null'
      additionalProperties: false
    EventRecord:
      type: object
      properties:
        event_id:
          type: string
        sent_at:
          type: string
          format: date-time
        data_type:
          type: string
        provider:
          type: string
        destination_type:
          type: string
        http_status:
          type: integer
        response_time_ms:
          type: integer
          format: int64
        bytes:
          type: integer
          format: int64
        connection_id:
          type: string
          description: string-encoded 64-bit id
    InvoiceSummary:
      type: object
      properties:
        id:
          type: string
        status:
          type: string
        amount_due:
          type: integer
          format: int64
        currency:
          type: string
        created_at:
          type:
            - string
            - 'null'
          format: date-time
        hosted_invoice_url:
          type: string
        invoice_pdf:
          type: string
    DocsAskRequest:
      type: object
      properties:
        question:
          type: string
          description: The question, in natural language.
          maxLength: 4000
      required:
        - question
    DocsAskResponse:
      type: object
      properties:
        answer:
          type: string
          description: The answer as markdown, with footnote markers referring to sources. Empty when nothing was found.
        confidence:
          type: string
          enum:
            - high
            - medium
            - low
            - unknown
          description: How sure the search is of the answer. `unknown` means it returned no rating.
        sources:
          type: array
          description: The pages the answer came from. Empty when there are none.
          items:
            $ref: '#/components/schemas/DocsSource'
      required:
        - answer
        - confidence
        - sources
    DocsSource:
      type: object
      description: One documentation page the answer drew on.
      properties:
        label:
          type: string
          description: The footnote marker the answer refers to, e.g. "1".
        title:
          type: string
        description:
          type: string
        url:
          type: string
        type:
          type: string
          description: What kind of record the source is, such as documentation.
        breadcrumbs:
          type: array
          description: Where the page sits in the documentation navigation.
          items:
            type: string
      required:
        - url
    MeMetadata:
      type: object
      description: 'The calling principal''s own dashboard.user_metadata, restricted to analytics_layout and preferences — debug_layout is internal and never exposed on this surface. Both values pass through as opaque JSON: the server does not interpret or validate their shape.'
      properties:
        analytics_layout:
          type:
            - object
            - 'null'
        preferences:
          type:
            - object
            - 'null'
    MeResponse:
      type: object
      properties:
        token_id:
          type: string
        kind:
          type: string
          enum:
            - admin
            - session
            - data
          description: The credential class. `admin` and `session` authenticate the admin API, `data` the data API; the planes are walled, so an admin token never authenticates the data API and vice versa. `session` is a short-lived per-login dashboard credential and never appears in token lists.
        customer_id:
          type: string
        scopes:
          type: array
          items:
            type: string
        dev_ids:
          type:
            - array
            - 'null'
          description: 'Audience: the dev-ids this token may act on. null = every dev of the account.'
          items:
            type: string
        name:
          type: string
        created_via:
          type: string
        expires_at:
          type:
            - string
            - 'null'
          format: date-time
          description: Expiry; null = never expires.
        grant_anchor_at:
          type: string
          format: date-time
        last_used_at:
          type:
            - string
            - 'null'
          format: date-time
        user:
          $ref: '#/components/schemas/DashboardUser'
        staff:
          type: boolean
          description: Terra-staff signal read from the staff grant table for the resolved user; false whenever user is null. Gate staff-only UI on this, never on an email suffix.
    MintDataTokenRequest:
      type: object
      properties:
        name:
          type: string
        scopes:
          type: array
          description: Data-plane scopes only (e.g. ["auth:write"] for an SDK-authentication-only token) — the names the adminToken scope registry marks `data` or `both` in x-scope-planes. Admin-plane names are rejected with 400 validation_failed.
          items:
            type: string
          x-scope-plane: data
        expires_in_days:
          type: integer
          description: Default 365 (restricted-key shape), max 1825. Mutually exclusive with never_expires.
          minimum: 1
          maximum: 1825
        never_expires:
          type: boolean
          description: Mint a non-expiring credential (the primary 'API key' shape). Mutually exclusive with expires_in_days. Safe because tokens — unlike the legacy secret — are revocable, coexisting, and per-credential observable.
      required:
        - name
        - scopes
    ModelCatalogEntry:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        data_type:
          type: string
    ModelRunRecord:
      type: object
      properties:
        run_id:
          type: string
        user_id:
          type: string
        model:
          type: string
        status:
          type: string
        error:
          type: string
        latency_ms:
          type: integer
        start_time:
          type: string
          format: date-time
        end_time:
          type: string
          format: date-time
        submitted_at:
          type: string
          format: date-time
        output_truncated:
          type: boolean
        output:
          description: The run's JSON output; a JSON string when output_truncated is true.
      required:
        - run_id
        - user_id
        - model
        - status
        - latency_ms
        - start_time
        - end_time
        - submitted_at
        - output_truncated
        - output
    OAuthError:
      type: object
      description: RFC 6749 §5.2 error envelope, returned to form-encoded (RFC 8628 wire mode) requests.
      properties:
        error:
          type: string
          enum:
            - invalid_request
            - invalid_scope
            - invalid_grant
            - unsupported_grant_type
            - authorization_pending
            - slow_down
            - access_denied
            - expired_token
            - server_error
        error_description:
          type: string
      required:
        - error
    OAuthTokenResponse:
      type: object
      description: RFC 6749 §5.1 token response, returned to form-encoded (RFC 8628 wire mode) polls. No refresh tokens are issued — rotate via POST /tokens/self/rotate instead.
      properties:
        access_token:
          type: string
        token_type:
          type: string
          enum:
            - Bearer
        expires_in:
          type: integer
          description: Seconds until the access token expires. Omitted when the token never expires.
        scope:
          type: string
          description: Space-separated granted scopes.
        token_id:
          type: string
          format: uuid
      required:
        - access_token
        - token_type
        - scope
        - token_id
    OnboardingInfo:
      type: object
      description: dashboard.onboarding_info row for the customer. password is never returned; has_password reports whether one is set.
      additionalProperties: true
    PatchCompanyRequest:
      type: object
      description: Partial update of dashboard.company_info. Every property is optional; unknown fields, created_at, and the billing columns (stripe_customer_id, stripe_subscription_id, stripe_metering_type — they live in dashboard.company_billing, which this route does not write) are rejected with 400.
      properties:
        name:
          type: string
        billing_email:
          type: string
        website_url:
          type: string
        learn_about_us:
          type: string
        onboarded:
          type: boolean
        app_logo:
          type:
            - string
            - 'null'
        description:
          type:
            - string
            - 'null'
        org_name:
          type:
            - string
            - 'null'
        tos_url:
          type:
            - string
            - 'null'
        privacy_policy_url:
          type:
            - string
            - 'null'
        data_usage_description:
          type:
            - string
            - 'null'
        widget_name:
          type:
            - string
            - 'null'
        user_flow_done:
          type: boolean
        agreed_to_terms_at:
          type:
            - string
            - 'null'
          format: date-time
      additionalProperties: false
      minProperties: 1
    PatchDestinationRequest:
      type: object
      properties:
        active:
          type: boolean
        event_types:
          type: array
          items:
            type: string
    PatchEnvironmentProfileRequest:
      type: object
      description: 'Display fields only; the widget columns and the data-type selection have their own PUT surfaces. `active` is deliberately absent: writing it means round-tripping the credential''s whole data-type set, so a second writer here would silently lose a concurrent data-type change. It stays on the v2 route until a field-level RPC exists. Every field is optional and an omitted one is left unchanged; at least one is required.'
      properties:
        name:
          type: string
        billable:
          type: boolean
      additionalProperties: false
      minProperties: 1
    PatchMeMetadataRequest:
      type: object
      description: Partial upsert of the calling principal's own user_metadata. Every property is optional; at least one is required. analytics_layout/preferences replace the stored value wholesale; preferences_merge shallow-merges its top-level keys into the stored preferences atomically (concurrent writers cannot erase each other's keys) and is mutually exclusive with preferences. Values pass through as opaque JSON otherwise.
      properties:
        analytics_layout:
          type: object
        preferences:
          type: object
        preferences_merge:
          type: object
      minProperties: 1
    PatchMeRequest:
      type: object
      description: Partial update of the calling principal's own dashboard.users row. Every property is optional; at least one is required. Gated on account:write (in the default mint set); the write is strictly self-scoped. Requires the token to resolve to an own user (see DashboardUser) — otherwise 404 not_found.
      properties:
        name:
          type: string
        phone_number:
          type:
            - string
            - 'null'
      minProperties: 1
    PatchOnboardingRequest:
      type: object
      description: 'Partial update of dashboard.onboarding_info. Upserts: the row is created first if it does not exist yet, then these fields are applied.'
      properties:
        destination:
          type:
            - string
            - 'null'
        scheme:
          type:
            - string
            - 'null'
        host:
          type:
            - string
            - 'null'
        port:
          type:
            - string
            - 'null'
        username:
          type:
            - string
            - 'null'
        password:
          type:
            - string
            - 'null'
        path:
          type:
            - string
            - 'null'
        providers:
          type:
            - array
            - 'null'
          items:
            type: string
      additionalProperties: false
    PatchScoreRequest:
      type: object
      description: At least one of active/weights required.
      properties:
        active:
          type: boolean
        weights:
          type: object
          additionalProperties:
            type: integer
      minProperties: 1
    PatchTeamMemberRequest:
      type: object
      description: Partial update of a teammate's dashboard.users row. Every property is optional; at least one is required. Email, company_id and the rest of the row are not reassignable here.
      properties:
        name:
          type: string
        phone_number:
          type:
            - string
            - 'null'
        role:
          type:
            - string
            - 'null'
          enum:
            - admin
            - developer
            - null
          description: The member's dashboard role. superadmin is recognised by the dashboard but is not assignable here — the dashboard's own team editor never offers it.
      minProperties: 1
    PatchWorkoutMetadataRequest:
      type: object
      description: pace_units is required (object or null); unlike PUT this overwrites unconditionally — a null clears the column.
      properties:
        pace_units:
          type:
            - object
            - 'null'
          additionalProperties: true
      required:
        - pace_units
      additionalProperties: false
    PaymentMethodSummary:
      type: object
      properties:
        brand:
          type: string
        last4:
          type: string
        exp_month:
          type: integer
          format: int64
        exp_year:
          type: integer
          format: int64
        has_card:
          type: boolean
    Problem:
      allOf:
        - $ref: '#/components/schemas/schemas-Problem'
        - $ref: '#/components/schemas/ProblemExtensions'
    ProblemExtensions:
      type: object
      description: 'The admin surface''s additions to the shared RFC 9457 Problem in specs/components/common.yaml, which contributes type/title/instance/detail. Composed with it via allOf in apis/admin.yaml rather than restated, so the two cannot drift. No `status`: httptools.Problem.MarshalJSON never writes it — the response line is authoritative.'
      properties:
        code:
          type: string
          enum:
            - access_denied
            - audience_restricted
            - authorization_pending
            - billing_unavailable
            - conflict
            - dependency_failed
            - dev_id_not_found
            - device_code_expired
            - idempotency_key_reuse
            - internal_error
            - not_claimable
            - not_found
            - not_ready
            - rate_limited
            - rotation_conflict
            - rotation_expired
            - scope_missing
            - service_unavailable
            - slow_down
            - token_expired
            - token_limit_reached
            - token_not_found
            - unauthorized
            - unsupported_operation
            - validation_failed
          description: Stable error code — branch on this, not on prose.
        remediation:
          type: string
          description: How an agent can recover.
        errors:
          type: array
          description: 'Field-level validation errors ("field: message").'
          items:
            type: string
      required:
        - code
    ProcessingType:
      type: object
      properties:
        type:
          type: string
          enum:
            - json
            - fit
            - fhir
        display_name:
          type: string
        selected:
          type: boolean
      required:
        - type
        - display_name
        - selected
    ProviderCredentialMaterial:
      type: object
      properties:
        provider_client_id:
          type: string
        provider_client_secret_masked:
          type: string
    ProviderCredentialWrite:
      type: object
      properties:
        client_id:
          type: string
          description: The customer's OAuth client id for this provider.
        client_secret:
          type: string
          description: The customer's OAuth client secret (write-only; reads are masked).
        redirect_url:
          type: string
          description: Override the OAuth redirect URL (defaults to the provider default).
