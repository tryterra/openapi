                    user_id: 00000000-0000-0000-0000-000000000101
                    model: sleep-quality
                    status: success
                    latency_ms: 412
                    start_time: '2026-07-09T00:00:00Z'
                    end_time: '2026-07-16T00:00:00Z'
                    submitted_at: '2026-07-16T09:14:02.113Z'
                    output_truncated: false
                    output:
                      score: 82
