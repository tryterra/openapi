  /environments/{dev_id}/tokens:
    get:
      operationId: listDataTokens
      tags:
        - tokens
      summary: List a dev-id's data tokens
      description: Data tokens (terra_dt_*) are the dev-scoped data-plane credential — the successor to the client_secret. Metadata only; re-showing a bearer is the separate keys:read-gated GET /tokens/{token_id}/secret.
      security:
        - adminToken:
            - tokens:read
      parameters:
        - $ref: '#/components/parameters/DevId'
      responses:
        '200':
          description: The dev-id's data tokens.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/DataToken'
                  has_more:
                    type: boolean
                  next_cursor:
                    type:
                      - string
                      - 'null'
                required:
                  - data
                  - has_more
                  - next_cursor
              example:
                data:
                  - token_id: 2b3c4d5e-6f70-4a81-92b3-c4d5e6f70a81
                    dev_id: prod-app-x81LmQ
                    scopes:
                      - auth:write
                    name: sdk-auth-only
                    created_at: '2026-07-03T09:15:00Z'
                    expires_at: '2028-07-03T09:15:00Z'
                    last_used_at: '2026-07-03T09:15:00Z'
                    revoked_at: null
                has_more: false
                next_cursor: null
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
    post:
      operationId: mintDataToken
      tags:
        - tokens
      summary: Mint a data token
      description: Creates a dev-scoped, explicitly-scoped, long-lived data-plane token (e.g. auth:write only for SDK authentication). Multiple tokens coexist per dev-id, so rotation = mint new + revoke old — no shared-secret cutover. The bearer is returned at mint and retrievable later via the keys:read-gated /secret sub-resource (API-key DX parity).
      security:
        - adminToken:
            - tokens:write
      parameters:
        - $ref: '#/components/parameters/DevId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MintDataTokenRequest'
      responses:
        '201':
          description: The minted token (bearer shown once).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataToken'
              example:
                token: terra_dt_Xp4…shown-once…9zA
                token_id: 2b3c4d5e-6f70-4a81-92b3-c4d5e6f70a81
                dev_id: prod-app-x81LmQ
                scopes:
                  - auth:write
                name: sdk-auth-only
                created_at: '2026-07-03T09:15:00Z'
                expires_at: '2028-07-03T09:15:00Z'
                last_used_at: null
                revoked_at: null
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
