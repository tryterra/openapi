      summary: Replace which data types are selected
      security:
        - adminToken:
            - dataconfig:write
      parameters:
        - $ref: '#/components/parameters/DevId'
        - $ref: '#/components/parameters/IdempotencyKey'
      description: 'Sets WHICH data types this environment collects, wholesale — the PATCH on this path sets the fields within one data type. Send the complete desired set: anything omitted is deselected, and nothing is read back first, so a concurrent edit is never silently reinstated. ATHLETE is always selected and need not be sent; SAMPLES is the per-row samples flag, not a data type; HEALTH_OBSERVATION is 403 access_denied unless the account holds the health_observation entitlement. Gated dataconfig:write rather than account:write so an environment''s data scopes stay editable by every role that can configure data.'
