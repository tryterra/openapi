$schema: https://json-schema.org/draft/2020-12/schema
type: object
properties:
  name:
    type: string
    description: Name of the workout
  description:
    anyOf:
      - type: string
      - type: "null"
    description: Description of the workout
  environment:
    anyOf:
      - $ref: EnvironmentType.yaml
      - type: "null"
  pool_length_meters:
    anyOf:
      - type: number
      - type: "null"
    description: Pool length in meters, for swim workouts
  step_blocks:
    type: array
    items:
      $ref: StepBlock.yaml
  estimated_duration_seconds:
    anyOf:
      - type: number
      - type: "null"
    description: Estimated total duration in seconds
  estimated_distance_meters:
    anyOf:
      - type: number
      - type: "null"
    description: Estimated total distance in meters
  estimated_calories:
    anyOf:
      - type: number
      - type: "null"
    description: Estimated calories burned
  estimated_tss:
    anyOf:
      - type: number
      - type: "null"
    description: Planned training stress score (0-9999), where the provider or author supplies one. Forwarded to TrainingPeaks, which ignores it when any step target is not RPE and derives it from the structure instead.
  estimated_intensity_factor:
    anyOf:
      - type: number
      - type: "null"
    description: Planned intensity factor (0-5), where the provider or author supplies one. Forwarded to TrainingPeaks, which ignores it when any step target is not RPE and derives it from the structure instead.
  workout_id:
    anyOf:
      - type: string
      - type: "null"
    description: Terra identifier of the stored template. Set by Terra in responses; ignored on create.
  sport:
    $ref: PlannedWorkoutSport.yaml
required:
  - name
  - step_blocks
  - sport
description: "The body of a planned workout: a WorkoutTemplate whose sport may be `unspecified` when it was created on the provider side"
