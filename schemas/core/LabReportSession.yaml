$schema: https://json-schema.org/draft/2020-12/schema
type: object
properties:
  session_id:
    type: string
    examples:
      - "297405620317847552"
  upload_id:
    type: string
  reference_id:
    type: string
    description: Your external reference; omitted if not set.
  report_type:
    $ref: ReportType.yaml
    examples:
      - lab
    description: 'What kind of report this is, as a clean lowercase string (open enum — handle unknown values gracefully). "lab" for a clinical lab report, "dexa" for a DXA body-composition or bone-density scan, "unspecified" while the report is still being classified. Switch on this before reading results: dexa results are scoped by biomarker.region, lab results by biomarker.specimen.'
  current_status:
    type: string
    examples:
      - sent
    description: "Current status as a clean lowercase string (open enum — handle unknown values gracefully). In flight: processing, processed, standardizing, standardized, sending, and retry_scheduled (waiting to retry after a temporary model-provider error; the report is still being worked on). Terminal: sent, partially_sent (delivered to some destinations), delivery_failed (processed and results available, but no destination accepted the delivery), failed (see error), cancelled, deleted."
  uploaded_at:
    type: string
    format: date-time
  updated_at:
    type: string
    format: date-time
  report_date:
    type: string
    description: Date printed on the report (YYYY-MM-DD); omitted if not extracted.
  report_time:
    type: string
    description: Time printed on the report (HH:MM, 24-hour); omitted if not extracted.
  collection_date:
    type: string
    description: Date the sample was collected or the scan was taken (YYYY-MM-DD); omitted if not extracted.
  collection_time:
    type: string
    description: Time the sample was collected or the scan was taken (HH:MM, 24-hour); omitted if not extracted.
  report_locale:
    type: string
    examples:
      - en-GB
  lab_name:
    type: string
  patient_age_at_collection:
    type: integer
    description: Patient age in years; omitted if unknown.
  patient_sex:
    type: string
    examples:
      - female
    description: Clean lowercase string (open enum); omitted if unspecified.
  input_bytes:
    type: integer
  results_count:
    type: integer
  output_bytes:
    type: integer
  file_count:
    type: integer
  status_history:
    type: array
    items:
      $ref: LabReportStatusEntry.yaml
  results:
    type: array
    items:
      $ref: LabReportResult.yaml
    description: The layered biomarker results. Populated on retrieve, not on list.
  panels:
    type: array
    items:
      $ref: LabReportPanel.yaml
    description: Report-level panels that results reference by panel_id. Omitted if the report has no panel grouping.
  report_notes:
    type: string
  error:
    $ref: LabReportEventError.yaml
    description: "Why the report failed: the same object the lab_report.failed webhook carries. Present only while current_status is failed."
required:
  - session_id
  - report_type
  - current_status
description: A lab report session. Returned in full on retrieve; list items carry the summary fields only (no results/panels).
