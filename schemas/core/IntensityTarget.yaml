$schema: https://json-schema.org/draft/2020-12/schema
type: object
properties:
  target_type:
    $ref: WorkoutStepTargetType.yaml
  value:
    anyOf:
      - type: number
      - type: "null"
    description: Single target value, in the unit for target_type
  value_low:
    anyOf:
      - type: number
      - type: "null"
    description: Lower bound of the target range, in the unit for target_type. For pace, the lower number is the faster pace
  value_high:
    anyOf:
      - type: number
      - type: "null"
    description: Upper bound of the target range, in the unit for target_type
required:
  - target_type
description: "Target intensity range for a step (e.g. heart-rate or power zone). The unit of value, value_low and value_high depends on target_type: heart_rate in BPM; power in watts; speed in metres per second; pace in seconds per kilometre, so 4:30/km is 270, not 4.5; cadence in rpm or steps per minute; rpe from 1 to 10; heart_rate_zone (1-5) and power_zone (1-7) as zone numbers; the *_percentage types in percent of the athlete parameter given when planning (max_heart_rate, threshold_heart_rate, ftp or threshold_speed)."
