$schema: https://json-schema.org/draft/2020-12/schema
type: object
properties:
  lower:
    type: number
  upper:
    type: number
  type:
    type: string
    description: "Coded range type (open enum: normal, low, high, borderline_low, borderline_high, critical_low, critical_high, abnormal, therapeutic, subtherapeutic, toxic). A lossy coding of `label`, judged from the report's wording and where the band sits among the result's ranges — a prediabetes band between the no-diabetes and diabetes bands is borderline_high. Omitted when nothing in the vocabulary fits."
  label:
    type: string
    description: The range's classification exactly as the report printed it — "Optimal", "Moderate", "Consistent with increased risk for diabetes (prediabetes)". When a result carries several ranges they are bands, not one normal interval; this is the field that says what each band means.
  context:
    $ref: LabReportRangeContext.yaml
description: One reference range. type describes the range, not a verdict on the result.
