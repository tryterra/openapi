$schema: https://json-schema.org/draft/2020-12/schema
type: object
properties:
  total_stress_score:
    anyOf:
      - type: number
      - type: "null"
    examples:
      - 45
    description: Total stress score for the day.
  stress_contributors:
    anyOf:
      - $ref: "#/$defs/RecordFloat"
      - type: "null"
    description: Map of contributing factor name to its weighted contribution to the stress score.
  respiratory_score:
    anyOf:
      - type: number
      - type: "null"
    examples:
      - 88
    description: Respiratory health score for the day.
  respiratory_contributors:
    anyOf:
      - $ref: "#/$defs/RecordFloat"
      - type: "null"
    description: Map of contributing factor name to its weighted contribution to the respiratory score.
  immune_index:
    anyOf:
      - type: integer
      - type: "null"
    examples:
      - 72
    description: Immune system health index for the day.
  immune_contributors:
    anyOf:
      - $ref: "#/$defs/RecordFloat"
      - type: "null"
    description: Map of contributing factor name to its weighted contribution to the immune index.
  resilience_score:
    anyOf:
      - type: integer
      - type: "null"
    examples:
      - 65
    description: Resilience score for the day.
  resilience_contributors:
    anyOf:
      - $ref: "#/$defs/RecordFloat"
      - type: "null"
    description: Map of contributing factor name to its weighted contribution to the resilience score.
  strain_index:
    anyOf:
      - type: number
      - type: "null"
    examples:
      - 12.5
    description: Strain index for the day.
  strain_traffic_light:
    anyOf:
      - type: string
      - type: "null"
    examples:
      - GREEN
    description: Categorical strain rating for the day (e.g. GREEN, AMBER, RED).
  strain_contributors:
    anyOf:
      - $ref: "#/$defs/RecordFloat"
      - type: "null"
    description: Map of contributing factor name to its weighted contribution to the strain index.
  total_stress_score_v2:
    anyOf:
      - type: number
      - type: "null"
    examples:
      - 43
    description: Total stress score for the day, computed by the v2 model.
  total_stress_score_v2_contributors:
    anyOf:
      - $ref: "#/$defs/RecordFloat"
      - type: "null"
    description: Map of contributing factor name to its weighted contribution to the v2 total stress score.
  vo2max:
    anyOf:
      - type: number
      - type: "null"
    examples:
      - 46.5
    description: Resting VO2max estimate for the day, in ml/kg/min, from the ratio of max to measured resting heart rate. Absent without a measured resting heart rate in the last 30 days.
  vo2max_contributors:
    anyOf:
      - $ref: "#/$defs/RecordFloat"
      - type: "null"
    description: "The heart-rate anchors behind the VO2max estimate, in bpm: hr_max and hr_rest."
  vo2max_traffic_light:
    anyOf:
      - type: string
      - type: "null"
    examples:
      - AMBER
    description: "Confidence in the VO2max estimate. A resting estimate is always AMBER: no workout near max heart rate backs it."
  vo2max_method:
    anyOf:
      - type: string
      - type: "null"
    examples:
      - REST
    description: "How the VO2max was estimated: REST (resting and max heart rate)."
  vo2max_reasons:
    anyOf:
      - type: array
        items:
          type: string
      - type: "null"
    description: "Why the VO2max confidence is not GREEN: RESTING_ESTIMATE, and HR_MAX_ESTIMATED when max heart rate came from age."
$defs:
  RecordFloat:
    type: object
    properties: {}
    unevaluatedProperties:
      type: number
