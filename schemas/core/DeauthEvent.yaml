$schema: https://json-schema.org/draft/2020-12/schema
type: object
properties:
  type:
    type: string
    const: deauth
  user:
    $ref: TerraUser.yaml
    description: User who deauthenticated
  status:
    type: string
    const: success
    description: Status of deauthentication
  message:
    type: string
    description: Confirmation message
  reason:
    type: string
    description: "Why the user was deauthenticated, when Terra knows more than that it was requested. `last_device_disconnected`: the last device linked to the user through the mobile SDK disconnected. Absent for a deauthentication you requested."
required:
  - type
  - user
  - status
  - message
allOf:
  - $ref: WebhookEvent.yaml
description: User deauthentication event
