$schema: https://json-schema.org/draft/2020-12/schema
type: object
properties:
  type:
    type: string
    const: clinical_record
  data:
    type: array
    items:
      $ref: ClinicalRecord.yaml
    description: Array of clinical records that are new or whose content changed
  user:
    $ref: TerraUser.yaml
    description: User whose data is being provided
  version:
    type: string
    description: API version
required:
  - type
  - data
  - user
  - version
allOf:
  - $ref: WebhookEvent.yaml
description: "Clinical record data event: Apple Health Records resources, as raw FHIR"
